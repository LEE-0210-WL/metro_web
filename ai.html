<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="theme.css">
<title>AI 地铁问答助手 · 走进新天地·Railway</title>
<link rel="stylesheet" href="https://fonts.cdnfonts.com/css/harmonyos-sans">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'HarmonyOS Sans', -apple-system, "Microsoft YaHei", sans-serif;
    background: #f5f5f5; color: #333; line-height: 1.6; height: 100vh;
    display: flex; flex-direction: column; overflow: hidden;
  }

  /* ========== 顶栏 ==========
     按钮沿用站内统一的 .back-link 风格：深色药丸 / 圆角 6px / 13px / 左侧 16px 图标 */
  .topbar {
    height: 60px; flex: 0 0 60px; background: #fff; border-bottom: 1px solid #e5e7eb;
    display: flex; align-items: center; gap: 8px; padding: 0 16px; position: relative;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px;
    background: #111827; color: #fff; text-decoration: none; border: none;
    border-radius: 6px; font-weight: 500; font-size: 13px; cursor: pointer;
    font-family: inherit; transition: background .3s ease; flex-shrink: 0; white-space: nowrap;
  }
  .pill:hover { background: #374151; }
  .pill svg { width: 16px; height: 16px; flex-shrink: 0; }
  .pill.ghost { background: #f3f4f6; color: #374151; }
  .pill.ghost:hover { background: #e5e7eb; }
  .pill.on { background: #2563eb; color: #fff; }
  .pill.on:hover { background: #1d4ed8; }

  .topbar .title { font-size: 15px; font-weight: 700; color: #111827; margin-left: 4px; white-space: nowrap; }
  .topbar .spacer { flex: 1; }
  .stat { font-size: var(--fs-sm); color: var(--c-text-3); white-space: nowrap; }
  .badge { padding: 3px 10px; border-radius: 999px; font-size: var(--fs-sm); background: #e5e7eb; color: #374151; white-space: nowrap; }
  .badge.paid { background: #111827; color: #fff; }
  #menuBtn { display: none; }

  /* ========== 设置面板 ========== */
  .panel {
    position: absolute; top: 64px; right: 16px; z-index: 80; width: 268px;
    background: #fff; border: 1px solid #e5e7eb; border-radius: 12px;
    box-shadow: 0 8px 28px rgba(0,0,0,.14); padding: 14px 16px; display: none;
  }
  .panel.on { display: block; }
  .panel h3 { font-size: 13px; color: #6b7280; font-weight: 600; margin: 0 0 8px; }
  .panel .row { display: flex; align-items: center; justify-content: space-between; gap: 10px;
                padding: 7px 0; font-size: 13.5px; color: #374151; }
  .panel .row + .row { border-top: 1px solid #f3f4f6; }
  .panel hr { border: none; border-top: 1px solid #e5e7eb; margin: 10px 0; }
  .seg { display: inline-flex; border: 1px solid #d1d5db; border-radius: 8px; overflow: hidden; }
  .seg button { border: none; background: #fff; padding: 4px 10px; font-size: var(--fs-sm);
                cursor: pointer; font-family: inherit; color: #374151; }
  .seg button + button { border-left: 1px solid #d1d5db; }
  .seg button.on { background: #111827; color: #fff; }
  .sw { position: relative; width: 38px; height: 21px; flex-shrink: 0; }
  .sw input { opacity: 0; width: 0; height: 0; }
  .sw span { position: absolute; inset: 0; background: #d1d5db; border-radius: 999px;
             cursor: pointer; transition: background .2s; }
  .sw span::before { content: ''; position: absolute; width: 15px; height: 15px; left: 3px; top: 3px;
                     background: #fff; border-radius: 50%; transition: transform .2s; }
  .sw input:checked + span { background: #2563eb; }
  .sw input:checked + span::before { transform: translateX(17px); }

  /* ========== 布局 ========== */
  .body { flex: 1; display: flex; min-height: 0; }

  /* ---- 会话侧栏 ---- */
  .side { width: 252px; flex: 0 0 252px; background: #fff; border-right: 1px solid #e5e7eb;
          display: flex; flex-direction: column; min-height: 0; }
  .side .newbtn { margin: 12px; padding: 9px 0; background: #111827; color: #fff; border: none;
                  border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; }
  .side .newbtn:hover { background: #374151; }
  .side .newbtn:disabled { background: #9ca3af; cursor: not-allowed; }
  .convlist { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
  .conv { display: flex; align-items: center; gap: 4px; padding: 8px 8px 8px 10px; border-radius: 8px;
          cursor: pointer; font-size: 13.5px; color: #374151; margin-bottom: 2px; }
  .conv:hover { background: #f3f4f6; }
  .conv.active { background: #eef2ff; color: #1d4ed8; }
  .conv .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv .when { font-size: var(--fs-xs); color: var(--c-text-3); white-space: nowrap; }
  .conv .ico { opacity: 0; border: none; background: none; color: var(--c-text-3); cursor: pointer;
               font-size: 13px; line-height: 1; padding: 2px 4px; font-family: inherit; }
  .conv:hover .ico { opacity: 1; }
  .conv .ico:hover { color: #111827; }
  .conv .ico.del:hover { color: #dc2626; }
  .side .empty { color: var(--c-text-3); font-size: var(--fs-sm); padding: 8px 12px; }

  /* ---- 主区 ---- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
  #chat { flex: 1; overflow-y: auto; padding: 20px 16px 8px; }
  .inner { max-width: 800px; margin: 0 auto; }

  .msg { margin-bottom: 16px; }
  .msg .line { display: flex; }
  .msg.user .line { justify-content: flex-end; }
  .msg .bubble { max-width: 88%; padding: 10px 13px; border-radius: 12px; font-size: 14.5px;
                 word-break: break-word; overflow-wrap: anywhere; }
  .msg.user .bubble { background: #111827; color: #fff; border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .msg.ai .bubble { background: #fff; color: #111827; box-shadow: 0 1px 3px rgba(0,0,0,.06);
                    border-bottom-left-radius: 4px; }
  .msg.sys .line { justify-content: center; }
  .msg.sys .bubble { background: #fef2f2; color: #b91c1c; font-size: 13px; max-width: 100%; }

  /* ---- 消息下方：时间 + 操作按钮 + 用量 ----
     按钮明显放大：13px / 药丸 / 描边，未悬停也能看清 */
  .acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 7px;
          opacity: 0; transition: opacity .15s; }
  .msg:hover .acts, body.always-acts .acts { opacity: 1; }
  .msg.user .acts { justify-content: flex-end; }
  .acts .time { font-size: 12px; color: var(--c-text-3); }
  .acts button {
    display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px;
    font-size: 13px; font-weight: 500; font-family: inherit; cursor: pointer;
    background: #fff; color: #374151; border: 1px solid #d1d5db; border-radius: 6px;
    transition: all .2s ease;
  }
  .acts button:hover { background: #f3f4f6; border-color: #9ca3af; color: #111827; }
  .acts button.primary { border-color: #2563eb; color: #2563eb; }
  .acts button.primary:hover { background: #eff6ff; }
  .acts button svg { width: 14px; height: 14px; flex-shrink: 0; }
  .meta { margin-top: 5px; font-size: var(--fs-sm); color: var(--c-text-3); display: flex; gap: 12px; flex-wrap: wrap; }
  .meta .usage { color: #6b7280; }
  body.hide-usage .meta .usage { display: none; }
  body.hide-kb .meta .kb { display: none; }

  .cursor::after { content: '▊'; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---- AI 气泡里的 Markdown ---- */
  .bubble.md > :first-child { margin-top: 0; }
  .bubble.md > :last-child { margin-bottom: 0; }
  .bubble.md p { margin: 0 0 8px; }
  .bubble.md h3, .bubble.md h4, .bubble.md h5 { font-size: 1.05em; margin: 12px 0 6px; color: #111827; }
  .bubble.md ul, .bubble.md ol { margin: 0 0 8px; padding-left: 22px; }
  .bubble.md li { margin-bottom: 3px; }
  .bubble.md code { background: #eef2f7; padding: 1px 5px; border-radius: 4px;
                    font-family: Consolas, "Courier New", monospace; font-size: 0.9em; }
  .bubble.md pre { background: #0f172a; color: #e2e8f0; padding: 10px 12px; border-radius: 8px;
                   overflow-x: auto; margin: 0 0 8px; }
  .bubble.md pre code { background: none; color: inherit; padding: 0; font-size: 0.92em; }
  /* LaTeX / Markdown 表格：圆角 + 列多时可横向滚动（不再撑破气泡） */
  .bubble.md .tbl-wrap { margin: 0 0 8px; border: 1px solid #d1d5db; border-radius: 10px;
                         overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .bubble.md table { border-collapse: separate; border-spacing: 0; width: 100%; margin: 0;
                     font-size: 0.9em; }   /* 相对字号，跟随「字号」设置一起缩放 */
  .bubble.md th, .bubble.md td { border: none; border-right: 1px solid #d1d5db;
                                 border-bottom: 1px solid #d1d5db; padding: 5px 8px; text-align: left; }
  .bubble.md tr:last-child > th, .bubble.md tr:last-child > td { border-bottom: none; }
  .bubble.md th:last-child, .bubble.md td:last-child { border-right: none; }
  .bubble.md th { background: #f1f5f9; font-weight: 600; }
  .bubble.md a { color: #2563eb; }
  .bubble.md blockquote { border-left: 3px solid #d1d5db; margin: 0 0 8px; padding-left: 10px; color: #6b7280; }

  /* 字号设置 */
  body[data-font="sm"] .msg .bubble { font-size: 13.5px; }
  body[data-font="md"] .msg .bubble { font-size: 14.5px; }
  body[data-font="lg"] .msg .bubble { font-size: 16.5px; }

  .intro { color: #6b7280; font-size: 13.5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
  .chip { border: 1px solid #d1d5db; background: #fff; border-radius: 999px; padding: 5px 12px;
          font-size: 13px; color: #374151; cursor: pointer; font-family: inherit; }
  .chip:hover { border-color: #111827; }
  a.chip { text-decoration: none; display: inline-block; line-height: 1.6; }
  .chip-primary { background: #111827; color: #fff; border-color: #111827; font-weight: 500; }
  .chip-primary:hover { background: #374151; border-color: #374151; color: #fff; }

  #toBottom { position: absolute; right: 22px; bottom: 118px; width: 40px; height: 40px; border-radius: 50%;
              background: #fff; border: 1px solid #e5e7eb; box-shadow: 0 2px 8px rgba(0,0,0,.12);
              cursor: pointer; color: #374151; display: none; z-index: 20;
              align-items: center; justify-content: center; padding: 0; }
  #toBottom.show { display: flex; }
  #toBottom:hover { border-color: #9ca3af; color: #111827; }
  #toBottom svg { width: 20px; height: 20px; }

  /* 轻提示（点 + 按钮时告知暂未开放） */
  #toast { position: fixed; left: 50%; bottom: 104px; transform: translateX(-50%) translateY(8px);
           background: #111827; color: #fff; padding: 9px 16px; border-radius: 8px; font-size: 13px;
           opacity: 0; pointer-events: none; transition: all .25s; z-index: 200;
           max-width: 88vw; text-align: center; line-height: 1.5; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .composer { flex: 0 0 auto; padding: 12px 16px 14px; background: #fff; border-top: 1px solid #e5e7eb; }
  .composer .inner2 { max-width: 800px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; padding: 11px 13px; border: 1px solid #d1d5db; border-radius: 10px;
             font-size: 14px; font-family: inherit; resize: none; min-height: 46px; max-height: 160px; line-height: 1.5; }
  textarea:focus { outline: none; border-color: #2563eb; }
  .send { padding: 11px 22px; background: #111827; color: #fff; border: none; border-radius: 6px;
          font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .send:hover { background: #374151; }
  .send.stop { background: #dc2626; }
  .send.stop:hover { background: #b91c1c; }
  .send:disabled { background: #9ca3af; cursor: not-allowed; }

  /* 发送左边的 + 按钮（图片/文件上传入口，暂未开放） */
  .attach { flex: 0 0 auto; width: 46px; height: 46px; padding: 0; border-radius: 6px;
            background: #f3f4f6; color: var(--c-text-3); border: 1px solid #e5e7eb; cursor: pointer;
            font-family: inherit; display: inline-flex; align-items: center; justify-content: center;
            transition: background .2s ease, color .2s ease, border-color .2s ease; }
  .attach:hover { background: #e5e7eb; color: #6b7280; border-color: #d1d5db; }
  .attach:active { transform: scale(.96); }
  .attach svg { width: 20px; height: 20px; }

  /* 默认页的功能说明 */
  .intro-note { margin-top: 12px; padding: 9px 12px; border-radius: 8px; font-size: var(--fs-sm);
                background: #fffbeb; color: #92400e; border: 1px solid #fde68a; line-height: 1.65; }
  .intro-note b { color: #78350f; }
  .hint { font-size: var(--fs-sm); color: var(--c-text-3); margin-top: 7px; text-align: center; }

  @media (max-width: 720px) {
    #menuBtn { display: inline-flex; }
    .topbar { padding: 0 10px; gap: 6px; }
    .topbar .title { display: none; }
    .pill { padding: 6px 10px; font-size: var(--fs-sm); }
    .pill .label { display: none; }
    .panel { right: 10px; left: 10px; width: auto; }
    .side { position: fixed; top: 60px; bottom: 0; left: 0; z-index: 50;
            transform: translateX(-100%); transition: transform .2s; box-shadow: 2px 0 12px rgba(0,0,0,.12); }
    .side.open { transform: none; }
    #chat { padding: 14px 12px 8px; }
    .msg .bubble { max-width: 94%; }
    .acts { opacity: 1; }          /* 手机上按钮常显，不然根本点不到 */
    #toBottom { right: 14px; bottom: 120px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <button class="pill" id="menuBtn" title="会话列表" aria-label="会话列表">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>

  <a class="pill ghost" href="tools" title="返回工具页">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
    </svg>
    <span class="label">返回工具页</span>
  </a>

  <strong class="title">AI 地铁问答助手</strong>
  <span class="badge" id="planBadge">未登录</span>
  <span class="stat" id="quotaText"></span>
  <span class="spacer"></span>

  <button class="pill ghost" id="settingsBtn" title="设置">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
    <span class="label">设置</span>
  </button>

  <a class="pill" href="account.html" title="账户 / 套餐">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
    </svg>
    <span class="label">账户 / 套餐</span>
  </a>

  <!-- 设置面板 -->
  <div class="panel" id="panel">
    <h3>显示</h3>
    <div class="row"><span>字号</span>
      <span class="seg" id="fontSeg">
        <button data-font="sm">小</button><button data-font="md">中</button><button data-font="lg">大</button>
      </span>
    </div>
    <div class="row"><span>显示 token 用量</span>
      <label class="sw"><input type="checkbox" id="setUsage"><span></span></label>
    </div>
    <div class="row"><span>显示参考来源</span>
      <label class="sw"><input type="checkbox" id="setKb"><span></span></label>
    </div>
    <div class="row"><span>自动滚动到底部</span>
      <label class="sw"><input type="checkbox" id="setScroll"><span></span></label>
    </div>
    <div class="row"><span>操作按钮常显</span>
      <label class="sw"><input type="checkbox" id="setActs"><span></span></label>
    </div>
    <hr>
    <h3>本次会话</h3>
    <div class="row"><span>提问次数</span><strong id="stCalls">0</strong></div>
    <div class="row"><span>输入 tokens</span><strong id="stIn">0</strong></div>
    <div class="row"><span>输出 tokens</span><strong id="stOut">0</strong></div>
    <hr>
    <div class="row"><span>清空本地设置</span>
      <button class="pill ghost" id="resetBtn" style="padding:4px 10px;font-size:var(--fs-sm)">重置</button>
    </div>
  </div>
</div>

<div class="body">
  <aside class="side" id="side">
    <button class="newbtn" id="newBtn">＋ 新建对话</button>
    <div class="convlist" id="convList"></div>
  </aside>

  <section class="main">
    <div id="chat"><div class="inner" id="chatInner"></div></div>
    <button id="toBottom" title="回到底部" aria-label="回到底部">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="composer">
      <div class="inner2">
        <textarea id="input" rows="1" placeholder="问点深圳地铁的事，比如：车公庙站能换乘哪些线路？"></textarea>
        <button class="attach" id="attachBtn"
                title="图片理解与文件上传将在正式公开或二次内测时提供"
                aria-label="上传图片（暂未开放）">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
        <button class="send" id="sendBtn">发送</button>
      </div>
      <div class="hint">回答基于本站知识库生成，仅供参考；卫生间等设施请以现场实际指引为准。</div>
    </div>
  </section>
</div>

<div id="toast"></div>

<script>
(function () {
  'use strict';

  // 走本站同源代理（functions/api-auth），避免 *.workers.dev 在国内被 DNS 污染导致直连失败
  var API_BASE = '/api-auth';
  var TOKEN_KEY = 'metro_token';
  var SET_KEY = 'metro_ai_settings';

  var $ = function (id) { return document.getElementById(id); };
  var chatEl = $('chat'), innerEl = $('chatInner'), inputEl = $('input'), sendBtn = $('sendBtn');
  var convListEl = $('convList'), newBtn = $('newBtn'), sideEl = $('side'), toBottomBtn = $('toBottom');
  var panelEl = $('panel');

  var token = localStorage.getItem(TOKEN_KEY) || '';
  var conversations = [];
  var currentId = null;
  var busy = false;
  var abortCtrl = null;
  var stickBottom = true;

  // ===== 设置 =====
  var DEFAULTS = { font: 'md', usage: true, kb: true, scroll: true, acts: false };
  var S = Object.assign({}, DEFAULTS);
  try { Object.assign(S, JSON.parse(localStorage.getItem(SET_KEY) || '{}')); } catch (e) {}
  function saveS() { try { localStorage.setItem(SET_KEY, JSON.stringify(S)); } catch (e) {} }

  function applyS() {
    document.body.dataset.font = S.font;
    document.body.classList.toggle('hide-usage', !S.usage);
    document.body.classList.toggle('hide-kb', !S.kb);
    document.body.classList.toggle('always-acts', !!S.acts);
    Array.prototype.forEach.call($('fontSeg').children, function (b) {
      b.classList.toggle('on', b.dataset.font === S.font);
    });
    $('setUsage').checked = !!S.usage;
    $('setKb').checked = !!S.kb;
    $('setScroll').checked = !!S.scroll;
    $('setActs').checked = !!S.acts;
  }

  // 本次会话累计用量
  var sess = { calls: 0, inTok: 0, outTok: 0 };
  function renderSess() {
    $('stCalls').textContent = sess.calls;
    $('stIn').textContent = sess.inTok.toLocaleString();
    $('stOut').textContent = sess.outTok.toLocaleString();
  }

  // ===== 基础工具 =====

  function api(path, opts) {

      { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      opts.headers || {}
    );
    return fetch(API_BASE + path, opts);
  }
  function relTime(s) {
    if (!s) return '';
    var t = new Date(String(s).replace(' ', 'T') + 'Z');
    if (isNaN(t.getTime())) return String(s).slice(0, 10);
    var d = (Date.now() - t.getTime()) / 1000;
    if (d < 60) return '刚刚';
    if (d < 3600) return Math.floor(d / 60) + ' 分钟前';
    if (d < 86400) return Math.floor(d / 3600) + ' 小时前';
    if (d < 86400 * 7) return Math.floor(d / 86400) + ' 天前';
    return String(s).slice(0, 10);
  }
  function clockTime(s) {
    var t = s ? new Date(String(s).replace(' ', 'T') + 'Z') : new Date();
    if (isNaN(t.getTime())) t = new Date();
    return ('0' + t.getHours()).slice(-2) + ':' + ('0' + t.getMinutes()).slice(-2);
  }
  function copyText(text, btn) {
    function done() {
      var old = btn.innerHTML;
      btn.textContent = '已复制';
      setTimeout(function () { btn.innerHTML = old; }, 1200);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function () { fb(); });
    } else { fb(); }
    function fb() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.cssText = 'position:fixed;left:-9999px;top:0';
      document.body.appendChild(ta); ta.select();

  // ===== Markdown（安全子集） =====
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function inlineMd(s) {
    return s.replace(/`([^`]+)`/g, '<code>$1</code>')
            .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
            .replace(/(^|[^*\w])\*([^*\n]+)\*/g, '$1<em>$2</em>')
            .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }
  function mdToHtml(src) {
    var text = String(src == null ? '' : src);
    var codes = [];
    text = text.replace(/```[a-zA-Z0-9_+-]*\n?([\s\S]*?)```/g, function (m, body) {
      codes.push(body.replace(/\n$/, '')); return '\u0000C' + (codes.length - 1) + '\u0000';
    });
    var lines = escapeHtml(text).split('\n');
    var out = [], list = null, inTable = false;
    function closeList() { if (list) { out.push('</' + list + '>'); list = null; } }
    function closeTable() { if (inTable) { out.push('</tbody></table></div>'); inTable = false; } }
    function sepRow(s) { return /^\|?[\s:|-]+\|[\s:|-]*$/.test(s) && s.indexOf('-') >= 0; }
    for (var i = 0; i < lines.length; i++) {
      var t = lines[i].trim();
      if (/^\u0000C\d+\u0000$/.test(t)) { closeList(); closeTable(); out.push(t); continue; }
      if (!t) { closeList(); closeTable(); continue; }
      if (t.indexOf('|') === 0 && i + 1 < lines.length && sepRow(lines[i + 1].trim())) {
        closeList(); closeTable();
        var heads = t.replace(/^\||\|$/g, '').split('|');
        out.push('<div class="tbl-wrap"><table><thead><tr>');
        heads.forEach(function (h) { out.push('<th>' + inlineMd(h.trim()) + '</th>'); });
        out.push('</tr></thead><tbody>'); inTable = true; i++; continue;
      }
      if (inTable && t.indexOf('|') === 0) {
        var cells = t.replace(/^\||\|$/g, '').split('|');
        out.push('<tr>');
        cells.forEach(function (c) { out.push('<td>' + inlineMd(c.trim()) + '</td>'); });
        out.push('</tr>'); continue;
      }
      closeTable();
      var h = t.match(/^(#{1,4})\s+(.+)$/);
      if (h) { closeList(); var lv = Math.min(h[1].length + 2, 6);
               out.push('<h' + lv + '>' + inlineMd(h[2]) + '</h' + lv + '>'); continue; }
      var bq = t.match(/^>\s?(.*)$/);
      if (bq) { closeList(); out.push('<blockquote>' + inlineMd(bq[1]) + '</blockquote>'); continue; }
      var ul = t.match(/^[-*·]\s+(.+)$/), ol = t.match(/^\d+[.、)]\s+(.+)$/);
      if (ul) { if (list !== 'ul') { closeList(); out.push('<ul>'); list = 'ul'; }
                out.push('<li>' + inlineMd(ul[1]) + '</li>'); continue; }
      if (ol) { if (list !== 'ol') { closeList(); out.push('<ol>'); list = 'ol'; }
                out.push('<li>' + inlineMd(ol[1]) + '</li>'); continue; }
      closeList();
      out.push('<p>' + inlineMd(t) + '</p>');
    }
    closeList(); closeTable();
    return out.join('').replace(/\u0000C(\d+)\u0000/g, function (m, n) {
      return '<pre><code>' + escapeHtml(codes[Number(n)]) + '</code></pre>';
    });
  }

  // ===== 会话侧栏 =====

  function startRename(c, titleEl) {
    var inp = document.createElement('input');
    inp.value = c.title || '';
    inp.style.cssText = 'flex:1;min-width:0;font:inherit;font-size:13.5px;padding:2px 6px;border:1px solid #2563eb;border-radius:6px';
    titleEl.replaceWith(inp); inp.focus(); inp.select();
    var done = false;
    function finish(save) {
      if (done) return; done = true;
      var v = inp.value.trim();
      if (!save || !v || v === c.title) { renderConvList(); return; }
      api('/ai/conversations?id=' + encodeURIComponent(c.id), { method: 'PATCH', body: JSON.stringify({ title: v }) })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) { if (d && d.ok) c.title = d.title; renderConvList(); })
        .catch(function () { renderConvList(); });
    }
    inp.onkeydown = function (e) {
      e.stopPropagation();
      if (e.key === 'Enter') { e.preventDefault(); finish(true); }
      else if (e.key === 'Escape') { finish(false); }
    };
    inp.onblur = function () { finish(true); };
    inp.onclick = function (e) { e.stopPropagation(); };
  }
  function loadConversations() {

  // ===== 流式对话 =====
  function streamChat(question, payload) {
    if (busy) return;
    busy = true; setSendMode('stop'); stickBottom = true;
    var ai = addMsg('ai', '');
    ai.bubble.classList.add('cursor');
    refreshActions();
    abortCtrl = new AbortController();

    api('/ai/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      signal: abortCtrl.signal
    }).then(function (res) {
      var plan = res.headers.get('X-Plan');
      var remain = res.headers.get('X-Quota-Remaining');
      var hits = res.headers.get('X-Kb-Hits');
      var convId = res.headers.get('X-Conversation-Id');
      if (hits) { try { hits = decodeURIComponent(hits); } catch (e) {} }
      if (plan) setPlan(plan, remain);
      if (convId && convId !== currentId) currentId = convId;

      if (!res.ok || !res.body) {
        return res.text().then(function (t) {
          var msg = t;
          try { msg = JSON.parse(t).error || t; } catch (e) {}
          if (res.status === 401) { handleUnauthorized(); return; }
          ai.row.className = 'msg sys';
          ai.bubble.textContent = msg; ai.row.dataset.raw = msg;
          addRetry(ai, question, payload);
        });
      }

      var reader = res.body.getReader();
      var decoder = new TextDecoder();
      var buf = '', full = '', usage = null, stopped = false;

      function pump() {
        return reader.read().then(function (r) {
          if (r.done) {
            ai.bubble.classList.remove('cursor');
            ai.row.dataset.raw = full;
            if (full) {
              renderMd(ai);
              setKb(ai, hits);
              if (usage) {
                setUsage(ai, usage);
                sess.calls++; sess.inTok += usage.prompt_tokens || 0; sess.outTok += usage.completion_tokens || 0;
                renderSess();
              }
            } else {
              ai.bubble.textContent = stopped ? '（已停止生成）' : '（没有返回内容，请重试）';
              if (!stopped) addRetry(ai, question, payload);
            }
            loadConversations();
            return;
          }
          buf += decoder.decode(r.value, { stream: true });
          var nl;
          while ((nl = buf.indexOf('\n')) >= 0) {
            var line = buf.slice(0, nl).trim();
            buf = buf.slice(nl + 1);
            if (line.indexOf('data:') !== 0) continue;
            var data = line.slice(5).trim();
            if (!data || data === '[DONE]') continue;
            try {
              var obj = JSON.parse(data);
              if (obj.usage) usage = obj.usage;           // 末帧带用量
              var dl = obj.choices && obj.choices[0] && obj.choices[0].delta;
              if (dl && dl.content) { full += dl.content; ai.bubble.textContent = full; scrollDown(); }
            } catch (e) {}
          }
          return pump();
        });
      }
      return pump().catch(function (err) {
        ai.bubble.classList.remove('cursor');
        if (err && err.name === 'AbortError') {
          stopped = true; ai.row.dataset.raw = full;
          if (full) renderMd(ai); else ai.bubble.textContent = '（已停止生成）';
          return;
        }
        throw err;
      });
    }).catch(function (err) {
      ai.bubble.classList.remove('cursor');
      if (err && err.name === 'AbortError') return;
      ai.row.className = 'msg sys';
      ai.bubble.textContent = '网络异常：' + ((err && err.message) || err);
      ai.row.dataset.raw = ai.bubble.textContent;
      addRetry(ai, question, payload);
    }).then(function () {
      busy = false; abortCtrl = null; setSendMode('send'); refreshActions(); scrollDown();
    });
  }

  function addRetry(ai, question, payload) {
    if (!ai._acts) return;
    ai._acts.appendChild(mkBtn('retry', ICON.retry, '重试', function () {
      ai.row.remove(); streamChat(question, payload);
    }));

  function setSendMode(mode) {
    sendBtn.classList.remove('stop');

    else { sendBtn.disabled = false; sendBtn.textContent = '发送'; }

  function send() {
    if (busy) { stopGenerating(); return; }
    var text = inputEl.value.trim();
    if (!text) return;
    if (!token) { requireLogin(); return; }
    inputEl.value = ''; inputEl.style.height = 'auto';
    if (!innerEl.querySelector('.msg')) innerEl.innerHTML = '';
    addMsg('user', text); stickBottom = true;
    streamChat(text, { message: text, conversationId: currentId });

  function regenerate() {

    var rows = innerEl.querySelectorAll('.msg.user');
    var last = rows.length ? rows[rows.length - 1].dataset.raw : '';
    var ais = innerEl.querySelectorAll('.msg.ai');
    if (ais.length) ais[ais.length - 1].remove();
    streamChat(last, { conversationId: currentId, regenerate: true });
  }
  function stopGenerating() { if (abortCtrl) abortCtrl.abort(); }

    S.font = b.dataset.font; saveS(); applyS();
  };
  $('setUsage').onchange = function () { S.usage = this.checked; saveS(); applyS(); };
  $('setKb').onchange = function () { S.kb = this.checked; saveS(); applyS(); };
  $('setScroll').onchange = function () { S.scroll = this.checked; saveS(); applyS(); };
  $('setActs').onchange = function () { S.acts = this.checked; saveS(); applyS(); };
  $('resetBtn').onclick = function () {
    S = Object.assign({}, DEFAULTS); saveS(); applyS();
    sess = { calls: 0, inTok: 0, outTok: 0 }; renderSess();
  };

  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!busy) send(); }
  });
  inputEl.addEventListener('input', function () {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
  });
  chatEl.addEventListener('scroll', function () {
    stickBottom = nearBottom();
    toBottomBtn.classList.toggle('show', !stickBottom && innerEl.children.length > 0);
  });
  toBottomBtn.onclick = function () { stickBottom = true; scrollDown(true); toBottomBtn.classList.remove('show'); };

  // ===== 启动 =====
  applyS(); renderSess();
  if (!token) {
    requireLogin();
  } else {
    newBtn.disabled = false;
    loadMe();
    loadConversations().then(function () {
      if (!token) return;
      if (conversations.length) openConversation(conversations[0].id);
      else renderIntro();
    });
  }
})();
</script>
</body>
</html>
