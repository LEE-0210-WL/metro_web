<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="theme.css">
<title>深圳地铁 PIDS 5.3:1 模拟器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #1a1a2e;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    gap: 12px;
  }
  .ctrl {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    max-width: 1400px;
  }
  .ctrl select, .ctrl input, .ctrl button {
    background: #0f3460;
    border: 1px solid #2a4a6a;
    color: #fff;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 13px;
    outline: none;
  }
  .ctrl button {
    background: linear-gradient(135deg, #667eea, #764ba2);
    cursor: pointer;
    font-weight: 500;
  }
  .ctrl button:hover { opacity: 0.9; }
  .ctrl button.on { background: linear-gradient(135deg, #11998e, #38ef7d); }

  .pids-wrap {
    width: 100%;
    max-width: 1400px;
    aspect-ratio: 5.3 / 1;
    background: #e8e8e8;
    border-radius: 4px;
    overflow: hidden;
    display: flex;
    position: relative;
    border: 3px solid #333;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  .left-panel {
    width: 34%;
    padding: 10px 16px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 3px;
    border-right: 1px solid #ccc;
    position: relative;
  }

  /* 换乘提示区域 - 始终留位置 */
  .transfer-area {
    min-height: 32px;
    display: flex;
    flex-direction: column;
    gap: 1px;
    margin-bottom: 4px;
  }
  .transfer-row {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 8px;
    color: #555;
  }
  .transfer-row .lbl { color: #777; white-space: nowrap; font-size: 8px; }
  .t-badge {
    display: inline-flex;
    align-items: center;
    padding: 0px 3px;
    border-radius: 2px;
    font-size: 7px;
    font-weight: 700;
    color: #fff;
    line-height: 1.4;
  }

  /* 下一站区域 - 左下角 */
  .next-area {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .next-row {
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .next-label-small {
    font-size: 8px;
    font-weight: 700;
    color: #222;
    line-height: 1;
  }
  .station-big {
    font-size: 18px;
    font-weight: 900;
    color: #111;
    line-height: 1.1;
  }
  .station-en {
    font-size: 8px;
    color: #666;
    font-weight: 500;
  }

  .right-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
  }

  /* 终点站行 - 黑色背景只延伸到右边缘，不包含左侧 */
  .terminus-row {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 8px;
    padding: 3px 24px;
    background: #2c3e50;
    font-size: 8px;
    margin-left: 0; /* 不延伸到左边 */
  }
  .term-badge {
    background: rgba(255,255,255,0.15);
    color: #fff;
    padding: 1px 6px;
    border-radius: 2px;
    font-size: 7px;
    font-weight: 500;
  }
  .term-name {
    font-size: 9px;
    font-weight: 700;
    color: #fff;
  }

  .track-wrap {
    position: relative;
    height: 60px;
    display: flex;
    align-items: center;
    padding: 0 24px; /* 左右留空 */
  }

  /* 矩形线路条 - 无圆角，不拉到最宽 */
  .track-rect {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    height: 16px;
    z-index: 1;
    border-radius: 0;
  }

  /* 箭头组 - z-index在站点下面 */
  .chevron-group {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 0;
    display: flex;
    gap: 3px;
    height: 16px;
    align-items: center;
  }
  .chev {
    width: 14px;
    height: 16px;
    opacity: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .chev svg { width: 100%; height: 100%; display: block; }
  .chevron-group .chev {
    animation: chev-loop 1.2s linear infinite;
  }
  .chev.c1 { animation-delay: 0s; }
  .chev.c2 { animation-delay: -0.4s; }
  .chev.c3 { animation-delay: -0.8s; }
  @keyframes chev-loop {
    0% { transform: translateX(-28px); }
    100% { transform: translateX(28px); }
  }

  /* 站点行 */
  .stations-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    position: relative;
    z-index: 2;
    height: 60px;
  }
  .st-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
    position: relative;
    justify-content: center;
    height: 100%;
  }

  .st-dot-wrap {
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    position: relative;
    z-index: 3;
  }

  /* 统一大小圆圈 20px，线路色描边 */
  .st-dot {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 3px solid;
    transition: all 0.3s;
    flex-shrink: 0;
  }
  /* 当前站=黄色 + 缓慢放大缩小 */
  .st-dot.current { 
    background: #f1c40f; 
    border-color: #f1c40f;
    animation: pulse-yellow 3s ease-in-out infinite;
  }
  @keyframes pulse-yellow {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.3); }
  }
  /* 已过的站=灰色 */
  .st-dot.passed { 
    background: #bbb; 
    border-color: #bbb;
  }
  /* 没到的站=绿色 */
  .st-dot.future {
    background: #2ecc71;
    border-color: #2ecc71;
  }

  .st-text {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    margin-top: 3px;
    position: absolute;
    top: 50%;
    padding-top: 14px;
  }
  .st-name {
    font-size: 7px;
    font-weight: 600;
    text-align: center;
    line-height: 1.2;
    white-space: nowrap;
  }
  .st-name.current { font-size: 8px; color: #111; font-weight: 700; }
  .st-name.passed { font-size: 6px; color: #888; }
  .st-name.future { font-size: 6px; color: #333; }
  .st-name-en {
    font-size: 5px;
    text-align: center;
    line-height: 1.1;
    white-space: nowrap;
  }
  .st-name-en.current { font-size: 6px; color: #555; }
  .st-name-en.passed { font-size: 4px; color: #aaa; }
  .st-name-en.future { font-size: 4px; color: #777; }

  .transfer-dots {
    display: flex;
    gap: 1px;
    margin-top: 1px;
  }
  .tdot {
    width: 8px;
    height: 8px;
    border-radius: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 6px;
    font-weight: 700;
    color: #fff;
  }
  .tdot.grayed { background: #bbb !important; color: #fff !important; }

  @keyframes doorPulse { 0%,100%{filter:drop-shadow(0 0 0 rgba(46,204,113,0.4))} 50%{filter:drop-shadow(0 0 20px rgba(46,204,113,0))} }
  @keyframes doorSlide { 0%,100%{transform:translateX(0)} 50%{transform:translateX(-8px)} }
  @keyframes doorSlideR { 0%,100%{transform:translateX(0)} 50%{transform:translateX(8px)} }
</style>
</head>
<body>
<div class="ctrl">
  <select id="lineSel" onchange="changeLine()">
    <option value="1">1号线 (罗宝线)</option>
    <option value="2">2号线 (蛇口线)</option>
    <option value="3">3号线 (龙岗线)</option>
    <option value="4">4号线 (龙华线)</option>
    <option value="5" selected>5号线 (环中线)</option>
    <option value="6">6号线 (光明线)</option>
    <option value="7">7号线 (西丽线)</option>
    <option value="8">8号线 (盐田线)</option>
    <option value="9">9号线 (梅林线)</option>
    <option value="10">10号线 (坂田线)</option>
    <option value="11">11号线 (机场线)</option>
    <option value="12">12号线 (南宝线)</option>
    <option value="14">14号线 (东部快线)</option>
  </select>
  <select id="stSel" onchange="upd()"></select>
  <select id="dirSel" onchange="upd()">
    <option value="fwd">正向 → 终点站</option>
    <option value="bwd">反向 → 起点站</option>
  </select>
  <button id="autoBtn" onclick="toggleAuto()">自动</button>
  <button onclick="nextSt()">下一站</button>
  <button onclick="prevSt()">上一站</button>
  <button onclick="toggleDoor()">开关门</button>
</div>

<div class="pids-wrap" id="pids">
  <div class="left-panel">
    <div class="transfer-area" id="transferArea">
      <div class="transfer-row" id="transferRow1"></div>
      <div class="transfer-row" id="transferRow2"></div>
    </div>
    <div class="next-area">
      <div class="next-row">
        <span class="next-label-small">下一站</br>Next Station</span>
      </div>
      <div class="station-big" id="stName">深圳北站</div>
      <div class="station-en" id="stNameEn">Shenzhen North Station</div>
    </div>
  </div>

  <div class="right-panel">
    <div class="terminus-row">
      <span class="term-badge">终点站 Terminus</span>
      <span class="term-name" id="termName">长岭陂 Changlingpi</span>
    </div>
    <div class="track-wrap">
      <div class="track-rect" id="trackRect"></div>
      <div class="chevron-group" id="chevGroup">
        <div class="chev c1"><svg viewBox="0 0 14 16" preserveAspectRatio="none"><path d="M1 2 L11 8 L1 14" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="chev c2"><svg viewBox="0 0 14 16" preserveAspectRatio="none"><path d="M1 2 L11 8 L1 14" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="chev c3"><svg viewBox="0 0 14 16" preserveAspectRatio="none"><path d="M1 2 L11 8 L1 14" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      </div>
      <div class="stations-row" id="stationsRow"></div>
    </div>
  </div>

  <div id="doorOv" style="position:absolute;inset:0;background:rgba(0,0,0,0.82);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:100;">
    <svg width="80" height="80" viewBox="0 0 80 80" style="animation:doorPulse 1s infinite;">
      <rect x="4" y="4" width="72" height="72" rx="8" fill="none" stroke="#2ecc71" stroke-width="4"/>
      <rect x="10" y="12" width="26" height="56" rx="2" fill="#2ecc71" style="animation:doorSlide 1.5s infinite;"/>
      <rect x="44" y="12" width="26" height="56" rx="2" fill="#2ecc71" style="animation:doorSlideR 1.5s infinite;"/>
    </svg>
    <div style="color:#2ecc71;font-size:22px;font-weight:700;">车门开启</div>
    <div style="color:#2ecc71;font-size:13px;">Doors Opening</div>
  </div>
</div>

/* ===== 从 all-lines-enhanced.js 动态构建线路数据 ===== */
let DATA = {};
let LC = {};
function buildLines(){
  DATA = {}; LC = {};
  const ops = getOperatingLinesEnhanced();
  ops.forEach(item => {
    const d = getEnhancedLineData(item.id);
    if (!d || !d.stationList) return;
    const shortName = (d.name || "").replace("深圳地铁", "").replace(/（.*?）/g, "");
    const stations = d.stationList.map(name => {
      const ts = (d.transfers && d.transfers[name]) ? d.transfers[name].map(x => parseInt(x, 10)) : [];
      return { n: name, e: EN[name] || "", t: ts };
    });
    DATA[item.id] = { c: d.color, n: shortName, s: stations };
    LC[item.id] = d.color;
  });
}

/* ===== 状态 ===== */
let L = null, SI = 0, DIR = 'fwd', AUTO = false, AUTOI = null, DOOR = false;

function init(){
  buildLines();
  // 线路下拉
  const sel = document.getElementById('lineSel');
  sel.innerHTML = '';
  const ids = Object.keys(DATA).sort((a,b) => {
    const na = parseInt(a,10), nb = parseInt(b,10);
    if (isNaN(na) && isNaN(nb)) return a.localeCompare(b);
    if (isNaN(na)) return 1; if (isNaN(nb)) return -1;
    return na - nb;
  });
  ids.forEach(id => {
    const o = document.createElement('option');
    o.value = id;
    o.textContent = id + '号线（' + DATA[id].n + '）';
    sel.appendChild(o);
  });
  // 默认 5 号线，没有就第一条
  L = DATA['5'] ? '5' : (ids[0] || null);
  if (!L) return;
  sel.value = L;
  SI = Math.min(20, DATA[L].s.length - 1);
  popSt();
  upd();
}

function popSt(){
  const s = document.getElementById('stSel');
  s.innerHTML = '';
  if (!L || !DATA[L]) return;
  DATA[L].s.forEach((st, i) => {
    const o = document.createElement('option');
    o.value = i;
    o.textContent = st.n;
    if (i === SI) o.selected = true;
    s.appendChild(o);
  });
}

function changeLine(){
  L = document.getElementById('lineSel').value;
  SI = 0;
  popSt();
  upd();
}


function upd(){
  const line=DATA[L], sts=line.s;
  SI=parseInt(document.getElementById('stSel').value);
  DIR=document.getElementById('dirSel').value;
  const F=DIR==='fwd';
  const lineColor=line.c;

  let NI=F?SI+1:SI-1;
  if(NI<0)NI=0;
  if(NI>=sts.length)NI=sts.length-1;
  const NS=sts[NI];
  if(!NS)return;

  // 左侧：换乘提示（始终留位置，Transfer to单独一行）
  const tr1=document.getElementById('transferRow1');
  const tr2=document.getElementById('transferRow2');
  const ta=document.getElementById('transferArea');
  if(NS.t&&NS.t.length>0){
    tr1.innerHTML='<span class="lbl">可换乘</span>';
    let h2='<span class="lbl">Transfer to</span>';
    NS.t.forEach(tl=>{const tc=LC[tl]||'#999';h2+=`<span class="t-badge" style="background:${tc}">${tl}号线</span>`});
    tr2.innerHTML=h2;
    tr1.style.display='flex';
    tr2.style.display='flex';
    ta.style.minHeight='32px';
  } else {
    tr1.innerHTML='';tr1.style.display='flex';
    tr2.innerHTML='';tr2.style.display='flex';
    ta.style.minHeight='32px';
  }

  // 左侧：下一站信息（加上 Next Station）
  document.getElementById('stName').textContent=NS.n;
  document.getElementById('stNameEn').textContent=NS.e;

  // 终点站
  const TN=F?sts[sts.length-1].n:sts[0].n;
  const TE=F?sts[sts.length-1].e:sts[0].e;
  document.getElementById('termName').textContent=`${TN} ${TE}`;

  // 矩形线路条 - 无圆角，左右留空不拉到最宽
  const trRect=document.getElementById('trackRect');
  trRect.style.background=lineColor;
  trRect.style.height='16px';
  trRect.style.left='24px';
  trRect.style.right='24px';

  // 箭头位置：固定在黄色(当前站)和第一个绿色(未来站)之间
  const cg=document.getElementById('chevGroup');

  // 站点显示 - 反向时列表倒序
  const sr=document.getElementById('stationsRow');sr.innerHTML='';

  let displaySts = [];
  const R=2;
  let sIdx=Math.max(0,NI-R), eIdx=Math.min(sts.length-1,NI+R);
  if(eIdx-sIdx<4){
    if(sIdx===0)eIdx=Math.min(4,sts.length-1);
    else sIdx=Math.max(0,eIdx-4);
  }

  for(let i=sIdx;i<=eIdx;i++){
    displaySts.push({st:sts[i],idx:i});
  }

  // 反向时倒序显示
  if(!F){
    displaySts.reverse();
  }

  // 计算箭头位置：在黄色和第一个绿色之间
  let yellowIdx = -1;
  let firstGreenIdx = -1;

  displaySts.forEach((item, pos) => {
    const i=item.idx;
    const isPassed = F ? i<NI : i>NI;
    const isNext = i===NI;

    if(isNext) yellowIdx = pos;
    if(!isPassed && !isNext && firstGreenIdx===-1) firstGreenIdx = pos;
  });

  // 设置箭头位置
  if(yellowIdx!==-1 && firstGreenIdx!==-1){
    const total = displaySts.length;
    const pct = ((yellowIdx + firstGreenIdx) / 2 / (total - 1)) * 100;
    cg.style.left = pct + '%';
    cg.style.right = 'auto';
    cg.style.transform = 'translate(-50%, -50%)';
  } else if(yellowIdx!==-1){
    cg.style.left = '70%';
    cg.style.right = 'auto';
    cg.style.transform = 'translate(-50%, -50%)';
  }

  // 渲染站点
  displaySts.forEach((item) => {
    const st=item.st;
    const i=item.idx;
    const d=document.createElement('div');
    d.className='st-item';

    const isPassed = F ? i<NI : i>NI;
    const isNext = i===NI;
    const isCur = i===SI;

    let dc='st-dot', nc='st-name', ec='st-name-en';

    if(isNext){
      dc='st-dot current';
      nc='st-name current';
      ec='st-name-en current';
    } else if(isPassed || isCur){
      dc='st-dot passed';
      nc='st-name passed';
      ec='st-name-en passed';
    } else {
      dc='st-dot future';
      nc='st-name future';
      ec='st-name-en future';
    }

    const borderColor = lineColor;

    let td='';
    if(st.t&&st.t.length>0){
      td='<div class="transfer-dots">';
      st.t.forEach(tl=>{
        const tc=LC[tl]||'#999';
        const grayed=(isPassed||isCur)?'grayed':'';
        td+=`<span class="tdot ${grayed}" style="background:${tc}">${tl}</span>`;
      });
      td+='</div>';
    }

    d.innerHTML = `
      <div class="st-dot-wrap">
        <div class="${dc}" style="border-color:${borderColor};"></div>
      </div>
      <div class="st-text">
        <div class="${nc}">${st.n}</div>
        <div class="${ec}">${st.e}</div>
        ${td}
      </div>
    `;
    sr.appendChild(d);
  });
}

function nextSt(){
  const sts=DATA[L].s;
  const F=DIR==='fwd';
  if(F){
    if(SI<sts.length-1)SI++;
    else{DIR='bwd';document.getElementById('dirSel').value='bwd';}
  } else {
    if(SI>0)SI--;
    else{DIR='fwd';document.getElementById('dirSel').value='fwd';}
  }
  document.getElementById('stSel').value=SI;
  upd();
}
function prevSt(){
  const sts=DATA[L].s;
  const F=DIR==='fwd';
  if(F){if(SI>0)SI--;}
  else{if(SI<sts.length-1)SI++;}
  document.getElementById('stSel').value=SI;
  upd();
}
function toggleAuto(){
  AUTO=!AUTO;
  const b=document.getElementById('autoBtn');
  if(AUTO){b.textContent='⏸ 停止';b.classList.add('on');AUTOI=setInterval(nextSt,3000);}
  else{b.textContent='▶ 自动';b.classList.remove('on');clearInterval(AUTOI);}
}
function toggleDoor(){
  DOOR=!DOOR;
  document.getElementById('doorOv').style.display=DOOR?'flex':'none';
}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();nextSt();}
  else if(e.key==='ArrowLeft'){e.preventDefault();prevSt();}
  else if(e.key==='d'||e.key==='D'){toggleDoor();}
  else if(e.key==='a'||e.key==='A'){toggleAuto();}
});
init();
</script>
