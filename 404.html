<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - 走进新天地·Railway</title>
  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/harmonyos-sans">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'HarmonyOS Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      color: #111827;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .error-code {
      font-size: 140px;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(125deg,
        #01AF55 0%,
        #B95800 10%,
        #00A9DF 20%,
        #D42E0F 30%,
        #9E4DAA 40%,
        #01C4B7 50%,
        #027776 55%,
        #0131AC 60%,
        #B95800 65%,
        #896B70 70%,
        #F67599 75%,
        #672146 80%,
        #A092B2 85%,
        #F6AD2D 90%,
        #F4CB67 93%,
        #181BA5 96%,
        #87DBDF 100%
      );
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: flowColor 20s ease-in-out infinite;
      margin-bottom: 12px;
    }

    @keyframes flowColor {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .error-title {
      font-size: 22px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 8px;
    }

    .error-desc {
      font-size: 15px;
      color: #6b7280;
      max-width: 400px;
      line-height: 1.8;
      margin-bottom: 28px;
    }

    .countdown {
      font-size: 14px;
      color: #9ca3af;
      margin-bottom: 20px;
    }

    .countdown span {
      color: #2563eb;
      font-weight: 600;
    }

    .skip-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 24px;
      background: transparent;
      color: #6b7280;
      text-decoration: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      border: 1px solid #d1d5db;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .skip-btn:hover {
      background: #f3f4f6;
      color: #374151;
    }

    @media (max-width: 480px) {
      .error-code { font-size: 100px; }
      .error-title { font-size: 18px; }
    }
  </style>
</head>
<body>
  <div class="error-code">哦豁 404了嘿</div>
  <h1 class="error-title">前方到站：-..-.----...----..</h1>
  <p class="error-desc">
    找错东西了，喵喵喵
  </p>

  <div class="countdown"><span id="sec">5</span> 秒后自动返回首页</div>

  <button class="skip-btn" onclick="skip()">
    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 18 15 12 9 6"></polyline>
    </svg>
    不需要，不跳转
  </button>

  <script>
    var sec = 5;
    var timer = setInterval(function() {
      sec--;
      document.getElementById('sec').textContent = sec;
      if (sec <= 0) {
        clearInterval(timer);
        // 关键修改：改为绝对路径根目录
        location.href = '/';
      }
    }, 1000);

    function skip() {
      clearInterval(timer);
      document.querySelector('.countdown').innerHTML = '已取消自动跳转';
      document.querySelector('.skip-btn').style.display = 'none';
    }
  </script>
</body>
</html>
