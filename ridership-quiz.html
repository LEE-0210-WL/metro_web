<html lang="zh-CN">
<head>

<meta name="description" content="客流猜大小 — 走进新天地·Railway，同一天里哪条线的客流更高？连击越高越难。">

<meta property="og:title" content="客流猜大小 - 走进新天地·Railway">

  <style>
    .game-card {
      background: var(--card-bg, #fff);
      border: 1px solid var(--border, #e5e7eb);
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 18px;
    }
    .stat-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .stat-row span {
      background: #f1f5f9; border-radius: 999px; padding: 5px 12px;
      font-size: 12.5px; color: #475569;
    }
    .stat-row b { color: #0f172a; }

    .date-line { font-size: 13px; color: #64748b; margin-bottom: 14px; }
    .date-line b { color: #0f172a; }

    .board {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 12px;
      align-items: stretch;
      margin-bottom: 20px;
    }
    .side {
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
      background: #f8fafc;
      padding: 18px 14px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      min-height: 132px;
    }
    .side .lname { font-size: 17px; font-weight: 700; color: #0f172a; }
    .side .val {
      font-size: 26px;
      font-weight: 800;
      color: #0f172a;
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
    }
    .side .val small { font-size: 12px; font-weight: 500; color: #94a3b8; margin-left: 3px; }
    .side .val.unknown { color: #cbd5e1; }
    .side.reveal-ok { border-color: #86efac; background: #f0fdf4; }
    .side.reveal-bad { border-color: #fca5a5; background: #fef2f2; }
    .vs {
      align-self: center;
      font-size: 13px;
      font-weight: 700;
      color: #94a3b8;
      padding: 0 4px;
    }

    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-big {
      padding: 20px 10px;
      border: 1.5px solid #cbd5e1;
      border-radius: 14px;
      background: #fff;
      font-family: inherit;
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
      cursor: pointer;
      transition: all .12s ease;
    }
    .btn-big:hover:not(:disabled) { border-color: #2563eb; color: #2563eb; transform: translateY(-1px); }
    .btn-big:disabled { cursor: default; opacity: .6; }
    .btn-big small { display: block; font-size: 11.5px; font-weight: 400; color: #94a3b8; margin-top: 4px; }
    .btn-big.correct { background: #dcfce7; border-color: #86efac; color: #166534; }
    .btn-big.wrong { background: #fee2e2; border-color: #fca5a5; color: #991b1b; }

    .msg { margin-top: 14px; font-size: 13.5px; color: #64748b; min-height: 20px; }

    .over {
      margin-top: 18px; padding: 16px; border-radius: 13px;
      background: #fef2f2; border: 1px solid #fecaca;
      color: #7f1d1d; font-size: 14px; line-height: 1.9;
      display: none;
    }
    .over.show { display: block; }
    .btn-primary {
      margin-top: 12px; padding: 11px 22px; border: none; border-radius: 11px;
      background: #0f172a; color: #fff; font-size: 14px; font-weight: 600;
      font-family: inherit; cursor: pointer;
    }
    .btn-primary:hover { background: #1f2937; }

    .howto {
      background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 16px;
      padding: 18px; font-size: 13px; line-height: 1.9; color: #64748b;
    }
    .howto h3 { font-size: 14px; color: #475569; margin-bottom: 6px; }

    @media (max-width: 720px) {
      .game-card { padding: 16px; }
      .board { grid-template-columns: 1fr; gap: 8px; }
      .vs { padding: 2px 0; }
      .side { min-height: 0; padding: 14px; }
      .side .val { font-size: 22px; }
      .btn-big { padding: 16px 8px; font-size: 16px; }
    }
  </style>
<link rel="stylesheet" href="page-header.css">
<link rel="stylesheet" href="layout.css">
<link rel="stylesheet" href="components.css">
</head>
<body>
  <script src="navbar.js"></script>

  <main class="container">
    <div class="page-header">
      <h1 class="page-title">
        客流猜大小
        <a href="games" class="back-link">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          返回游戏中心
        </a>
      </h1>
    </div>

    <div class="page-subtitle-wrapper">
      <p class="page-subtitle">同一天里，哪条线的客流更高？连击越高越难</p>
    </div>

    <div class="game-card">
      <div class="stat-row">
        <span>连击 <b id="stStreak">0</b></span>
        <span>最高 <b id="stBest">0</b></span>
        <span>已答 <b id="stAnswered">0</b></span>
      </div>

      <div class="date-line" id="dateLine">加载中…</div>

      <div class="board">
        <div class="side" id="sideL">
          <div class="lname" id="nameL">—</div>
          <div class="val" id="valL">—</div>
        </div>
        <div class="vs">VS</div>
        <div class="side" id="sideR">
          <div class="lname" id="nameR">—</div>
          <div class="val unknown" id="valR">?</div>
        </div>
      </div>

      <div class="actions">
        <button class="btn-big" id="btnHigher">更高<small>右边客流更大</small></button>
        <button class="btn-big" id="btnLower">更低<small>右边客流更小</small></button>
      </div>

      <div class="msg" id="msg"></div>

      <div class="over" id="over"></div>
    </div>

    <div class="howto">
      <h3>怎么玩</h3>
      每天抽一个日期，比两条线的当日客流。<br>
      左边给出真实数值，右边只给线路名 —— 判断右边<b>更高</b>还是<b>更低</b>。<br>
      答对连击 +1，右边翻牌，并成为下一题的左边（连着猜下去）；答错本局结束。<br>
      数据来自本站客流统计（线路级、单位万人次），同一天的线抽完会自动换一天。
    </div>
  </main>

  <script src="passenger-data.js"></script>
  <script>
  (function () {
    'use strict';

    function fail(msg) {
      document.getElementById('dateLine').textContent = msg;
    }
    if (typeof passengerData === 'undefined' || !passengerData) {
      fail('客流数据加载失败，请刷新页面');
      return;
    }

    var DATES = Object.keys(passengerData).filter(function (d) {
      var row = passengerData[d];
      return row && Array.isArray(row.lines) && row.lines.length >= 2;
    }).sort();

    var LS_KEY = 'mg.flow.v1';
    var state = {
      streak: 0, best: 0, answered: 0,
      dateKey: '', used: {}, left: null, right: null,
      locked: false, over: false
    };

    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (s) { state.best = s.best || 0; }
      }
    } catch (e) {}

    function persist() {
      try { localStorage.setItem(LS_KEY, JSON.stringify({ best: state.best })); } catch (e) {}
    }

    function randOf(a) { return a[Math.floor(Math.random() * a.length)]; }
    function dayLines(dateKey) {
      return passengerData[dateKey].lines.filter(function (l) {
        return l && typeof l.passengers === 'number';
      });
    }
    function fmt(v) { return v.toFixed(2); }

    function newDate() {
      var tries = 0;
      var key;
      do { key = randOf(DATES); tries++; } while (tries < 50 && key === state.dateKey && DATES.length > 1);
      state.dateKey = key;
      state.used = {};
    }

    function pickLeft() {
      var lines = dayLines(state.dateKey);
      if (!lines.length) return null;
      var l = randOf(lines);
      state.used[l.name] = 1;
      return { name: l.name, value: l.passengers };
    }

    function pickRight() {
      var lines = dayLines(state.dateKey).filter(function (l) {
        return !state.used[l.name] && state.left && l.name !== state.left.name;
      });
      if (!lines.length) {
        newDate();
        lines = dayLines(state.dateKey).filter(function (l) {
          return state.left && l.name !== state.left.name;
        });
        if (!lines.length) return null;
      }
      // 数值相同则重抽
      for (var t = 0; t < 40; t++) {
        var l = randOf(lines);
        if (!state.left || l.passengers !== state.left.value) return { name: l.name, value: l.passengers };
      }
      return null;
    }

    function startRound(keepLeft) {
      state.over = false;
      state.locked = false;
      document.getElementById('over').className = 'over';
      document.getElementById('msg').textContent = '';
      Array.prototype.forEach.call(document.querySelectorAll('.btn-big'), function (b) {
        b.disabled = false; b.classList.remove('correct', 'wrong');
      });

      if (!keepLeft || !state.left) {
        newDate();
        state.left = pickLeft();
      }
      if (!state.left) { fail('数据异常，请刷新页面'); return; }
      state.right = pickRight();
      if (!state.right) { fail('数据异常，请刷新页面'); return; }
      state.used[state.right.name] = 1;
      render();
    }

    function render() {
      var row = passengerData[state.dateKey];
      document.getElementById('dateLine').textContent =
        '日期：' + (row.date || state.dateKey) + (row.weekday ? '（' + row.weekday + '）' : '') +
        (row.total ? ' · 全网 ' + row.total.toFixed(2) + ' 万人次' : '');
      document.getElementById('nameL').textContent = state.left.name;
      document.getElementById('valL').textContent = fmt(state.left.value);
      document.getElementById('valL').innerHTML = fmt(state.left.value) + '<small>万人次</small>';
      document.getElementById('nameR').textContent = state.right.name;
      var vr = document.getElementById('valR');
      vr.className = 'val unknown';
      vr.textContent = '?';
      document.getElementById('sideR').className = 'side';
      document.getElementById('sideL').className = 'side';

      document.getElementById('stStreak').textContent = state.streak;
      document.getElementById('stBest').textContent = state.best;
      document.getElementById('stAnswered').textContent = state.answered;
    }

    function judge(isHigher) {
      if (state.locked || state.over) return;
      state.locked = true;
      var truth = state.right.value > state.left.value;
      var ok = (truth === isHigher);
      var btn = document.getElementById(isHigher ? 'btnHigher' : 'btnLower');
      btn.classList.add(ok ? 'correct' : 'wrong');

      // 翻牌
      var vr = document.getElementById('valR');
      vr.className = 'val';
      vr.innerHTML = fmt(state.right.value) + '<small>万人次</small>';
      document.getElementById('sideR').className = 'side ' + (ok ? 'reveal-ok' : 'reveal-bad');

      Array.prototype.forEach.call(document.querySelectorAll('.btn-big'), function (b) { b.disabled = true; });

      if (ok) {
        state.streak += 1; state.answered += 1;
        if (state.streak > state.best) state.best = state.streak;
        persist();
        document.getElementById('msg').style.color = '#16a34a';
        document.getElementById('msg').textContent =
          '答对了！' + state.right.name + ' ' + fmt(state.right.value) + ' 万人次，继续…';
        setTimeout(function () {
          state.left = { name: state.right.name, value: state.right.value };
          startRound(true);
        }, 900);
      } else {
        state.streak = 0;
        persist();
        document.getElementById('msg').style.color = '#dc2626';
        document.getElementById('msg').textContent = '答错了，本局结束。';
        var diff = Math.abs(state.right.value - state.left.value);
        var over = document.getElementById('over');
        over.className = 'over show';
        over.innerHTML =
          '正确答案：' + state.right.name + ' 是 <b>' + fmt(state.right.value) + '</b> 万人次，' +
          (truth ? '更高' : '更低') + '（' + state.left.name + ' ' + fmt(state.left.value) + '）<br>' +
          '两者相差 <b>' + fmt(diff) + '</b> 万人次 ｜ 本局连击 <b>' + state.streak + '</b><br>' +
          '<div><button class="btn-primary" id="againBtn">再来一局</button></div>';
        var again = document.getElementById('againBtn');
        if (again) again.addEventListener('click', function () {
          state.streak = 0;
          state.left = null;
          startRound(false);
        });
      }
    }

    document.getElementById('btnHigher').addEventListener('click', function () { judge(true); });
    document.getElementById('btnLower').addEventListener('click', function () { judge(false); });

    window.__FLOW_DEBUG__ = {
      dates: DATES,
      state: state,
      start: function () { state.left = null; startRound(false); },
      judge: judge,
      dayLines: dayLines,
      newDate: newDate
    };

    startRound(false);
  })();
  </script>
</body>
</html>
