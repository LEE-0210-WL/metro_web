<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工具 - 走进新天地·Railway</title>
  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/harmonyos-sans">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'HarmonyOS Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f5f5f5;
      color: #333;
      line-height: 1.6;
    }
    
    /* ===== 页面标题行（与 materials 一致） ===== */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding: 20px 0 0 0;
      gap: 16px;
    }
    
    .page-title-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .page-icon {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      color: #111827;
    }
    
        .page-title {  font-size: 28px;
  font-weight: 700;
  color: #111827;
  margin-bottom: 8px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;}
    
    .page-subtitle-wrapper {
      margin-top: 0;
      margin-bottom: 32px;
    }
    
    .page-subtitle {  font-size: 16px;
  color: #6b7280;
  margin-bottom: 32px;}
    
    /* ===== 主内容区域 ===== */
    .container {
      max-width: min(90%, 1200px);
      margin: 20px auto 40px;
      padding: 0 20px;
    }
    
    /* ===== 工具网格（与 materials 一致） ===== */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
    }
    
    .tool-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
      text-decoration: none;
      color: inherit;
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }
    
    .tool-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    }
    
    .tool-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: #e0f2fe;
      color: #0369a1;
    }
    
    .tool-icon svg {
      width: 24px;
      height: 24px;
    }
    
    .tool-content {
      flex: 1;
      min-width: 0;
    }
    
    .tool-title {
      font-size: 16px;
      font-weight: 600;
      color: #111827;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .tool-title svg {
      width: 16px;
      height: 16px;
      color: #9ca3af;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    
    .tool-card:hover .tool-title svg {
      opacity: 1;
    }
    
    .tool-description {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 10px;
      line-height: 1.5;
    }
    
    .tool-meta {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .tool-type {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 500;
    }
    
    .tool-type-testing { background: #fef3c7; color: #92400e; }
    .tool-type-beta { background: #dbeafe; color: #1e40af; }
    .tool-type-stable { background: #dcfce7; color: #166534; }
    
    .tool-date {
      font-size: 12px;
      color: #9ca3af;
    }
    
    /* ===== 返回按钮 ===== */
    /* ===== 提示框 ===== */
    .info-box {
      background: #f3e8ff;
      border-radius: 12px;
      padding: 16px 20px;
      margin-top: 32px;
    }
    
    .info-box p {
      color: #7c3aed;
      font-size: 14px;
      text-align: center;
    }
    
    /* ===== 响应式设计 ===== */
    @media (max-width: 768px) {
      .container {
        margin-top: 20px;
        padding: 0 16px;
        width: min(90%, 1200px);
      }
      
      .page-header {
        flex-wrap: wrap;
      }
      
      .page-title {
        font-size: 22px;
      }
      
      .tools-grid {
        grid-template-columns: 1fr;
      }
    }
  
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px; background: #111827; color: white;
      text-decoration: none; border-radius: 6px;
      font-weight: 500; font-size: 13px;
      transition: background 0.3s ease;
      flex-shrink: 0; white-space: nowrap;
    }
    .back-link:hover { background: #374151; }
</style>
</head>
<body>
  <script src="navbar.js"></script>

  <main class="container">
    <!-- ===== 标题行 ===== -->
    <div class="page-header">
      <div class="page-title-wrap">
        <svg class="page-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
          <path d="M4.7 19.3a1 1 0 0 0 1.4 0l3.77-3.77" />
        </svg>
        <h1 class="page-title">工具</h1>
      </div>
      <a href="index" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        返回首页
      </a>
    </div>

    <!-- ===== 副标题 ===== -->
    <div class="page-subtitle-wrapper">
      <p class="page-subtitle">深圳地铁相关实用工具，持续开发中</p>
    </div>

    <!-- ===== 工具卡片网格 ===== -->
    <div class="tools-grid">
      <!-- 工具1：PIDS 模拟器 -->
      <a href="PIDS_5.3_1_v7" class="tool-card">
        <div class="tool-icon" style="background: #dbeafe; color: #1e40af;">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="16" rx="2"></rect>
            <line x1="8" y1="20" x2="16" y2="20"></line>
            <line x1="10" y1="14" x2="10" y2="18"></line>
            <line x1="14" y1="14" x2="14" y2="18"></line>
            <path d="M18 8l-4 4-4-4-4 4"></path>
          </svg>
        </div>
        <div class="tool-content">
          <h3 class="tool-title">
            PIDS 模拟器（5.3：1）
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
            </svg>
          </h3>
          <p class="tool-description">深圳地铁列车乘客信息显示系统（PIDS）模拟器，支持多线路、实时显示到站信息。</p>
          <div class="tool-meta">
            <span class="tool-type tool-type-beta">Beta</span>
            <span class="tool-date">v0.5</span>
          </div>
        </div>
      </a>

      <!-- 工具2：票价计算器 -->
      <a href="sz_metro_fare" class="tool-card">
        <div class="tool-icon" style="background: #dcfce7; color: #166534;">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M12 6v6l4 2"></path>
          </svg>
        </div>
        <div class="tool-content">
          <h3 class="tool-title">
            票价计算器
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
            </svg>
          </h3>
          <p class="tool-description">深圳地铁票价查询工具，支持1、2、3号线站点票价计算与路径规划。</p>
          <div class="tool-meta">
            <span class="tool-type tool-type-testing">测试版</span>
            <span class="tool-date">v0.1</span>
          </div>
        </div>
      </a>

      <!-- 工具3：卫生间位置查询 -->
      <a href="toilet" class="tool-card">
        <div class="tool-icon" style="background: #fef3c7; color: #92400e;">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <path d="M16 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <path d="M15 21h-1"></path>
            <path d="M12 7v13"></path>
            <path d="M8 7v13"></path>
            <path d="M16 7v13"></path>
            <path d="M12 3v4"></path>
          </svg>
        </div>
        <div class="tool-content">
          <h3 class="tool-title">
            卫生间位置查询
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
            </svg>
          </h3>
          <p class="tool-description">深圳地铁各站点卫生间位置查询，支持闸机内外分布信息。</p>
          <div class="tool-meta">
            <span class="tool-type tool-type-beta">Beta</span>
            <span class="tool-date">v0.1</span>
          </div>
        </div>
      </a>

      <!-- 工具4：线路仪表板 -->
      <a href="dashboard" class="tool-card">
        <div class="tool-icon" style="background: #e0e7ff; color: #3730a3;">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1"></rect>
            <rect x="14" y="3" width="7" height="7" rx="1"></rect>
            <rect x="14" y="14" width="7" height="7" rx="1"></rect>
            <rect x="3" y="14" width="7" height="7" rx="1"></rect>
          </svg>
        </div>
        <div class="tool-content">
          <h3 class="tool-title">
            线路仪表板
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
            </svg>
          </h3>
          <p class="tool-description">深圳地铁全线路综合数据仪表板，支持单线路详情与全线路总览。</p>
          <div class="tool-meta">
            <span class="tool-type tool-type-stable">稳定版</span>
            <span class="tool-date">v1.0</span>
          </div>
        </div>
      </a>
    </div>

    <!-- ===== 底部提示 ===== -->
    <div class="info-box">
      <p>更多工具正在开发中，敬请期待</p>
    </div>
  </main>

  <script>
    // ===== 实时时间（由 navbar.js 统一处理，此处保留空事件） =====
    function updateTime() {}
    // ===== 移动端菜单（由 navbar.js 统一处理） =====
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    if (mobileMenuBtn) {
      mobileMenuBtn.addEventListener('click', () => {});
    }
  </script>
</body>
</html>
