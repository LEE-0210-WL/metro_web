<body>
<a href="/" class="back-link">返回首页</a>
<h1 class="page-title">楼盘进度计数器</h1>
<p class="page-subtitle">实时进度，速度受Workers KV影响</p>
<div class="kv-status-bar" id="kv-bar">
  <span class="kv-label">KV写入已用</span>
  <div class="kv-barwrap"><div class="kv-bar" id="kv-bar-inner" style="width:0%"></div></div>
  <span class="kv-pct" id="kv-pct">计算中...</span>
  <span class="kv-timer" id="kv-timer">距重置: --时--分--秒</span>
  <span class="kv-lock" id="kv-lock">写入已锁定</span>
</div>
<div id="funcounter-wrap"></div>

<!-- ===== 商品购买区 ===== -->
<div class="shop-section" id="shopSection">
  <div class="shop-tabs" id="shopTabs"></div>
  <div class="shop-grid" id="shopGrid"></div>
</div>

<!-- ===== 打卡区域 ===== -->
<div class="checkin-area" id="checkinArea">
  <div class="title">🚻 安托山公厕</div>
  <div class="sub">今日打卡 · 每人每天限 1 次</div>
  <div class="status" id="checkinStatus">已打卡: <span class="done">1</span> / <span class="undo">1</span></div>
  <button class="btn" id="checkinBtn">打卡 ✅</button>
  <div class="target-hint">目标总量 1 次 · 打完收工</div>
</div>

<script>
(function(){
"use strict";

// ========== 用户身份标识 ==========
function getUserId() {
  let id = localStorage.getItem('userId');
  if (!id) {
    id = crypto.randomUUID ? crypto.randomUUID() : 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
    localStorage.setItem('userId', id);
  }
  return id;
}
var USER_ID = getUserId();

// ========== 基础配置 ==========
var API_BASE="";
var remaining=11300000000;
var sold=50000000;
var blast=0.0;
var xifuRemaining=20000;
var xifuSold=0;
var bombProgress=0.0;

// ========== Toast 提示 ==========
var toastTimer = null;
function showToast(msg, duration) {
  duration = duration || 2500;
  var old = document.querySelector('.toast-msg');
  if(old) old.remove();
  if(toastTimer) clearTimeout(toastTimer);
  var div = document.createElement('div');
  div.className = 'toast-msg';
  div.textContent = msg;
  document.body.appendChild(div);
  toastTimer = setTimeout(function(){
    div.classList.add('hide');
    setTimeout(function(){ div.remove(); }, 500);
    toastTimer = null;
  }, duration);
}

// ========== API ==========
async function apiGet(){
  try{
    var r=await fetch(API_BASE+"/api/counters", {
      headers: { 'X-User-Id': USER_ID }
    });
    if(!r.ok)throw new Error("http"+r.status);
    return await r.json();
  }catch(e){console.error("sync-get",e);return null}
}
async function apiPost(id,delta){
  try{
    var r=await fetch(API_BASE+"/api/counters",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "X-User-Id": USER_ID
      },
      body:JSON.stringify({id:id,delta:delta})
    });
    if(!r.ok){
      var errText = await r.text();
      var errObj;
      try { errObj = JSON.parse(errText); } catch(e) { errObj = {error: errText}; }
      if (r.status === 429) {
        throw new Error(errObj.error || "请求过于频繁");
      }
      throw new Error(errObj.error || ("http"+r.status));
    }
    return await r.json();
  }catch(e){
    console.error("sync-post",e);
    if (e.message && e.message.includes('额度已用完')) {
      alert(e.message);
      return null;
    }
    throw e;
  }
}

// ========== 获取 KV 统计 ==========
async function fetchKVStats() {
  try {
    const res = await fetch('/api/kv-stats?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data && typeof data.writes === 'number') {
      lastValidStats = data;
      return data;
    }
    throw new Error('Invalid data');
  } catch (e) {
    console.warn('KV stats fetch failed, using cached value', e);
    return null;
  }
}

async function updateStatsBar(showLoadingToast) {
  if (showLoadingToast) {
    showToast('正在同步KV用量...', 1500);
  }
  const stats = await fetchKVStats();
  if (stats) {
    kvWritesToday = stats.writes;
    KV_WRITE_LIMIT = stats.writeLimit || 1000;
    updateKvBar();
  }
  updateKvBar();
}

function startKVStatsPolling() {
  updateStatsBar(false);
  setInterval(function(){ updateStatsBar(false); }, 60000);
}

function updateButtons() {
  var btns = document.querySelectorAll('.fc-btn, .shop-card .btns button, .shop-card .custom-row button, #checkinBtn');
  btns.forEach(function(btn) {
    btn.disabled = isWriteLocked || isProcessing;

  if (lockEl) {
    lockEl.style.display = isWriteLocked ? 'inline' : 'none';
  }
}

// ========== 顶部状态条 ==========
function updateKvBar(){
  var bar=document.getElementById("kv-bar");
  var inner=document.getElementById("kv-bar-inner");
  var pctEl=document.getElementById("kv-pct");
  var timerEl=document.getElementById("kv-timer");
  if(!bar||!inner||!pctEl||!timerEl)return;
  
  var pct=Math.min((kvWritesToday/KV_WRITE_LIMIT)*100,100);
  inner.style.width=pct+"%";
  pctEl.textContent=kvWritesToday.toLocaleString("zh-CN")+" / "+KV_WRITE_LIMIT+" ("+pct.toFixed(1)+"%)";
  
  bar.classList.remove("kv-warn","kv-safe");
  if(pct>=80)bar.classList.add("kv-warn");
  else if(pct<=30)bar.classList.add("kv-safe");
  
  if (pct >= 95) {
    isWriteLocked = true;
  } else {
    isWriteLocked = false;
  }
  updateButtons();

  var now=new Date();
  var reset=new Date(now);
  reset.setUTCHours(0,0,0,0);
  if(now>=reset) reset.setUTCDate(reset.getUTCDate()+1);
  var diff=Math.max(0,Math.floor((reset-now)/1000));
  var h=Math.floor(diff/3600);
  var m=Math.floor((diff%3600)/60);
  var s=diff%60;
  timerEl.textContent="距重置: "+h+"时"+m+"分"+s+"秒";
}

function startTimer(){
  if(timerInterval) clearInterval(timerInterval);
  timerInterval=setInterval(updateKvBar,1000);
}

function getCategoryLabel(cat){
  var map = {
    '饮料零食':'饮料零食','泡面饮料':'泡面饮料','日用品':'日用品',
    '餐饮':'餐饮','其他':'其他','保健':'保健','交通':'交通',
    '楼盘':'楼盘','工程':'工程'
  };
  return map[cat] || cat;
}

function renderShopTabs(categories, current) {
  var container = document.getElementById('shopTabs');
  if(!container) return;
  var html = '<button class="shop-tab active" data-cat="全部">全部</button>';
  categories.forEach(function(cat){
    var active = (cat === current) ? ' active' : '';
    html += '<button class="shop-tab'+active+'" data-cat="'+cat+'">'+getCategoryLabel(cat)+'</button>';
  });
  container.innerHTML = html;
  container.querySelectorAll('.shop-tab').forEach(function(btn){
    btn.addEventListener('click', function(){
      var cat = this.dataset.cat;
      document.querySelectorAll('.shop-tab').forEach(function(b){ b.classList.remove('active'); });
      this.classList.add('active');
      renderShopGrid(cat);
    });
  });
}

function renderShopGrid(category) {
  var container = document.getElementById('shopGrid');
  if(!container) return;
  var items = [];
  for(var id in productData) {
    var p = productData[id];
    var cat = p.category || '其他';
    if(category !== '全部' && cat !== category) continue;
    items.push({id:id, data:p});
  }
  if(items.length === 0) {
    container.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#9ca3af;">该分类暂无商品</div>';
    return;
  }
  var html = '';
  items.forEach(function(item){
    var p = item.data;
    var isBHL = (item.id === 'bhl');
    var typeClass = isBHL ? ' type-bhl' : '';
    var remainingDisplay = p.remaining !== undefined ? p.remaining : '∞';
    var soldDisplay = p.sold !== undefined ? p.sold : 0;
    var dailyDisplay = p.dailyUsed !== undefined ? p.dailyUsed : 0;
    var dailyLimit = p.dailyLimit || '∞';
    var userDailyDisplay = p.userDailyUsed !== undefined ? p.userDailyUsed : 0;
    var userDailyLimit = p.perUserDailyLimit || '∞';
    var unit = p.unit || '个';
    var name = p.name || item.id;
    var tagClass = p.category || '其他';
    // 特殊处理八合里
    var actionText = isBHL ? '下单' : '购买';
    var btnHtml = '';
    if(isBHL) {
      btnHtml = '<div class="btns">'+
        '<button onclick="doShop(\''+item.id+'\',50)">¥50</button>'+
        '<button onclick="doShop(\''+item.id+'\',100)">¥100</button>'+
        '<button onclick="doShop(\''+item.id+'\',200)">¥200</button>'+
        '<div class="custom-row">'+
          '<input type="number" id="inp_'+item.id+'" placeholder="金额" min="1" max="500" step="1">'+
          '<button onclick="doShopCustom(\''+item.id+'\')">下单</button>'+
        '</div>'+
      '</div>';
    } else {
      btnHtml = '<div class="btns">'+
        '<button onclick="doShop(\''+item.id+'\',1)">+1</button>'+
        '<button onclick="doShop(\''+item.id+'\',5)">+5</button>'+
        '<button onclick="doShop(\''+item.id+'\',10)">+10</button>'+
        '<div class="custom-row">'+
          '<input type="number" id="inp_'+item.id+'" placeholder="数量" min="1" max="100" step="1">'+
          '<button onclick="doShopCustom(\''+item.id+'\')">确定</button>'+
        '</div>'+

    }
    html += '<div class="shop-card'+typeClass+'">'+
      '<div class="name">'+name+' <span class="tag '+tagClass+'">'+getCategoryLabel(p.category)+'</span></div>'+
      '<div class="stats">'+

// ========== 打卡渲染 ==========
function renderCheckin() {
  if(!checkinData) return;
  var status = checkinData.status || 0;
  var target = checkinData.target || 1;
  var el = document.getElementById('checkinStatus');
  var btn = document.getElementById('checkinBtn');
  if(el) {
    var doneText = status >= target ? '<span class="done">'+target+'</span>' : '<span class="undo">'+status+'</span>';
    el.innerHTML = '已打卡: '+doneText+' / <span class="undo">'+target+'</span>';
  }
  if(btn) {
    if(status >= target) {
      btn.textContent = '✅ 已打卡';
      btn.disabled = true;
      btn.className = 'btn done-btn';
    } else {
      btn.textContent = '打卡 ✅';
      btn.disabled = false;
      btn.className = 'btn';
    }
  }
}

async function doCheckin() {
  if(isProcessing) { showToast('请稍候...', 1000); return; }
  if(isWriteLocked) { showToast('今日写入已锁定，请明天再试', 2500); return; }
  if(checkinData && checkinData.status >= 1) {
    showToast('你今天已经打过卡了！', 2000);
    return;
  }
  isProcessing = true;
  updateButtons();
  try {
    var res = await apiPost('atsgs', 1);
    isProcessing = false;
    updateButtons();
    if(res && res.ok) {
      checkinData.status = 1;
      renderCheckin();
      showToast('打卡成功！✅ 安托山公厕今日已打卡', 2000);
      // 重新拉取完整数据
      await fetchFullData();
    } else {
      showToast('打卡失败，请重试', 2000);
    }
  } catch(e) {
    isProcessing = false;
    updateButtons();
    if(e.message && e.message.includes('额度已用完')) {
      // 已由 apiPost 处理
    } else {
      showToast('操作异常：'+e.message, 2500);
    }
  }
}

// ========== 商品购买 ==========
async function doShop(id, delta) {
  if(isProcessing) { showToast('请稍候...', 1000); return; }
  if(isWriteLocked) { showToast('今日写入已锁定，请明天再试', 2500); return; }
  var p = productData[id];
  if(!p) return;
  if(p.remaining !== undefined && p.remaining < delta) {
    showToast('库存不足！剩余 '+p.remaining+' '+p.unit, 2000);
    return;
  }
  isProcessing = true;
  updateButtons();
  try {
    var res = await apiPost(id, delta);
    isProcessing = false;
    updateButtons();
    if(res && res.ok) {
      // 更新本地数据
      if(res.remaining !== undefined) p.remaining = res.remaining;
      if(res.sold !== undefined) p.sold = res.sold;
      if(res.dailyUsed !== undefined) p.dailyUsed = res.dailyUsed;
      if(res.userDailyUsed !== undefined) p.userDailyUsed = res.userDailyUsed;
      renderShopGrid(currentCategory);
      showToast('购买成功！+'+delta+' '+p.unit, 1500);
      // 如果是楼盘/工程类，也更新对应变量
      await fetchFullData();
    } else {
      showToast('购买失败，请重试', 2000);
    }
  } catch(e) {
    isProcessing = false;
    updateButtons();
    if(e.message && e.message.includes('额度已用完')) {
      // 已由 apiPost 处理
    } else {
      showToast('操作异常：'+e.message, 2500);
    }
  }
}

async function doShopCustom(id) {
  var inp = document.getElementById('inp_'+id);
  if(!inp) return;
  var val = parseFloat(inp.value);
  if(isNaN(val) || val <= 0) {
    showToast('请输入有效数量', 1500);
    return;
  }
  var p = productData[id];
  if(!p) return;
  var maxVal = (id === 'bhl') ? 500 : 100;
  if(val > maxVal) {
    showToast('最大值为 '+maxVal, 1500);
    return;
  }
  // 八合里特殊检查
  if(id === 'bhl' && val < 1) {
    showToast('最低金额为 1 元', 1500);
    return;
  }
  await doShop(id, val);
}

// ========== 获取完整数据 ==========
async function fetchFullData() {
  try {
    var data = await apiGet();
    if(!data) return;
    // 更新楼盘数据
    if(data.remaining !== undefined) remaining = data.remaining;
    if(data.sold !== undefined) sold = data.sold;
    if(data.blast !== undefined) blast = data.blast;
    if(data.xifuRemaining !== undefined) xifuRemaining = data.xifuRemaining;
    if(data.xifuSold !== undefined) xifuSold = data.xifuSold;
    if(data.bombProgress !== undefined) bombProgress = data.bombProgress;
    if(data.dogProgress !== undefined) dogProgress = data.dogProgress;
    if(data.dogDecimals !== undefined) dogDecimals = data.dogDecimals;
    if(data.yunfanRemaining !== undefined) yunfanRemaining = data.yunfanRemaining;
    if(data.yunfanSold !== undefined) yunfanSold = data.yunfanSold;
    if(data.jingyunRemaining !== undefined) jingyunRemaining = data.jingyunRemaining;
    if(data.jingyunSold !== undefined) jingyunSold = data.jingyunSold;

    if(data.longjingRemaining !== undefined) longjingRemaining = data.longjingRemaining;

    if(data.ruichengSold !== undefined) ruichengSold = data.ruichengSold;
    if(data.huichengRemaining !== undefined) huichengRemaining = data.huichengRemaining;
    if(data.huichengSold !== undefined) huichengSold = data.huichengSold;
    renderAll();
    // 更新商品数据
    if(data.products) {
      productData = data.products;
      var categories = new Set();
      for(var id in productData) {
        var p = productData[id];
        if(p.category) categories.add(p.category);
      }
      var catArray = Array.from(categories).sort();
      renderShopTabs(catArray, currentCategory);
      renderShopGrid(currentCategory);
    }
    // 更新打卡数据
    if(data.checkin) {
      checkinData = data.checkin;
      renderCheckin();
    }
  } catch(e) {
    console.error('fetchFullData error', e);
  }
}

// ========== 轮询同步 ==========
async function syncFromServer(){
  if(isSyncing)return;
  isSyncing=true;
  var now=Date.now();
  var minInterval=Math.min(currentPollInterval,5000*Math.pow(2,Math.min(syncFailCount,6)));
  if(now-lastSync<minInterval){isSyncing=false;return;}
  lastSync=now;
  await fetchFullData();
  isSyncing=false;
  currentPollInterval=Math.min(600000, currentPollInterval*1.5);
  if(pollTimer){
    clearInterval(pollTimer);
    pollTimer=setInterval(syncFromServer,currentPollInterval);
  }
}

function startPolling(){
  if(pollTimer)clearInterval(pollTimer);
  currentPollInterval=30000;
  syncFromServer();
  pollTimer=setInterval(syncFromServer,currentPollInterval);
}
function stopPolling(){
  if(pollTimer){clearInterval(pollTimer);pollTimer=null;}
}

document.addEventListener("visibilitychange", function(){
  if(document.hidden) {
    stopPolling();
  } else {
    syncFromServer();
    updateStatsBar(true);
    startPolling();
  }
});

window.addEventListener("pageshow", function(event){
  if (event.persisted) {
    syncFromServer();
    updateStatsBar(true);
  }
});

// ========== 回滚函数 ==========
function rollbackEstate(oldR,oldS){remaining=oldR;sold=oldS;renderEstate();}
function rollbackXifu(oldR,oldS){xifuRemaining=oldR;xifuSold=oldS;renderXifu();}
function rollbackYunfan(oldR,oldS){yunfanRemaining=oldR;yunfanSold=oldS;renderYunfan();}
function rollbackJingyun(oldR,oldS){jingyunRemaining=oldR;jingyunSold=oldS;renderJingyun();}
function rollbackJingcheng(oldR,oldS){jingchengRemaining=oldR;jingchengSold=oldS;renderJingcheng();}
function rollbackLongjing(oldR,oldS){longjingRemaining=oldR;longjingSold=oldS;renderLongjing();}
function rollbackRuicheng(oldR,oldS){ruichengRemaining=oldR;ruichengSold=oldS;renderRuicheng();}
function rollbackHuicheng(oldR,oldS){huichengRemaining=oldR;huichengSold=oldS;renderHuicheng();}
function rollbackBlast(oldB){blast=oldB;renderBlast();}
function rollbackBomb(oldB){bombProgress=oldB;renderBomb();}
function rollbackDog(oldD,oldDec){dogProgress=oldD;dogDecimals=oldDec;renderDog();}

function resetPollInterval(){
  currentPollInterval=30000;
  if(pollTimer){
    clearInterval(pollTimer);
    pollTimer=setInterval(syncFromServer,currentPollInterval);
  }
}

// ========== 操作函数（原有楼盘 + 工程） ==========
// 深铁阅云境
async function doEstate(n){
  if (isProcessing) { showToast('请稍候...', 1000); return; }
  if (isWriteLocked) { showToast('今日写入已锁定，请明天再试', 2500); return; }
  if(remaining < n){ alert("剩余楼盘不足！"); return; }
  var oldR=remaining, oldS=sold;
  remaining -= n; sold += n;
  renderEstate();
  showEgg("estate", n);
  showToast('已操作，正在同步云端...', 1500);
  resetPollInterval();
  isProcessing = true;
  updateButtons();
  try {
    var res = await apiPost("estate", n);
    isProcessing = false;
    updateButtons();
    if (res && res.ok) {
      remaining = res.remaining; sold = res.sold;
      renderEstate();
      await updateStatsBar(true);
      showToast('同步完成', 1000);
      await fetchFullData();
    } else {
      rollbackEstate(oldR, oldS);
      if (res === null) showToast('网络异常，已回滚', 2000);
    }
  } catch (e) {
    isProcessing = false; updateButtons();
    rollbackEstate(oldR, oldS);
    if (!e.message.includes('额度已用完')) alert("操作异常：" + e.message);
  }
}

  if(dogProgress >= 99.9999999999){ alert("狗椅已完全倒闭！"); return; }
  var oldD = dogProgress, oldDec = dogDecimals;
  dogProgress = Math.min(dogProgress + n, 99.9999999999);
  renderDog();
  showEgg("dogchair", n);
  showToast('已操作，正在同步云端...', 1500);
  resetPollInterval();
  isProcessing = true;
  updateButtons();
  try {
    var res = await apiPost("dogchair", n);
    isProcessing = false;
    updateButtons();
    if (res && res.ok) {
      dogProgress = res.dogProgress; dogDecimals = res.dogDecimals || 2;
      renderDog();
      await updateStatsBar(true);
      showToast('同步完成', 1000);
      await fetchFullData();
    } else {
      rollbackDog(oldD, oldDec);
      if (res === null) showToast('网络异常，已回滚', 2000);
    }
  } catch (e) {
    isProcessing = false; updateButtons();
    rollbackDog(oldD, oldDec);
    if (!e.message.includes('额度已用完')) alert("操作异常：" + e.message);
  }
}
