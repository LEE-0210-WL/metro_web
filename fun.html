  <span class="kv-timer" id="kv-timer">⏳ 距重置: --时--分--秒</span>
</div>
<div id="funcounter-wrap"></div>

<script>
(function(){
"use strict";
var API_BASE="";
var remaining=11300000000;
var sold=50000000;
var blast=0.0;
var xifuRemaining=20000;
var xifuSold=0;
var bombProgress=0.0;
var dogProgress=0.0;
var dogDecimals=2;
var lastSync=0;
var syncFailCount=0;
var pollTimer=null;
var kvReadsToday=0;
var kvWritesToday=0;
var KV_READ_LIMIT=100000;
var KV_WRITE_LIMIT=1000;
var isSyncing=false;
var currentPollInterval = 30000;
var timerInterval = null;

// ---------- 工具函数 ----------
function fmtMoney(n){return n.toLocaleString("zh-CN")+"套"}
function fmtBlast(n){return n.toFixed(2)}
function fmtBomb(n){return n.toFixed(2)}
function fmtDog(n){
  var dec=Math.max(2,dogDecimals);
  return n.toFixed(dec);
}

// ---------- 彩蛋消息 ----------
var eggMessages={
  estate:{
    1:["又卖了一套！深铁阅云境火爆热销中","恭喜业主喜提新房！","+1套，开发商笑开花"],
    5:["大单！神秘买家一次性购入5套！","整层客户出现！","5套成交，销售冠军诞生"],
    10:["整层售罄！开发商笑醒了","10套大单！这栋楼要清盘了","豪横！直接拿下10套"],
    custom:["成交！数字由你定义","自定义大单，牛！","这数字...有故事啊"]
  },
  xifu:{
    1:["深铁熙府又出一套！","熙府热销中","+1套"],
    5:["熙府大单！","5套成交","熙府火爆"],
    10:["熙府整层！","10套大单","熙府要清盘了"],
    custom:["熙府成交！","自定义大单","有故事啊"]
  },
  blast:{
    0.01:["爆破队正在热身...","0.01%进度，炸药已就位","开始倒计时..."],
    0.02:["轰！又炸掉一点！","进度稳步推进","爆破专家在线施工"],
    0.05:["巨响！这栋楼又矮了一点","+0.05%！震感强烈","专业爆破"],
    custom:["自定义爆破量，专业！","这数字...精准打击","爆破进度由你掌控"]
  },
  bombardier:{
    0.01:["庞巴迪翻新+0.01%","翻新稳步推进","工人正在加班"],
    0.02:["翻新进度+0.02%","又翻新了一点","庞巴迪焕然一新"],
    0.05:["翻新大进展！","+0.05%","庞巴迪要翻新完了"],
    custom:["自定义翻新量","精准翻新","翻新进度由你掌控"]
  },
  dogchair:{
    0.01:["狗椅倒闭+0.01%","倒闭稳步推进","又离倒闭近了一点"],
    0.02:["倒闭进度+0.02%","狗椅快不行了","加油倒闭"],
    0.05:["倒闭大进展！","+0.05%","狗椅即将倒闭"],
    custom:["自定义倒闭量","精准打击狗椅","倒闭进度由你掌控"]
  }
};
function showEgg(type,amount){
  var msgs;
  if(type==="estate"){
    if(amount===1)msgs=eggMessages.estate[1];
    else if(amount===5)msgs=eggMessages.estate[5];
    else if(amount===10)msgs=eggMessages.estate[10];
    else msgs=eggMessages.estate.custom;
  }else if(type==="xifu"){
    if(amount===1)msgs=eggMessages.xifu[1];
    else if(amount===5)msgs=eggMessages.xifu[5];
    else if(amount===10)msgs=eggMessages.xifu[10];
    else msgs=eggMessages.xifu.custom;
  }else if(type==="blast"){
    if(Math.abs(amount-0.01)<0.001)msgs=eggMessages.blast[0.01];
    else if(Math.abs(amount-0.02)<0.001)msgs=eggMessages.blast[0.02];
    else if(Math.abs(amount-0.05)<0.001)msgs=eggMessages.blast[0.05];
    else msgs=eggMessages.blast.custom;
  }else if(type==="bombardier"){
    if(Math.abs(amount-0.01)<0.001)msgs=eggMessages.bombardier[0.01];
    else if(Math.abs(amount-0.02)<0.001)msgs=eggMessages.bombardier[0.02];
    else if(Math.abs(amount-0.05)<0.001)msgs=eggMessages.bombardier[0.05];
    else msgs=eggMessages.bombardier.custom;
  }else if(type==="dogchair"){
    if(Math.abs(amount-0.01)<0.001)msgs=eggMessages.dogchair[0.01];
    else if(Math.abs(amount-0.02)<0.001)msgs=eggMessages.dogchair[0.02];
    else if(Math.abs(amount-0.05)<0.001)msgs=eggMessages.dogchair[0.05];
    else msgs=eggMessages.dogchair.custom;
  }
  var msg=msgs[Math.floor(Math.random()*msgs.length)];
  var div=document.createElement("div");
  div.className="funcounter-egg";
  div.textContent=msg;
  document.body.appendChild(div);
  requestAnimationFrame(function(){div.classList.add("show")});
  setTimeout(function(){
    div.classList.remove("show");
    setTimeout(function(){div.remove()},400);
  },2200);
}

// ---------- API ----------
async function apiGet(){
  try{
    var r=await fetch(API_BASE+"/api/counters");
    if(!r.ok)throw new Error("http"+r.status);
    return await r.json();
  }catch(e){console.error("sync-get",e);return null}
}
async function apiPost(id,delta){
  try{
    var r=await fetch(API_BASE+"/api/counters",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({id:id,delta:delta})
    });
    if(!r.ok){
      var err=await r.json().catch(function(){return{error:"unknown"}});
      throw new Error(err.error||("http"+r.status));
    }
    return await r.json();
  }catch(e){console.error("sync-post",e);alert(e.message);return null}
}

// ---------- 顶部状态条（写入进度 + 倒计时） ----------
function updateKvBar(){
  var bar=document.getElementById("kv-bar");
  var inner=document.getElementById("kv-bar-inner");
  var pctEl=document.getElementById("kv-pct");
  var timerEl=document.getElementById("kv-timer");
  if(!bar||!inner||!pctEl||!timerEl)return;
  
  // 写入进度
  var pct=Math.min((kvWritesToday/KV_WRITE_LIMIT)*100,100);
  inner.style.width=pct+"%";
  pctEl.textContent=kvWritesToday.toLocaleString("zh-CN")+" / "+KV_WRITE_LIMIT+" ("+pct.toFixed(1)+"%)";
  
  bar.classList.remove("kv-warn","kv-safe");
  if(pct>=80)bar.classList.add("kv-warn");
  else if(pct<=30)bar.classList.add("kv-safe");
  
  // 倒计时：UTC 0点 = 北京时间8点
  var now=new Date();
  var reset=new Date(now);
  reset.setUTCHours(0,0,0,0);
  if(now>=reset) reset.setUTCDate(reset.getUTCDate()+1);
  var diff=Math.max(0,Math.floor((reset-now)/1000));
  var h=Math.floor(diff/3600);
  var m=Math.floor((diff%3600)/60);
  var s=diff%60;
  timerEl.textContent="⏳ 距重置: "+h+"时"+m+"分"+s+"秒";
}
function startTimer(){
  if(timerInterval) clearInterval(timerInterval);
  timerInterval=setInterval(updateKvBar,1000);
}

// ---------- 渲染函数 ----------
function renderEstate(){
  var el=document.getElementById("fc-estate-num");
  var sl=document.getElementById("fc-sold-num");
  if(el)el.textContent=fmtMoney(remaining);
  if(sl)sl.textContent=fmtMoney(sold);
}
function renderXifu(){
  var el=document.getElementById("fc-xifu-num");
  var sl=document.getElementById("fc-xifu-sold");
  if(el)el.textContent=fmtMoney(xifuRemaining);
  if(sl)sl.textContent=fmtMoney(xifuSold);
}
function renderBlast(){
  var el=document.getElementById("fc-blast-num");
  var bar=document.getElementById("fc-blast-bar");
  if(el)el.textContent=fmtBlast(blast)+"/100.00";
  if(bar)bar.style.setProperty("--blast-pct",Math.min(blast,100)+"%");
  if(blast>=100){
    var wrap=document.getElementById("fc-blast-wrap");
    if(wrap&&!wrap.classList.contains("done")){
      wrap.classList.add("done");
      showBlastDone();
    }
  }
}
function renderBomb(){
  var el=document.getElementById("fc-bomb-num");
  var bar=document.getElementById("fc-bomb-bar");
  if(el)el.textContent=fmtBomb(bombProgress)+"/100.00";
  if(bar)bar.style.setProperty("--bomb-pct",Math.min(bombProgress,100)+"%");
}
function renderDog(){
  var el=document.getElementById("fc-dog-num");
  var bar=document.getElementById("fc-dog-bar");
  if(el)el.textContent=fmtDog(dogProgress)+"/99.9999999999";
  if(bar)bar.style.setProperty("--dog-pct",Math.min(dogProgress*100/99.9999999999,100)+"%");
}
function showBlastDone(){
  var div=document.createElement("div");
  div.className="funcounter-blastdone";
  div.innerHTML='<div class="bbd-inner"><h2>大楼已完全爆破！</h2><p>吵吵吵楼已成为历史</p><button id="bbd-close">我知道了</button></div>';
  document.body.appendChild(div);
  requestAnimationFrame(function(){div.classList.add("show")});
  div.querySelector("#bbd-close").onclick=function(){
    div.classList.remove("show");
    setTimeout(function(){div.remove()},400);
  };
}

// ---------- 绑定按钮 ----------
function bindEstate(){
  document.getElementById("fc-btn-e1").onclick=function(){doEstate(1)};
  document.getElementById("fc-btn-e5").onclick=function(){doEstate(5)};
  document.getElementById("fc-btn-e10").onclick=function(){doEstate(10)};
  document.getElementById("fc-btn-ec").onclick=function(){
    var v=parseInt(document.getElementById("fc-inp-e").value,10);
    if(v>0&&v<=100){doEstate(v)}
    else{alert("请输入1-100之间的整数")}
  };
}
function bindXifu(){
  document.getElementById("fc-btn-x1").onclick=function(){doXifu(1)};
  document.getElementById("fc-btn-x5").onclick=function(){doXifu(5)};
  document.getElementById("fc-btn-x10").onclick=function(){doXifu(10)};
  document.getElementById("fc-btn-xc").onclick=function(){
    var v=parseInt(document.getElementById("fc-inp-x").value,10);
    if(v>0&&v<=100){doXifu(v)}
    else{alert("请输入1-100之间的整数")}
  };
}
function bindBlast(){
  document.getElementById("fc-btn-b01").onclick=function(){doBlast(0.01)};
  document.getElementById("fc-btn-b05").onclick=function(){doBlast(0.02)};
  document.getElementById("fc-btn-b1").onclick=function(){doBlast(0.05)};
  document.getElementById("fc-btn-bc").onclick=function(){
    var v=parseFloat(document.getElementById("fc-inp-b").value);
    if(v>=0.01&&v<=1.5){doBlast(v)}
    else{alert("请输入0.01-1.5之间的数字")}
  };
}
function bindBomb(){
  document.getElementById("fc-btn-m01").onclick=function(){doBomb(0.01)};
  document.getElementById("fc-btn-m05").onclick=function(){doBomb(0.02)};
  document.getElementById("fc-btn-m1").onclick=function(){doBomb(0.05)};
  document.getElementById("fc-btn-mc").onclick=function(){
    var v=parseFloat(document.getElementById("fc-inp-m").value);
    if(v>=0.01&&v<=1.5){doBomb(v)}
    else{alert("请输入0.01-1.5之间的数字")}
  };
}
function bindDog(){
  document.getElementById("fc-btn-d01").onclick=function(){doDog(0.01)};
  document.getElementById("fc-btn-d05").onclick=function(){doDog(0.02)};
  document.getElementById("fc-btn-d1").onclick=function(){doDog(0.05)};
  document.getElementById("fc-btn-dc").onclick=function(){
    var v=parseFloat(document.getElementById("fc-inp-d").value);
    if(v>=0.01&&v<=1.5){doDog(v)}
    else{alert("请输入0.01-1.5之间的数字")}
  };
}

// ---------- 回滚 ----------
function rollbackEstate(oldR,oldS){remaining=oldR;sold=oldS;renderEstate();}
function rollbackXifu(oldR,oldS){xifuRemaining=oldR;xifuSold=oldS;renderXifu();}
function rollbackBlast(oldB){blast=oldB;renderBlast();}
function rollbackBomb(oldB){bombProgress=oldB;renderBomb();}
function rollbackDog(oldD,oldDec){dogProgress=oldD;dogDecimals=oldDec;renderDog();}

function resetPollInterval(){
  currentPollInterval=30000;
  if(pollTimer){
    clearInterval(pollTimer);
    pollTimer=setInterval(syncFromServer,currentPollInterval);
  }
}

// ---------- 操作函数（乐观更新） ----------
async function doEstate(n){
  if(remaining<n){alert("剩余楼盘不足！");return}
  var oldR=remaining,oldS=sold;
  remaining-=n;sold+=n;
  renderEstate();
  showEgg("estate",n);
  resetPollInterval();
  var res=await apiPost("estate",n);
  if(res&&res.ok){
    remaining=res.remaining;sold=res.sold;
    if(res._kvReads!==undefined){kvReadsToday=res._kvReads;}
    if(res._kvWrites!==undefined){kvWritesToday=res._kvWrites; updateKvBar();}
    renderEstate();
  }else{
    rollbackEstate(oldR,oldS);
    if(res===null){} else alert("同步失败，已回滚");
  }
}
async function doXifu(n){
  if(xifuRemaining<n){alert("剩余楼盘不足！");return}
  var oldR=xifuRemaining,oldS=xifuSold;
  xifuRemaining-=n;xifuSold+=n;
  renderXifu();
  showEgg("xifu",n);
  resetPollInterval();
  var res=await apiPost("xifu",n);
  if(res&&res.ok){
    xifuRemaining=res.xifuRemaining;xifuSold=res.xifuSold;
    if(res._kvReads!==undefined){kvReadsToday=res._kvReads;}
    if(res._kvWrites!==undefined){kvWritesToday=res._kvWrites; updateKvBar();}
    renderXifu();
  }else{
    rollbackXifu(oldR,oldS);
    if(res===null){} else alert("同步失败，已回滚");
  }
}
async function doBlast(n){
  if(blast>=100){alert("大楼已完全爆破！");return}
  var oldB=blast;
  blast=Math.min(blast+n,100);
  renderBlast();
  showEgg("blast",n);
  resetPollInterval();
  var res=await apiPost("blast",n);
  if(res&&res.ok){
    blast=res.blast;
    if(res._kvReads!==undefined){kvReadsToday=res._kvReads;}
    if(res._kvWrites!==undefined){kvWritesToday=res._kvWrites; updateKvBar();}
    renderBlast();
  }else{
    rollbackBlast(oldB);
    if(res===null){} else alert("同步失败，已回滚");
  }
}
async function doBomb(n){
  if(bombProgress>=100){alert("庞巴迪已完全翻新！");return}
  var oldB=bombProgress;
  bombProgress=Math.min(bombProgress+n,100);
  renderBomb();
  showEgg("bombardier",n);
  resetPollInterval();
  var res=await apiPost("bombardier",n);
  if(res&&res.ok){
    bombProgress=res.bombProgress;
    if(res._kvReads!==undefined){kvReadsToday=res._kvReads;}
    if(res._kvWrites!==undefined){kvWritesToday=res._kvWrites; updateKvBar();}
    renderBomb();
  }else{
    rollbackBomb(oldB);
    if(res===null){} else alert("同步失败，已回滚");
  }
}
async function doDog(n){
  if(dogProgress>=99.9999999999){alert("狗椅已完全倒闭！");return}
  var oldD=dogProgress,oldDec=dogDecimals;
  dogProgress=Math.min(dogProgress+n,99.9999999999);
  renderDog();
  showEgg("dogchair",n);
  resetPollInterval();
  var res=await apiPost("dogchair",n);
  if(res&&res.ok){
    dogProgress=res.dogProgress;dogDecimals=res.dogDecimals||2;
    if(res._kvReads!==undefined){kvReadsToday=res._kvReads;}
    if(res._kvWrites!==undefined){kvWritesToday=res._kvWrites; updateKvBar();}
    renderDog();
  }else{
    rollbackDog(oldD,oldDec);
    if(res===null){} else alert("同步失败，已回滚");
  }
}

// ---------- 同步与自适应轮询 ----------
async function syncFromServer(){
  if(isSyncing)return;
  isSyncing=true;
  var now=Date.now();
  var minInterval=Math.min(currentPollInterval,5000*Math.pow(2,Math.min(syncFailCount,6)));
  if(now-lastSync<minInterval){isSyncing=false;return;}
  lastSync=now;
  var data=await apiGet();
  if(!data){syncFailCount++;isSyncing=false;return;}
  syncFailCount=0;
  
  if(data._kvReads!==undefined){kvReadsToday=data._kvReads;}
  if(data._kvWrites!==undefined){kvWritesToday=data._kvWrites; updateKvBar();}
  if(data.remaining!==undefined)remaining=data.remaining;
  if(data.sold!==undefined)sold=data.sold;
  if(data.blast!==undefined)blast=data.blast;
  if(data.xifuRemaining!==undefined)xifuRemaining=data.xifuRemaining;
  if(data.xifuSold!==undefined)xifuSold=data.xifuSold;
  if(data.bombProgress!==undefined)bombProgress=data.bombProgress;
  if(data.dogProgress!==undefined)dogProgress=data.dogProgress;
  if(data.dogDecimals!==undefined)dogDecimals=data.dogDecimals;
  
  renderEstate();renderXifu();renderBlast();renderBomb();renderDog();
  isSyncing=false;
  
  currentPollInterval=Math.min(600000, currentPollInterval*1.5);
  if(pollTimer){
    clearInterval(pollTimer);
    pollTimer=setInterval(syncFromServer,currentPollInterval);
  }
}

function startPolling(){
  if(pollTimer)clearInterval(pollTimer);
  currentPollInterval=30000;
  syncFromServer();
  pollTimer=setInterval(syncFromServer,currentPollInterval);
}
function stopPolling(){
  if(pollTimer){clearInterval(pollTimer);pollTimer=null;}
}
document.addEventListener("visibilitychange",function(){
  if(document.hidden) stopPolling();
  else startPolling();
});

// ---------- 初始化 ----------
function init(){
  var wrap=document.getElementById("funcounter-wrap");
  if(!wrap)return;
  wrap.innerHTML=
