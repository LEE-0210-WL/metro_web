<body>
<a href="/" class="back-link">返回首页</a>
<h1 class="page-title">物件小卖部</h1>
<p class="page-subtitle">实时进度，速度受 Workers KV / Cloudflare GraphQL Analytics API影响</p>
<div class="kv-status-bar" id="kv-bar">
  <span class="kv-label">KV写入已用</span>
  <div class="kv-barwrap"><div class="kv-bar" id="kv-bar-inner" style="width:0%"></div></div>
  <span class="kv-pct" id="kv-pct">计算中...</span>
  <span class="kv-timer" id="kv-timer">距重置: --时--分--秒</span>
  <span class="kv-lock" id="kv-lock">写入已锁定</span>
</div>

<div class="shop-section" id="shopSection">
  <div class="shop-tabs" id="shopTabs"></div>
  <div class="shop-grid" id="shopGrid"></div>
</div>

<script>
(function(){
"use strict";

function getUserId() {
  let id = localStorage.getItem('userId');
  if (!id) {
    id = crypto.randomUUID ? crypto.randomUUID() : 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
    localStorage.setItem('userId', id);
  }
  return id;
}
var USER_ID = getUserId();

var API_BASE = "";
var lastSync = 0;
var syncFailCount = 0;
var pollTimer = null;
var kvWritesToday = 0;
var KV_WRITE_LIMIT = 1000;
var isSyncing = false;
var currentPollInterval = 30000;
var timerInterval = null;
var lastValidStats = { writes: 0, writeLimit: 1000 };
var isWriteLocked = false;
var isProcessing = false;

var productData = {};
var checkinData = { status: 0, target: 1, unit: '次' };
var currentCategory = '全部';

var toastTimer = null;
function showToast(msg, duration) {
  duration = duration || 2500;
  var old = document.querySelector('.toast-msg');
  if (old) old.remove();
  if (toastTimer) clearTimeout(toastTimer);
  var div = document.createElement('div');
  div.className = 'toast-msg';
  div.textContent = msg;
  document.body.appendChild(div);
  toastTimer = setTimeout(function() {
    div.classList.add('hide');
    setTimeout(function() { div.remove(); }, 500);
    toastTimer = null;
  }, duration);
}

async function apiGet() {
  try {
    var r = await fetch(API_BASE + "/api/counters", {
      headers: { 'X-User-Id': USER_ID }
    });
    if (!r.ok) throw new Error("http" + r.status);
    return await r.json();
  } catch (e) { console.error("sync-get", e); return null; }
}

async function apiPost(id, delta) {
  try {
    var r = await fetch(API_BASE + "/api/counters", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-User-Id": USER_ID
      },
      body: JSON.stringify({ id: id, delta: delta })
    });
    if (!r.ok) {
      var errText = await r.text();
      var errObj;
      try { errObj = JSON.parse(errText); } catch (e) { errObj = { error: errText }; }
      if (r.status === 429) {
        throw new Error(errObj.error || "请求过于频繁");
      }
      throw new Error(errObj.error || ("http" + r.status));
    }
    return await r.json();
  } catch (e) {
    console.error("sync-post", e);
    if (e.message && e.message.includes('额度已用完')) {
      alert(e.message);
      return null;
    }
    throw e;
  }
}

async function fetchKVStats() {
  try {
    const res = await fetch('/api/kv-stats?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data && typeof data.writes === 'number') {
      lastValidStats = data;
      return data;
    }
    throw new Error('Invalid data');
  } catch (e) {
    console.warn('KV stats fetch failed, using cached value', e);
    return null;
  }
}

async function updateStatsBar(showLoadingToast) {
  if (showLoadingToast) showToast('正在同步KV用量...', 1500);
  const stats = await fetchKVStats();
  if (stats) {
    kvWritesToday = stats.writes;
    KV_WRITE_LIMIT = stats.writeLimit || 1000;
  }
  updateKvBar();
}

function startKVStatsPolling() {
  updateStatsBar(false);
  setInterval(function() { updateStatsBar(false); }, 60000);
}

function updateButtons() {
  var btns = document.querySelectorAll('.shop-card .btns button, .shop-card .custom-row button, #checkinBtn');
  btns.forEach(function(btn) {
    btn.disabled = isWriteLocked || isProcessing;
  });
  var lockEl = document.getElementById('kv-lock');
  if (lockEl) lockEl.style.display = isWriteLocked ? 'inline' : 'none';
}

function updateKvBar() {
  var bar = document.getElementById("kv-bar");
  var inner = document.getElementById("kv-bar-inner");
  var pctEl = document.getElementById("kv-pct");
  var timerEl = document.getElementById("kv-timer");
  if (!bar || !inner || !pctEl || !timerEl) return;

  var pct = Math.min((kvWritesToday / KV_WRITE_LIMIT) * 100, 100);
  inner.style.width = pct + "%";
  pctEl.textContent = kvWritesToday.toLocaleString("zh-CN") + " / " + KV_WRITE_LIMIT + " (" + pct.toFixed(1) + "%)";

  bar.classList.remove("kv-warn", "kv-safe");
  if (pct >= 80) bar.classList.add("kv-warn");
  else if (pct <= 30) bar.classList.add("kv-safe");

  isWriteLocked = (pct >= 95);
  updateButtons();

  var now = new Date();
  var reset = new Date(now);
  reset.setUTCHours(0, 0, 0, 0);
  if (now >= reset) reset.setUTCDate(reset.getUTCDate() + 1);
  var diff = Math.max(0, Math.floor((reset - now) / 1000));
  var h = Math.floor(diff / 3600);
  var m = Math.floor((diff % 3600) / 60);
  var s = diff % 60;
  timerEl.textContent = "距重置: " + h + "时" + m + "分" + s + "秒";
}

function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(updateKvBar, 1000);
}

function getCardClassForProduct(id, category) {
  if (id === 'blast') return 'card-blast';
  if (id === 'bombardier') return 'card-bombardier';
  if (id === 'dogchair') return 'card-dogchair';
  if (id === 'estate' || id === 'yunfan' || id === 'jingyun' || id === 'jingcheng' || id === 'longjing' || id === 'ruicheng' || id === 'huicheng') return 'card-estate';
  if (id === 'xifu') return 'card-xifu';
  var map = {
    '楼盘': 'card-estate', '工程': 'card-blast', '饮料零食': 'card-snack',
    '泡面饮料': 'card-noodle', '日用品': 'card-daily', '餐饮': 'card-food',
    '其他': 'card-other', '保健': 'card-health', '交通': 'card-traffic'
  };
  return map[category] || 'card-other';
}

function getCategoryLabel(cat) {
  var map = {
    '楼盘': '楼盘', '工程': '工程', '饮料零食': '饮料零食', '泡面饮料': '泡面饮料',
    '日用品': '日用品', '餐饮': '餐饮', '其他': '其他', '保健': '保健', '交通': '交通', '打卡': '打卡'
  };
  return map[cat] || cat;
}

// ========== 生成按钮（修复 bhl 的 canAdd） ==========
function generateButtons(id, p) {
  var isBHL = (id === 'bhl');
  var dailyLimit = p.dailyLimit || Infinity;
  var remaining = p.remaining !== undefined ? p.remaining : Infinity;
  var dailyUsed = p.dailyUsed !== undefined ? p.dailyUsed : 0;
  var userDailyUsed = p.userDailyUsed !== undefined ? p.userDailyUsed : 0;
  var perUserLimit = p.perUserDailyLimit || Infinity;
  var step = p.step || 1;

  // 修复：bhl 的 remaining 判断固定为1（按单计），不受金额影响
  function canAdd(delta, forBHL) {
    if (forBHL) {
      // bhl: remaining 只判断是否有单（>=1），daily 按金额判断
      if (remaining < 1) return false;
      if (dailyUsed + delta > dailyLimit) return false;
      if (userDailyUsed + 1 > perUserLimit) return false; // bhl 用户限制是按单
      return true;
    }
    if (remaining < delta) return false;
    if (dailyUsed + delta > dailyLimit) return false;
    if (userDailyUsed + delta > perUserLimit) return false;
    return true;
  }

  var html = '<div class="btns">';

  if (isBHL) {
    [50, 100, 200].forEach(function(amt) {
      var disabled = !canAdd(amt, true) ? 'disabled' : '';
      html += '<button onclick="window.doShop(\'' + id + '\',' + amt + ')" ' + disabled + '>¥' + amt + '</button>';
    });
    html += '<div class="custom-row">' +
      '<input type="number" id="inp_' + id + '" placeholder="金额" min="1" max="500" step="1">' +
      '<button onclick="window.doShopCustom(\'' + id + '\')" ' + (!canAdd(1, true) ? 'disabled' : '') + '>下单</button>' +
      '</div>';
  } else if (p.category === '工程') {
    var btns = [];
    if (step <= 0.1 && dailyLimit >= 0.1) btns.push(0.1);
    if (step <= 0.5 && dailyLimit >= 0.5) btns.push(0.5);
    if (step <= 1 && dailyLimit >= 1) btns.push(1);
    if (dailyLimit >= 5) btns.push(5);
    if (dailyLimit >= 10) btns.push(10);
    btns = btns.filter(function(v, i, a) { return a.indexOf(v) === i; }).sort(function(a, b) { return a - b; });
    btns.forEach(function(amt) {
      var disabled = !canAdd(amt, false) ? 'disabled' : '';
      var label = amt < 1 ? '+' + (amt * 100).toFixed(0) + '%' : '+' + amt;
      html += '<button onclick="window.doShop(\'' + id + '\',' + amt + ')" ' + disabled + '>' + label + '</button>';
    });
    html += '<div class="custom-row">' +
      '<input type="number" id="inp_' + id + '" placeholder="数值" min="' + step + '" max="' + Math.min(dailyLimit, remaining) + '" step="' + step + '">' +
      '<button onclick="window.doShopCustom(\'' + id + '\')" ' + (!canAdd(step, false) ? 'disabled' : '') + '>确定</button>' +
      '</div>';
  } else {
    var btnValues = [1, 5, 10];
    btnValues = btnValues.filter(function(v) { return v <= dailyLimit; });
    if (btnValues.length === 0) btnValues = [1];
    btnValues.forEach(function(amt) {
      var disabled = !canAdd(amt, false) ? 'disabled' : '';
      html += '<button onclick="window.doShop(\'' + id + '\',' + amt + ')" ' + disabled + '>+' + amt + '</button>';
    });
    var maxInput = Math.min(100, dailyLimit - dailyUsed, remaining);
    html += '<div class="custom-row">' +
      '<input type="number" id="inp_' + id + '" placeholder="数量" min="1" max="' + maxInput + '" step="1">' +
      '<button onclick="window.doShopCustom(\'' + id + '\')" ' + (!canAdd(1, false) ? 'disabled' : '') + '>确定</button>' +
      '</div>';
  }
  html += '</div>';
  return html;
}

// 纯色进度条
function renderProgressBar(p, barColor) {
  var remaining = p.remaining !== undefined ? p.remaining : 0;
  var total = p.totalStock || 100;
  var pct = Math.min((remaining / total) * 100, 100);
  return '<div class="progress-bar-wrap">' +
    '<div class="progress-bar-fill" style="width:' + pct.toFixed(1) + '%;background:' + barColor + '"></div>' +
    '</div>';
}

function renderShopTabs(categories, current) {
  var container = document.getElementById('shopTabs');
  if (!container) return;
  var allCats = ['全部', '楼盘', '工程', '饮料零食', '泡面饮料', '日用品', '餐饮', '其他', '保健', '交通', '打卡'];
  var html = '';
  allCats.forEach(function(cat) {
    if (cat !== '全部' && cat !== '打卡') {
      var hasItem = categories.indexOf(cat) !== -1;
      if (!hasItem) return;
    }
    var active = (cat === current) ? ' active' : '';
    html += '<button class="shop-tab' + active + '" data-cat="' + cat + '">' + getCategoryLabel(cat) + '</button>';
  });
  container.innerHTML = html;
  container.querySelectorAll('.shop-tab').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var cat = this.dataset.cat;
      document.querySelectorAll('.shop-tab').forEach(function(b) { b.classList.remove('active'); });
      this.classList.add('active');
      currentCategory = cat;
      renderShopGrid(cat);
    });
  });
}

// ========== 渲染商品网格（修复工程类文案） ==========
function renderShopGrid(category) {
  var container = document.getElementById('shopGrid');
  if (!container) return;

  if (category === '打卡') {
    container.innerHTML = renderCheckinCard();
    return;
  }

  var items = [];
  for (var id in productData) {
    var p = productData[id];
    var cat = p.category || '其他';
    if (category !== '全部' && cat !== category) continue;
    items.push({ id: id, data: p });
  }
  if (items.length === 0) {
    container.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#9ca3af;">该分类暂无商品</div>';
    return;
  }

  var html = '';
  items.forEach(function(item) {
    var p = item.data;
    var cardClass = getCardClassForProduct(item.id, p.category);
    var remaining = p.remaining !== undefined ? p.remaining : 0;
    var sold = p.sold !== undefined ? p.sold : 0;
    var dailyUsed = p.dailyUsed !== undefined ? p.dailyUsed : 0;
    var dailyLimit = p.dailyLimit || '∞';
    var userDailyUsed = p.userDailyUsed !== undefined ? p.userDailyUsed : 0;
    var userDailyLimit = p.perUserDailyLimit;
    var unit = p.unit || '个';
    var name = p.name || item.id;
    var decimals = p.decimals || 0;
    var isEngineering = (p.category === '工程');

    var colorMap = {
      'card-estate': '#1d4ed8', 'card-xifu': '#b45309', 'card-blast': '#fbbf24',
      'card-bombardier': '#065f46', 'card-dogchair': '#1e3a8a', 'card-snack': '#9d174d',
      'card-noodle': '#854d0e', 'card-daily': '#166534', 'card-food': '#991b1b',
      'card-other': '#3730a3', 'card-health': '#1e40af', 'card-traffic': '#854d0e'
    };
    var barColor = colorMap[cardClass] || '#333';

    // 格式化数字
    function fmt(n) {
      if (isEngineering) return n.toFixed(decimals);
      return n.toLocaleString('zh-CN', { maximumFractionDigits: decimals });
    }

    var remainingStr = fmt(remaining);
    var soldStr = fmt(sold);
    var dailyStr = fmt(dailyUsed);

    var progressHtml = '';
    if (isEngineering) {
      progressHtml = renderProgressBar(p, barColor);
    }

    // 工程类用不同文案
    var row1Label, row2Label;
    if (isEngineering) {
      row1Label = '当前进度';
      row2Label = '已完成';
    } else {
      row1Label = '还剩';
      row2Label = '已售';
    }

    var userDailyHtml = '';
    if (userDailyLimit !== null && userDailyLimit !== undefined) {
      userDailyHtml = ' · 个人 <span class="num">' + userDailyUsed + '</span>/' + userDailyLimit;
    }

    html += '<div class="shop-card ' + cardClass + '">' +
      '<div class="name">' + name + ' <span class="tag">' + getCategoryLabel(p.category) + '</span></div>' +
      '<div class="row-main">' + row1Label + ' <span class="num">' + remainingStr + '</span> ' + unit + '</div>' +
      '<div class="row-sub">' + row2Label + ' <span class="num">' + soldStr + '</span> ' + unit + '</div>' +
      '<div class="row-daily">今日额度使用 <span class="num">' + dailyStr + '</span>/' + dailyLimit + userDailyHtml + '</div>' +
      progressHtml +
      generateButtons(item.id, p) +
      '</div>';
  });
  container.innerHTML = html;
}

function renderCheckinCard() {
  var status = checkinData.status || 0;
  var target = checkinData.target || 1;
  var done = (status >= target);
  var doneText = done ? '<span class="done">' + status + '</span>' : '<span class="undo">' + status + '</span>';

  return '<div class="shop-card card-checkin">' +
    '<div class="name">🚻 安托山公厕</div>' +
    '<div class="stats">今日打卡 · 每人每天限 ' + target + ' 次</div>' +
    '<div class="stats">已打卡: ' + doneText + ' / <span class="undo">' + target + '</span></div>' +
    '<div class="btns">' +
    '<button id="checkinBtn" class="' + (done ? 'done-btn' : '') + '" ' + (done || isWriteLocked || isProcessing ? 'disabled' : '') + ' onclick="window.doCheckin()">' + (done ? '✅ 已打卡' : '打卡 ✅') + '</button>' +
    '</div>' +
    '<div class="sold-text">目标总量 ' + target + ' 次 · 打完收工</div>' +
    '</div>';
}

// ========== 购买操作（修复 bhl 前端校验） ==========
window.doShop = async function(id, delta) {
  if (isProcessing) { showToast('请稍候...', 1000); return; }
  if (isWriteLocked) { showToast('今日写入已锁定，请明天再试', 2500); return; }
  var p = productData[id];
  if (!p) return;

  var isBHL = (id === 'bhl');

  // 前端校验
  if (isBHL) {
    // bhl: remaining 只判断单数（>=1），daily 按金额判断
    if (p.remaining !== undefined && p.remaining < 1) {
      showToast('今日已售罄', 2000);
      return;
    }
    if (p.dailyLimit !== undefined && p.dailyUsed + delta > p.dailyLimit) {
      showToast('今日额度不足！', 2000);
      return;
    }
    if (p.perUserDailyLimit !== undefined && p.perUserDailyLimit !== null && p.userDailyUsed >= p.perUserDailyLimit) {
      showToast('今天已经下过单了！', 2000);
      return;
    }
  } else {
    if (p.remaining !== undefined && p.remaining < delta) {
      showToast('库存不足！剩余 ' + p.remaining + ' ' + p.unit, 2000);
      return;
    }
    if (p.dailyLimit !== undefined && p.dailyUsed + delta > p.dailyLimit) {
      showToast('今日额度不足！', 2000);
      return;
    }
    if (p.perUserDailyLimit !== undefined && p.perUserDailyLimit !== null && p.userDailyUsed + delta > p.perUserDailyLimit) {
      showToast('个人今日额度不足！', 2000);
      return;
    }
  }

  isProcessing = true;
  updateButtons();
  try {
    var res = await apiPost(id, delta);
    isProcessing = false;
    updateButtons();
    if (res && res.ok) {
      if (res.remaining !== undefined) p.remaining = res.remaining;
      if (res.sold !== undefined) p.sold = res.sold;
      if (res.dailyUsed !== undefined) p.dailyUsed = res.dailyUsed;
      if (res.userDailyUsed !== undefined) p.userDailyUsed = res.userDailyUsed;
      renderShopGrid(currentCategory);
      showToast('操作成功！', 1500);
      await updateStatsBar(false);
      await fetchFullData();
    } else {
      showToast('操作失败，请重试', 2000);
    }
  } catch (e) {
    isProcessing = false;
    updateButtons();
    if (e.message && !e.message.includes('额度已用完')) {
      showToast('操作异常：' + e.message, 2500);
    }
  }
};

window.doShopCustom = async function(id) {
  var inp = document.getElementById('inp_' + id);
  if (!inp) return;
  var val = parseFloat(inp.value);
  if (isNaN(val) || val <= 0) {
    showToast('请输入有效数量', 1500);
    return;
  }
  var p = productData[id];
  if (!p) return;

  var isBHL = (id === 'bhl');
  if (isBHL) {
    if (val < 1 || val > 500) {
      showToast('金额必须在 1~500 之间', 1500);
      return;
    }
  } else {
    var maxVal = Math.min(100, p.dailyLimit || 100, p.remaining || Infinity);
    if (val > maxVal) {
      showToast('最大值为 ' + maxVal, 1500);
      return;
    }
    var step = p.step || 1;
    if (val % step !== 0 && Math.abs(val % step) > 0.0001) {
      showToast('请输入 ' + step + ' 的倍数', 1500);
      return;
    }
  }

  await window.doShop(id, val);
};

window.doCheckin = async function() {
  if (isProcessing) { showToast('请稍候...', 1000); return; }
  if (isWriteLocked) { showToast('今日写入已锁定，请明天再试', 2500); return; }
  if (checkinData.status >= checkinData.target) {
    showToast('你今天已经打过卡了！', 2000);
    return;
  }
  isProcessing = true;
  updateButtons();
  try {
    var res = await apiPost('atsgs', 1);
    isProcessing = false;
    updateButtons();
    if (res && res.ok) {
      if (res.checkin) {
        checkinData = res.checkin;
      } else {
        checkinData.status = 1;
      }
      showToast('打卡成功！✅ 安托山公厕今日已打卡', 2000);
      renderShopGrid(currentCategory);
      await updateStatsBar(false);
      await fetchFullData();
    } else {
      showToast('打卡失败，请重试', 2000);
    }
  } catch (e) {
    isProcessing = false;
    updateButtons();
    if (e.message && !e.message.includes('额度已用完')) {
      showToast('操作异常：' + e.message, 2500);
    }
  }
};

async function fetchFullData() {
  try {
    var data = await apiGet();
    if (!data) return;
    if (data.products) {
      productData = data.products;
      var categories = new Set();
      for (var id in productData) {
        var p = productData[id];
        if (p.category) categories.add(p.category);
      }
      var catArray = Array.from(categories).sort();
      renderShopTabs(catArray, currentCategory);
      renderShopGrid(currentCategory);
    }
    if (data.checkin) {
      checkinData = data.checkin;
      if (currentCategory === '打卡') {
        renderShopGrid('打卡');
      }
    }
  } catch (e) {
    console.error('fetchFullData error', e);
  }
}

async function syncFromServer() {
  if (isSyncing) return;
  isSyncing = true;
  var now = Date.now();
  var minInterval = Math.min(currentPollInterval, 5000 * Math.pow(2, Math.min(syncFailCount, 6)));
  if (now - lastSync < minInterval) { isSyncing = false; return; }
  lastSync = now;
  await fetchFullData();
  isSyncing = false;
  currentPollInterval = Math.min(600000, currentPollInterval * 1.5);
  if (pollTimer) {
    clearInterval(pollTimer);
    pollTimer = setInterval(syncFromServer, currentPollInterval);
  }
}

function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  currentPollInterval = 30000;
  syncFromServer();
  pollTimer = setInterval(syncFromServer, currentPollInterval);
}
function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

document.addEventListener("visibilitychange", function() {
  if (document.hidden) {
    stopPolling();
  } else {
    syncFromServer();
    updateStatsBar(true);
    startPolling();
  }
});

window.addEventListener("pageshow", function(event) {
  if (event.persisted) {
    syncFromServer();
    updateStatsBar(true);
  }
});

function init() {
  fetchFullData();
  updateKvBar();
  startTimer();
  startKVStatsPolling();
  startPolling();
  updateButtons();
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}
})();
</script>
</body>
</html>
