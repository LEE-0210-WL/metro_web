var toastTimer = null;
function showToast(msg, duration) {
  duration = duration || 2500;
  var old = document.querySelector('.toast-msg');
  if(old) old.remove();
  if(toastTimer) clearTimeout(toastTimer);
  var div = document.createElement('div');
  div.className = 'toast-msg';
  div.textContent = msg;
  document.body.appendChild(div);
  toastTimer = setTimeout(function(){
    div.classList.add('hide');
    setTimeout(function(){ div.remove(); }, 500);
    toastTimer = null;
  }, duration);
}

// ---------- API ----------
async function apiGet(){
  try{
    var r=await fetch(API_BASE+"/api/counters", {
      headers: {
        'X-User-Id': USER_ID
      }
    });
    if(!r.ok)throw new Error("http"+r.status);
    return await r.json();
  }catch(e){console.error("sync-get",e);return null}
}
async function apiPost(id,delta){
  try{
    var r=await fetch(API_BASE+"/api/counters",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "X-User-Id": USER_ID
      },
      body:JSON.stringify({id:id,delta:delta})
    });
    if(!r.ok){
      var errText = await r.text();
      var errObj;
      try { errObj = JSON.parse(errText); } catch(e) { errObj = {error: errText}; }
      if (r.status === 429) {
        throw new Error(errObj.error || "请求过于频繁");
      }
      throw new Error(errObj.error || ("http"+r.status));
    }
    return await r.json();
  }catch(e){
    console.error("sync-post",e);
    if (e.message && e.message.includes('额度已用完')) {
      alert(e.message);
      return null;
    }
    throw e;
  }
}

// ---------- 获取 KV 统计（从 GraphQL 代理） ----------
async function fetchKVStats() {
  try {
    const res = await fetch('/api/kv-stats?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data && typeof data.writes === 'number') {
      lastValidStats = data;
      return data;
    }
    throw new Error('Invalid data');
  } catch (e) {
    console.warn('KV stats fetch failed, using cached value', e);
    return null;
  }
}

async function updateStatsBar(showLoadingToast) {
  if (showLoadingToast) {
    showToast('正在同步KV用量...', 1500);
  }
  const stats = await fetchKVStats();
  if (stats) {
    kvWritesToday = stats.writes;
    KV_WRITE_LIMIT = stats.writeLimit || 1000;
    updateKvBar();
  } else {
    // 保持旧值
  }
  updateKvBar(); // 刷新倒计时
}

// ---------- 按钮锁定 ----------
function updateButtons() {
  var btns = document.querySelectorAll('.fc-btn');
  btns.forEach(function(btn) {
    btn.disabled = isWriteLocked || isProcessing;
  });
  var lockEl = document.getElementById('kv-lock');
  if (lockEl) {
    lockEl.style.display = isWriteLocked ? 'inline' : 'none';
  }
}

// ---------- 顶部状态条 ----------
function updateKvBar(){
  var bar=document.getElementById("kv-bar");
  var inner=document.getElementById("kv-bar-inner");
  var pctEl=document.getElementById("kv-pct");
  var timerEl=document.getElementById("kv-timer");
  if(!bar||!inner||!pctEl||!timerEl)return;
  
  var pct=Math.min((kvWritesToday/KV_WRITE_LIMIT)*100,100);
  inner.style.width=pct+"%";
  pctEl.textContent=kvWritesToday.toLocaleString("zh-CN")+" / "+KV_WRITE_LIMIT+" ("+pct.toFixed(1)+"%)";
  
  bar.classList.remove("kv-warn","kv-safe");
  if(pct>=80)bar.classList.add("kv-warn");
  else if(pct<=30)bar.classList.add("kv-safe");
  
  // 锁定逻辑：达到 95% 预警锁定
  if (pct >= 95) {
    isWriteLocked = true;
  } else {
    isWriteLocked = false;
  }
  updateButtons();

  var now=new Date();
  var reset=new Date(now);
  reset.setUTCHours(0,0,0,0);
  if(now>=reset) reset.setUTCDate(reset.getUTCDate()+1);
  var diff=Math.max(0,Math.floor((reset-now)/1000));
  var h=Math.floor(diff/3600);
  var m=Math.floor((diff%3600)/60);
  var s=diff%60;
  timerEl.textContent="距重置: "+h+"时"+m+"分"+s+"秒";
}

function startTimer(){
  if(timerInterval) clearInterval(timerInterval);
  timerInterval=setInterval(updateKvBar,1000);

// ---------- 回滚 ----------
function rollbackEstate(oldR,oldS){remaining=oldR;sold=oldS;renderEstate();}
function rollbackXifu(oldR,oldS){xifuRemaining=oldR;xifuSold=oldS;renderXifu();}
function rollbackBlast(oldB){blast=oldB;renderBlast();}
function rollbackBomb(oldB){bombProgress=oldB;renderBomb();}
function rollbackDog(oldD,oldDec){dogProgress=oldD;dogDecimals=oldDec;renderDog();}

function resetPollInterval(){
  currentPollInterval=30000;
  if(pollTimer){
    clearInterval(pollTimer);
    pollTimer=setInterval(syncFromServer,currentPollInterval);
  }
}

// ---------- 操作函数 ----------
async function doEstate(n){
  if (isProcessing) { showToast('请稍候...', 1000); return; }
  if (isWriteLocked) { showToast('今日写入已锁定，请明天再试', 2500); return; }
  if(remaining < n){ alert("剩余楼盘不足！"); return; }
  
  var oldR=remaining, oldS=sold;
  remaining -= n; sold += n;
  renderEstate();
  showEgg("estate", n);
  showToast('已操作，正在同步云端...', 1500);
  resetPollInterval();
  
  isProcessing = true;
  updateButtons();
  try {
    var res = await apiPost("estate", n);
    isProcessing = false;
    updateButtons();
    if (res && res.ok) {
      remaining = res.remaining; sold = res.sold;
      renderEstate();
      await updateStatsBar(true);
      showToast('同步完成', 1000);
    } else {
      rollbackEstate(oldR, oldS);
      if (res === null) showToast('网络异常，已回滚', 2000);
    }
  } catch (e) {
    isProcessing = false;
    updateButtons();
    rollbackEstate(oldR, oldS);
    if (e.message && e.message.includes('额度已用完')) {
      // 已由 apiPost 处理
    } else {
      alert("操作异常：" + e.message);
    }
  }
}

    if (res && res.ok) {
      dogProgress = res.dogProgress; dogDecimals = res.dogDecimals || 2;
      renderDog();
      await updateStatsBar(true);
      showToast('同步完成', 1000);
    } else {
      rollbackDog(oldD, oldDec);
      if (res === null) showToast('网络异常，已回滚', 2000);
    }
  } catch (e) {
    isProcessing = false;
    updateButtons();
    rollbackDog(oldD, oldDec);
    if (e.message && e.message.includes('额度已用完')) {
      // 已由 apiPost 处理
    } else {
      alert("操作异常：" + e.message);
    }
  }
}

// ---------- 轮询 ----------
async function syncFromServer(){
  if(isSyncing)return;
  isSyncing=true;
  var now=Date.now();
  var minInterval=Math.min(currentPollInterval,5000*Math.pow(2,Math.min(syncFailCount,6)));
  if(now-lastSync<minInterval){isSyncing=false;return;}
  lastSync=now;
  var data=await apiGet();
  if(!data){syncFailCount++;isSyncing=false;return;}
  syncFailCount=0;
  
  if(data.remaining!==undefined)remaining=data.remaining;
  if(data.sold!==undefined)sold=data.sold;
  if(data.blast!==undefined)blast=data.blast;
  if(data.xifuRemaining!==undefined)xifuRemaining=data.xifuRemaining;
  if(data.xifuSold!==undefined)xifuSold=data.xifuSold;
  if(data.bombProgress!==undefined)bombProgress=data.bombProgress;
  if(data.dogProgress!==undefined)dogProgress=data.dogProgress;
  if(data.dogDecimals!==undefined)dogDecimals=data.dogDecimals;
  
  renderEstate();renderXifu();renderBlast();renderBomb();renderDog();
  isSyncing=false;
  
  currentPollInterval=Math.min(600000, currentPollInterval*1.5);
  if(pollTimer){
    clearInterval(pollTimer);
    pollTimer=setInterval(syncFromServer,currentPollInterval);
  }
}

function startPolling(){
  if(pollTimer)clearInterval(pollTimer);
  currentPollInterval=30000;
  syncFromServer();
  pollTimer=setInterval(syncFromServer,currentPollInterval);
}
function stopPolling(){
  if(pollTimer){clearInterval(pollTimer);pollTimer=null;}
}

// 双保险可见性监听
document.addEventListener("visibilitychange", function(){
  if(document.hidden) {
    stopPolling();
  } else {
    syncFromServer(); // 回到前台立即同步业务数据
    updateStatsBar(true); // 同步 KV 统计
    startPolling();
  }
});

window.addEventListener("pageshow", function(event){
  if (event.persisted) {
    syncFromServer();
    updateStatsBar(true);
  }
});
