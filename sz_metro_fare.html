// ==================== 数据预处理 ====================
class MetroData {
  constructor(data) {
    this.lines = data.lines;
    this.stations = {};
    this.transferStations = new Set();

    for (const [lineName, lineData] of Object.entries(this.lines)) {
      for (let idx = 0; idx < lineData.stations.length; idx++) {
        const station = lineData.stations[idx];
        const name = station.name;
        if (!this.stations[name]) this.stations[name] = [];

        this.stations[name].push({
          line: lineName,
          distance: station.distance,
          transfer: station.transfer,
          idx: idx
        });

        if (station.transfer.length > 0) {
          this.transferStations.add(name);
        }
      }
    }
  }

  getLineList() { return Object.keys(this.lines); }

  getStationsByLine(lineName) {
    if (this.lines[lineName]) {
      return this.lines[lineName].stations.map(s => s.name);
    }
    return [];
  }

  calculateFare(distanceKm) {
    if (distanceKm <= 0) return 0;
    if (distanceKm <= 4) return 2;
    if (distanceKm <= 12) return 2 + Math.floor((distanceKm - 1) / 4);
    if (distanceKm <= 24) return 4 + Math.floor((distanceKm - 12) / 6);
    const fare = 6 + Math.floor((distanceKm - 24) / 8);
    return Math.min(fare, 14);
  }

  findRoute(start, end) {
    if (!this.stations[start] || !this.stations[end]) {
      return { route: null, distance: 0, fare: 0, info: "站点不存在" };
    }
    if (start === end) {
      return { route: null, distance: 0, fare: 0, info: "起点和终点相同" };
    }

    const pq = new MinPriorityQueue();

    for (const info of this.stations[start]) {
      pq.enqueue({ 
        dist: 0, 
        station: start, 
        line: info.line,
        path: [{name: start, line: info.line, is_transfer: false}]
      });
    }

    const visited = new Map();
    let bestRoute = null;
    let minDistance = Infinity;

    while (!pq.isEmpty()) {
      const { dist, station, line, path } = pq.dequeue();

      if (station === end) {
        if (dist < minDistance) {
          minDistance = dist;
          bestRoute = path;
        }
        continue;
      }

      const state = station + "|" + line;
      if (visited.has(state) && visited.get(state) <= dist) continue;
      visited.set(state, dist);

      const info = this.stations[station].find(s => s.line === line);
      if (!info) continue;

      const idx = info.idx;
      const lineStations = this.lines[line].stations;

      // 沿当前线路移动
      if (idx + 1 < lineStations.length) {
        const nextSta = lineStations[idx + 1];
        const segmentDist = Math.abs(nextSta.distance - info.distance);
        const newPath = path.slice();
        newPath.push({name: nextSta.name, line: line, is_transfer: false});
        pq.enqueue({ 
          dist: dist + segmentDist, 
          station: nextSta.name, 
          line: line,
          path: newPath
        });
      }

      if (idx - 1 >= 0) {
        const prevSta = lineStations[idx - 1];
        const segmentDist = Math.abs(prevSta.distance - info.distance);
        const newPath = path.slice();
        newPath.push({name: prevSta.name, line: line, is_transfer: false});
        pq.enqueue({ 
          dist: dist + segmentDist, 
          station: prevSta.name, 
          line: line,
          path: newPath
        });
      }

      // 换乘
      for (const transferLine of info.transfer) {
        if (transferLine === line) continue;
        const targetInfo = this.stations[station].find(s => s.line === transferLine);
        if (targetInfo) {
          const newPath = path.slice();
          newPath.push({name: station, line: transferLine, is_transfer: true});
          pq.enqueue({ 
            dist: dist, 
            station: station, 
            line: transferLine,
            path: newPath
          });
        }
      }
    }

    if (!bestRoute) {
      return { route: null, distance: 0, fare: 0, info: "无法找到路径" };
    }

    const formattedRoute = [];
    let transferCount = 0;
    const linesUsed = [];
    let currentLineForDisplay = null;

    for (let i = 0; i < bestRoute.length; i++) {
      const item = bestRoute[i];

      if (item.is_transfer) transferCount++;

      if (item.line && item.line !== currentLineForDisplay) {
        if (linesUsed.length === 0) {
          linesUsed.push(item.line);
        } else {
          linesUsed.push("→" + item.line);
        }
        currentLineForDisplay = item.line;
      }

      let stationInfo = null;
      if (item.line && this.lines[item.line]) {
        stationInfo = this.stations[item.name].find(s => s.line === item.line);
      }

      formattedRoute.push({
        name: item.name,
        line: item.line,
        is_transfer: item.is_transfer,
        idx: stationInfo ? stationInfo.idx : 0
      });
    }

    const fare = this.calculateFare(minDistance);
    const transferStr = transferCount > 0 ? `换乘${transferCount}次` : "无需换乘";
    const linesStr = linesUsed.join("") || "未知";

    return {
      route: formattedRoute,
      distance: minDistance,
      fare: fare,
      info: `${transferStr} | 线路: ${linesStr}`
    };
  }
}

class MinPriorityQueue {
  constructor() { this.heap = []; }
  enqueue(item) {
    this.heap.push(item);
    this._bubbleUp(this.heap.length - 1);
  }
  dequeue() {
    if (this.heap.length === 0) return null;
    if (this.heap.length === 1) return this.heap.pop();
    const min = this.heap[0];
    this.heap[0] = this.heap.pop();
    this._bubbleDown(0);
    return min;
  }
  isEmpty() { return this.heap.length === 0; }
  _bubbleUp(index) {
    while (index > 0) {
      const parent = Math.floor((index - 1) / 2);
      if (this.heap[parent].dist <= this.heap[index].dist) break;
      [this.heap[parent], this.heap[index]] = [this.heap[index], this.heap[parent]];
      index = parent;
    }
  }
  _bubbleDown(index) {
    const len = this.heap.length;
    while (true) {
      let smallest = index;
      const left = 2 * index + 1;
      const right = 2 * index + 2;
      if (left < len && this.heap[left].dist < this.heap[smallest].dist) smallest = left;
      if (right < len && this.heap[right].dist < this.heap[smallest].dist) smallest = right;
      if (smallest === index) break;
      [this.heap[index], this.heap[smallest]] = [this.heap[smallest], this.heap[index]];
      index = smallest;
    }
  }
}

const metro = new MetroData(METRO_DATA);

function initUI() {
  const startLine = document.getElementById('startLine');
  const endLine = document.getElementById('endLine');

  metro.getLineList().forEach(line => {
    startLine.add(new Option(line, line));
    endLine.add(new Option(line, line));
  });

  startLine.addEventListener('change', () => updateStations('start'));
  endLine.addEventListener('change', () => updateStations('end'));

  updateStations('start');
  updateStations('end');
}

function updateStations(type) {
  const lineSelect = document.getElementById(type + 'Line');
  const stationSelect = document.getElementById(type + 'Station');
  const line = lineSelect.value;
  const stations = metro.getStationsByLine(line);

  stationSelect.innerHTML = '';
  stations.forEach(s => {
    stationSelect.add(new Option(s, s));
  });
}

function swapStations() {
  const startLine = document.getElementById('startLine');
  const endLine = document.getElementById('endLine');
  const startStation = document.getElementById('startStation');
  const endStation = document.getElementById('endStation');

  const tempLine = startLine.value;
  startLine.value = endLine.value;
  endLine.value = tempLine;

  updateStations('start');
  updateStations('end');

  const tempStation = startStation.value;
  startStation.value = endStation.value;
  endStation.value = tempStation;
}

function queryFare() {
  const startStation = document.getElementById('startStation').value;
  const endStation = document.getElementById('endStation').value;

  if (startStation === endStation) {
    document.getElementById('resultFare').innerHTML = '<span style="font-size:18px;color:red;">起点和终点不能相同！</span>';
    document.getElementById('resultDetail').textContent = '';
    document.getElementById('resultInfo').textContent = '';
    document.getElementById('pathText').textContent = '';
    drawEmptyMap();
    return;
  }

  const result = metro.findRoute(startStation, endStation);

  if (!result.route) {
    document.getElementById('resultFare').innerHTML = '<span style="font-size:18px;color:red;">查询失败：' + result.info + '</span>';
    document.getElementById('resultDetail').textContent = '';
    document.getElementById('resultInfo').textContent = '';
    document.getElementById('pathText').textContent = '';
    drawEmptyMap();
    return;
  }

  const stationsCount = result.route.length;

  document.getElementById('resultFare').innerHTML = result.fare + ' <span>元</span>';
  document.getElementById('resultDetail').innerHTML = `里程：${result.distance.toFixed(2)} 公里 | 共${stationsCount}站`;
  document.getElementById('resultInfo').textContent = result.info;

  const pathStr = result.route.map(s => s.name).join(' → ');
  document.getElementById('pathText').textContent = pathStr;

  drawRouteMap(result.route);
}

function drawEmptyMap() {
  const canvas = document.getElementById('mapCanvas');
  const placeholder = document.getElementById('mapPlaceholder');
  canvas.style.display = 'none';
  placeholder.style.display = 'flex';
}

function drawRouteMap(route) {
  const canvas = document.getElementById('mapCanvas');
  const placeholder = document.getElementById('mapPlaceholder');
  const container = document.getElementById('mapContainer');

  if (route.length < 2) {
    drawEmptyMap();
    return;
  }

  const hasTransfer = route.some(s => s.is_transfer);

  placeholder.style.display = 'none';
  canvas.style.display = 'block';

  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;

  if (!hasTransfer) {
    drawSingleLineHorizontal(ctx, canvas, route, dpr, container);
  } else {
    drawTransferRouteHorizontal(ctx, canvas, route, dpr, container);
  }
}

// ==================== 水平单线路（放大版） ====================
function drawSingleLineHorizontal(ctx, canvas, route, dpr, container) {
  const stationSpacing = 100;
  const circleSize = 28;
  const lineWidth = 10;
  const fontSize = 24;

  const lineName = route[0].line;
  const lineData = metro.lines[lineName];
  const color = lineData.color;

  const totalStations = route.length;
  const totalWidth = totalStations * stationSpacing + 120;
  const viewHeight = container.clientHeight;
  const centerY = Math.max(160, viewHeight / 2);
  const sceneHeight = Math.max(centerY + 100, 320);

  canvas.width = totalWidth * dpr;
  canvas.height = sceneHeight * dpr;
  canvas.style.width = totalWidth + 'px';
  canvas.style.height = sceneHeight + 'px';
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, totalWidth, sceneHeight);

  const startX = 70;
  const y = centerY;

  // 绘制线路
  ctx.strokeStyle = color;
  ctx.lineWidth = lineWidth;
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (let i = 0; i < route.length - 1; i++) {
    const x1 = startX + i * stationSpacing;
    const x2 = startX + (i + 1) * stationSpacing;
    ctx.moveTo(x1, y);
    ctx.lineTo(x2, y);
  }
  ctx.stroke();

  // 绘制站点
  for (let i = 0; i < route.length; i++) {
    const x = startX + i * stationSpacing;
    const isTransfer = route[i].is_transfer;

    ctx.beginPath();
    ctx.arc(x, y, circleSize / 2, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.strokeStyle = isTransfer ? '#FF6600' : color;
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.font = (isTransfer ? 'bold ' : '') + fontSize + 'px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = '#333';
    ctx.textAlign = 'center';
    const textY = i % 2 === 0 ? y - 28 : y + 40;
    ctx.fillText(route[i].name, x, textY);
  }

  // 线路标签
  ctx.font = 'bold 15px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = color;
  ctx.textAlign = 'left';
  ctx.fillText(lineName, startX, y - 70);
}

// ==================== 水平换乘路线（放大+对齐修复） ====================
function drawTransferRouteHorizontal(ctx, canvas, route, dpr, container) {
  // 将路径分成段
  const segments = [];
  let currentLine = null;
  let currentSegment = [];

  for (let i = 0; i < route.length; i++) {
    const station = route[i];
    if (station.line !== currentLine) {
      if (currentSegment.length > 0) {
        segments.push([currentLine, currentSegment]);
      }
      currentLine = station.line;
      currentSegment = [station];
    } else {
      currentSegment.push(station);
    }
  }
  if (currentSegment.length > 0) {
    segments.push([currentLine, currentSegment]);
  }

  if (segments.length === 2) {
    drawTwoSegmentHorizontal(ctx, canvas, segments, dpr, container);
  } else {
    drawMultiSegmentHorizontal(ctx, canvas, segments, dpr, container);
  }
}

function drawTwoSegmentHorizontal(ctx, canvas, segments, dpr, container) {
  const stationSpacing = 100;
  const circleSize = 28;
  const lineWidth = 10;
  const fontSize = 20;

  const [line1Name, stations1] = segments[0];
  const [line2Name, stations2] = segments[1];

  if (!metro.lines[line1Name] || !metro.lines[line2Name]) {
    drawEmptyMap();
    return;
  }

  const color1 = metro.lines[line1Name].color;
  const color2 = metro.lines[line2Name].color;

  // 换乘站是 stations1 的最后一个站和 stations2 的第一个站
  const transferStation = stations1[stations1.length - 1].name;

  // 计算两段各自的宽度（从换乘站向两边）
  const seg1LeftWidth = (stations1.length - 1) * stationSpacing;
  const seg2RightWidth = (stations2.length - 1) * stationSpacing;

  // 总宽度 = 左边距 + 第一段左宽 + 间距 + 第二段右宽 + 右边距
  const margin = 80;
  const gapBetween = 0; // 换乘站是同一个点，不需要额外间距
  const totalWidth = margin + seg1LeftWidth + gapBetween + seg2RightWidth + margin;

  const viewHeight = container.clientHeight;
  const topY = 110;
  const bottomY = Math.max(300, topY + 160);
  const sceneHeight = Math.max(bottomY + 100, viewHeight - 20, 420);

  canvas.width = totalWidth * dpr;
  canvas.height = sceneHeight * dpr;
  canvas.style.width = totalWidth + 'px';
  canvas.style.height = sceneHeight + 'px';
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, totalWidth, sceneHeight);

  // 换乘站X坐标
  const transferX = margin + seg1LeftWidth;

  // 第一段起点X
  const seg1StartX = transferX - (stations1.length - 1) * stationSpacing;

  // 第二段起点X（换乘站就是起点）
  const seg2StartX = transferX;

  // ========== 绘制第一段（上方水平） ==========
  ctx.strokeStyle = color1;
  ctx.lineWidth = lineWidth;
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (let i = 0; i < stations1.length - 1; i++) {
    const x1 = seg1StartX + i * stationSpacing;
    const x2 = seg1StartX + (i + 1) * stationSpacing;
    ctx.moveTo(x1, topY);
    ctx.lineTo(x2, topY);
  }
  ctx.stroke();

  for (let i = 0; i < stations1.length; i++) {
    const x = seg1StartX + i * stationSpacing;
    const isTransfer = (i === stations1.length - 1); // 最后一个是换乘站
    const nameOnTop = (i % 2 === 0);
    drawStationHorizontal(ctx, x, topY, stations1[i].name, color1, fontSize, circleSize, isTransfer, nameOnTop);
  }

  // ========== 绘制第二段（下方水平） ==========
  ctx.strokeStyle = color2;
  ctx.lineWidth = lineWidth;
  ctx.beginPath();
  for (let i = 0; i < stations2.length - 1; i++) {
    const x1 = seg2StartX + i * stationSpacing;
    const x2 = seg2StartX + (i + 1) * stationSpacing;
    ctx.moveTo(x1, bottomY);
    ctx.lineTo(x2, bottomY);
  }
  ctx.stroke();

  for (let i = 0; i < stations2.length; i++) {
    const x = seg2StartX + i * stationSpacing;
    const isTransfer = (i === 0); // 第一个是换乘站
    const nameOnTop = (i % 2 === 1);
    drawStationHorizontal(ctx, x, bottomY, stations2[i].name, color2, fontSize, circleSize, isTransfer, nameOnTop);
  }

  // ========== 换乘连接线（垂直虚线，避开文字） ==========
  // 虚线画在圆点之间，不要穿过文字区域
  const lineTop = topY + circleSize/2 + 5;
  const lineBottom = bottomY - circleSize/2 - 5;

  ctx.strokeStyle = '#888';
  ctx.lineWidth = 3;
  ctx.setLineDash([10, 8]);
  ctx.beginPath();
  ctx.moveTo(transferX, lineTop);
  ctx.lineTo(transferX, lineBottom);
  ctx.stroke();
  ctx.setLineDash([]);

  // 换乘文字（放在虚线右侧，不挡站名）
  ctx.font = 'bold 22px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = '#666';
  ctx.textAlign = 'left';
  ctx.fillText('换乘', transferX + 12, (lineTop + lineBottom) / 2 + 4);

  // ========== 线路标签 ==========
  ctx.font = 'bold 20px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = color1;
  ctx.textAlign = 'left';
  ctx.fillText(line1Name, seg1StartX, topY - 60);

  ctx.fillStyle = color2;
  ctx.fillText(line2Name, seg2StartX, bottomY + 60);
}

function drawMultiSegmentHorizontal(ctx, canvas, segments, dpr, container) {
  const stationSpacing = 100;
  const circleSize = 28;
  const lineWidth = 10;
  const fontSize = 24;

  let totalWidth = 100;
  for (const [, stations] of segments) {
    totalWidth += (stations.length - 1) * stationSpacing + 50;
  }
  totalWidth += 100;

  const viewHeight = container.clientHeight;
  const sceneHeight = Math.max(380, viewHeight - 20);
  const centerY = sceneHeight / 2;

  canvas.width = totalWidth * dpr;
  canvas.height = sceneHeight * dpr;
  canvas.style.width = totalWidth + 'px';
  canvas.style.height = sceneHeight + 'px';
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, totalWidth, sceneHeight);

  let currentX = 80;

  for (let segIdx = 0; segIdx < segments.length; segIdx++) {
    const [lineName, stations] = segments[segIdx];
    if (!metro.lines[lineName]) continue;

    const color = metro.lines[lineName].color;
    const y = centerY + (segIdx % 2 === 0 ? -40 : 40);

    ctx.strokeStyle = color;
    ctx.lineWidth = lineWidth;
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (let i = 0; i < stations.length - 1; i++) {
      const x1 = currentX + i * stationSpacing;
      const x2 = currentX + (i + 1) * stationSpacing;
      ctx.moveTo(x1, y);
      ctx.lineTo(x2, y);
    }
    ctx.stroke();

    for (let i = 0; i < stations.length; i++) {
      const x = currentX + i * stationSpacing;
      const isTransfer = stations[i].is_transfer;
      drawStationHorizontal(ctx, x, y, stations[i].name, color, fontSize, circleSize, isTransfer, true);
    }

    if (segIdx < segments.length - 1) {
      const nextY = centerY + ((segIdx + 1) % 2 === 0 ? -40 : 40);
      const endX = currentX + (stations.length - 1) * stationSpacing;

      ctx.strokeStyle = '#888';
      ctx.lineWidth = 3;
      ctx.setLineDash([8, 5]);
      ctx.beginPath();
      ctx.moveTo(endX, y);
      ctx.lineTo(endX + 35, y);
      ctx.lineTo(endX + 35, nextY);
      ctx.lineTo(endX + 50, nextY);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.font = 'bold 24px "Microsoft YaHei", sans-serif';
      ctx.fillStyle = '#FF6600';
      ctx.fillText('换', endX + 18, (y + nextY) / 2 + 4);

      currentX += (stations.length - 1) * stationSpacing + 50;
    } else {
      currentX += (stations.length - 1) * stationSpacing;
    }
  }
}

function drawStationHorizontal(ctx, x, y, name, color, fontSize, circleSize, isTransfer, nameOnTop) {
  ctx.beginPath();
  ctx.arc(x, y, circleSize / 2, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.strokeStyle = isTransfer ? '#FF6600' : color;
  ctx.lineWidth = isTransfer ? 5 : 4; // 换乘站边框更粗
  ctx.stroke();

  ctx.font = (isTransfer ? 'bold ' : '') + fontSize + 'px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = isTransfer ? '#FF6600' : '#333'; // 换乘站名字也变色
  ctx.textAlign = 'center';
  const textY = nameOnTop ? y - 28 : y + 40;
  ctx.fillText(name, x, textY);
}

document.addEventListener('DOMContentLoaded', initUI);
