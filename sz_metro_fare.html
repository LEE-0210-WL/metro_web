// ========== 全局变量 ==========
let metroGraphRaw = null;
let metro = null;
let normalFareMap = null;
let businessFareMap = null;
let ready = false;

// ========== 工具函数 ==========
/** 判断路径是否经过11号线 */
function routeContainsLine11(route){
  const l11 = ALL_LINES_ENHANCED.find(x=>x.id==="11");
  if(!l11) return false;
  const s = new Set(l11.stationList);
  return route.some(it=>s.has(it.name));
}

/** 普通车厢 官方OD */
function getNormalOdFare(fromStation, toStation){
  if(fromStation === toStation) return 2;
  return normalFareMap?.[fromStation]?.[toStation] ?? null;
}
/** 商务车厢 官方OD */
function getBusinessOdFare(fromStation, toStation){
  if(fromStation === toStation) return null;
  return businessFareMap?.[fromStation]?.[toStation] ?? null;
}
/** 里程 -> 普通票价（前端算法，用于比对） */
function calcFareByDistance(distanceKm){
  if(distanceKm <= 0) return 2;
  if(distanceKm <=4) return 2;
  if(distanceKm <=12) return 2 + Math.floor((distanceKm -1)/4);
  if(distanceKm <=24) return 4 + Math.floor((distanceKm -12)/6);
  const fare = 6 + Math.floor((distanceKm -24)/8);
  return Math.min(fare,14);
}

// ========== 寻路参数（可自行微调） ==========
// 旅行速度：含起停的实际旅行速度（不是设计时速）。快线明显更快，这是"时间优先"能生效的关键
const LINE_SPEED_KMH = {
  "11号线": 60,   // 机场快线
  "14号线": 55,   // 东部快线
  "20号线": 55,
  "6号线": 45, "6号线支线": 45,
  "13号线": 45, "16号线": 45
};
const DEFAULT_SPEED_KMH = 35;   // 其余普通线路
const STOP_MINUTES = 0.5;       // 每经过一站的停站 + 起停附加时间
const TRANSFER_MINUTES = 3;     // 默认换乘步行时间
// 长通道枢纽，换乘步行更久（可按实际调整/扩充）
const TRANSFER_MINUTES_HUB = {
  "岗厦北": 5, "福田": 5, "深圳北站": 5, "前海湾": 4.5,
  "车公庙": 4, "世界之窗": 4, "布吉": 4, "大运": 3.5
};

// ========== 从metro_graph_from_template.json构建MetroData寻路实例 ==========
class MetroData {
  constructor(graphRaw){
    this.linesRaw = graphRaw.lines;
    this.stations = {};
    this.transferStations = new Set();
    this.lines = {};
    this.lineSpeed = {};
    for(const [lineKey,lineObj] of Object.entries(this.linesRaw)){
      const stList = lineObj.stations;
      const outStations = [];
      let accDist = 0;
      for(let i=0;i<stList.length;i++){
        const s = stList[i];
        if(i>0){
          accDist += stList[i].segment_km;
        }
        outStations.push({
          name:s.name,
          distance:accDist,
          transfer:s.transfer
        });
        if(!this.stations[s.name]) this.stations[s.name]=[];
        this.stations[s.name].push({
          line:lineKey,
          distance:accDist,
          transfer:s.transfer,
          idx:i
        });
        if(s.transfer.length>0) this.transferStations.add(s.name);
      }
      this.lines[lineKey] = { stations:outStations };
      // 线路旅行速度：优先用 JSON 里的 speed_kmh（由模板脚本写入），否则用内置表，再兜底默认值
      this.lineSpeed[lineKey] = lineObj.speed_kmh || LINE_SPEED_KMH[lineKey] || DEFAULT_SPEED_KMH;
    }
  }
  getLineList(){ return Object.keys(this.lines); }
  getStationsByLine(lineName){
    if(!this.lines[lineName]) return [];
    return this.lines[lineName].stations.map(s=>s.name);
  }
  // strategy: 'time'(默认·时间优先) | 'distance'(最短距离) | 'transfer'(最少换乘)
  findRoute(start, end, strategy){
    strategy = strategy || 'time';
    if(!this.stations[start]||!this.stations[end]){
      return {route:null,distance:0,minutes:0,info:"站点不存在"};
    }
    if(start===end){
      return {route:null,distance:0,minutes:0,info:"起点终点相同"};
    }
    const speedOf = (line)=> this.lineSpeed[line] || DEFAULT_SPEED_KMH;
    // 乘坐一站的代价
    const rideCost = (segKm,line)=>{
      if(strategy==='distance') return segKm;                 // 纯公里
      if(strategy==='transfer') return segKm*0.0001;          // 里程只作极小权重，优先比换乘次数
      return (segKm/speedOf(line))*60 + STOP_MINUTES;         // 时间优先：里程/速度 + 停站
    };
    // 换乘的代价
    const transferCost = (station)=>{
      if(strategy==='distance') return 0;                     // 旧逻辑：换乘免费
      if(strategy==='transfer') return 1;
      return TRANSFER_MINUTES_HUB[station] ?? TRANSFER_MINUTES;
    };

    const pq = new MinPriorityQueue();
    for(const info of this.stations[start]){
      pq.enqueue({cost:0,km:0,station:start,line:info.line,path:[{name:start,line:info.line,is_transfer:false}]});
    }
    const visited = new Map();
    let bestRoute=null, bestCost=Infinity;
    while(!pq.isEmpty()){
      const cur = pq.dequeue();
      if(cur.station===end){
        if(cur.cost < bestCost - 1e-9){ bestCost=cur.cost; bestRoute=cur.path; }
        continue;
      }
      const stateKey = cur.station+"|"+cur.line;
      if(visited.has(stateKey)&&visited.get(stateKey)<=cur.cost) continue;
      visited.set(stateKey,cur.cost);
      const info = this.stations[cur.station].find(s=>s.line===cur.line);
      if(!info) continue;
      const idx = info.idx;
      const lineSt = this.lines[cur.line].stations;
      const push = (ni)=>{
        const seg = Math.abs(lineSt[ni].distance - info.distance);
        pq.enqueue({
          cost: cur.cost + rideCost(seg, cur.line),
          km: cur.km + seg,
          station: lineSt[ni].name, line: cur.line,
          path: [...cur.path,{name:lineSt[ni].name,line:cur.line,is_transfer:false}]
        });
      };
      if(idx+1 < lineSt.length) push(idx+1);
      if(idx-1 >= 0) push(idx-1);
      for(const trLine of info.transfer){
        const trInfo = this.stations[cur.station].find(s=>s.line===trLine);
        if(!trInfo) continue;
        pq.enqueue({
          cost: cur.cost + transferCost(cur.station),
          km: cur.km,
          station: cur.station, line: trLine,
          path: [...cur.path,{name:cur.station,line:trLine,is_transfer:true}]
        });
      }
    }
    if(!bestRoute){
      return {route:null,distance:0,minutes:0,info:"找不到路径"};
    }

    // 沿最终路径重算真实里程与耗时（不受策略影响，始终按时间模型算）
    let minutes=0, km=0, transferCount=0;
    const linesUsed=[];
    let curLine=null;
    for(let i=0;i<bestRoute.length;i++){
      const item = bestRoute[i];
      if(item.is_transfer){
        transferCount++;
        minutes += (TRANSFER_MINUTES_HUB[item.name] ?? TRANSFER_MINUTES);
      }else if(i>0){
        const prev = bestRoute[i-1];
        const a = this.stations[prev.name].find(s=>s.line===item.line);
        const b = this.stations[item.name].find(s=>s.line===item.line);
        if(a&&b){
          const seg = Math.abs(b.distance - a.distance);
          km += seg;
          minutes += (seg/speedOf(item.line))*60 + STOP_MINUTES;
        }
      }
      if(item.line && item.line!==curLine){ linesUsed.push(item.line); curLine=item.line; }
    }
    const transferStr = transferCount>0?`换乘${transferCount}次`:"无需换乘";
    return {
      route:bestRoute,
      distance:km,
      minutes:minutes,
      info:`${transferStr}｜约 ${Math.round(minutes)} 分钟｜线路：${linesUsed.join(" → ")}`
    };
  }
}
class MinPriorityQueue {
  constructor(){this.heap=[];}
  enqueue(item){
    this.heap.push(item);
    this._bubbleUp(this.heap.length-1);
  }
  dequeue(){
    if(this.heap.length===0) return null;
    if(this.heap.length===1) return this.heap.pop();
    const min = this.heap[0];
    this.heap[0]=this.heap.pop();
    this._bubbleDown(0);
    return min;
  }
  isEmpty(){return this.heap.length===0;}
  _bubbleUp(idx){
    while(idx>0){
      const p = Math.floor((idx-1)/2);
      if(this.heap[p].dist <= this.heap[idx].dist) break;
      [this.heap[p],this.heap[idx]] = [this.heap[idx],this.heap[p]];
      idx=p;
    }
  }
  _bubbleDown(idx){
    const len=this.heap.length;
    while(true){
      let small=idx;
      const l=idx*2+1;
      const r=idx*2+2;
      if(l<len && this.heap[l].dist < this.heap[small].dist) small=l;
      if(r<len && this.heap[r].dist < this.heap[small].dist) small=r;
      if(small===idx) break;
      [this.heap[idx],this.heap[small]] = [this.heap[small],this.heap[idx]];
      idx=small;
    }
  }
}

// ========== UI 初始化与加载全部资源 ==========
async function loadAllAssets(){
  const tip = document.getElementById("loadTip");
  try{
    tip.textContent = "正在加载地铁拓扑图…";
    const resGraph = await fetch("./metro_graph_from_template.json");
    metroGraphRaw = await resGraph.json();

    tip.textContent = "加载普通车厢OD票价…";
    const resNorm = await fetch("./normal_fare_map.json");
    normalFareMap = await resNorm.json();

    tip.textContent = "加载商务车厢OD票价…";
    const resBiz = await fetch("./business_fare_map.json");
    businessFareMap = await resBiz.json();

    tip.textContent = "初始化寻路引擎…";
    metro = new MetroData(metroGraphRaw);
    ready = true;
    tip.style.display = "none";
    initUI();
  }catch(err){
    tip.textContent = "资源加载失败："+err.message+"；请确认json文件放在同目录，使用http服务打开";
    console.error(err);
  }
}

function initUI(){
  const sl = document.getElementById('startLine');
  const el = document.getElementById('endLine');
  const lineList = metro.getLineList();
  sl.innerHTML=""; el.innerHTML="";
  lineList.forEach(ln=>{
    sl.add(new Option(ln,ln));
    el.add(new Option(ln,ln));
  });
  sl.addEventListener('change',()=>updateStations('start'));
  el.addEventListener('change',()=>updateStations('end'));
  updateStations('start');
  updateStations('end');
}
function updateStations(type){
  const lineSel = document.getElementById(type+'Line');
  const staSel = document.getElementById(type+'Station');
  const ln = lineSel.value;
  const stas = metro.getStationsByLine(ln);
  staSel.innerHTML="";
  stas.forEach(s=>staSel.add(new Option(s,s)));
}
function swapStations(){
  if(!ready) return;
  const sl = document.getElementById('startLine');
  const el = document.getElementById('endLine');
  const ss = document.getElementById('startStation');
  const es = document.getElementById('endStation');
  const tl = sl.value; sl.value = el.value; el.value = tl;
  updateStations('start'); updateStations('end');
  const ts = ss.value; ss.value = es.value; es.value = ts;
}

// ========== 查询主逻辑 ==========
function queryFare(){
  if(!ready){
    alert("数据尚未加载完成，请稍等");
    return;
  }
  const startSta = document.getElementById('startStation').value.trim();
  const endSta = document.getElementById('endStation').value.trim();
  const resFare = document.getElementById('resultFare');
  const resDetail = document.getElementById('resultDetail');
  const resInfo = document.getElementById('resultInfo');
  const pathText = document.getElementById('pathText');

  if(startSta === endSta){
    resFare.innerHTML = "<span style='color:red'>起终点不能相同</span>";
    resDetail.textContent = "同站进出闸机收取最低普通票价：2元";
    resInfo.textContent = "";
    pathText.textContent = "";
    drawEmptyMap();
    return;
  }

  const strategyEl = document.getElementById('routeStrategy');
  const strategy = strategyEl ? strategyEl.value : 'time';
  const routeResult = metro.findRoute(startSta, endSta, strategy);
  if(!routeResult.route){
    resFare.innerHTML = `<span style='color:red'>路径查询失败：${routeResult.info}</span>`;
    resDetail.textContent = "";
    resInfo.textContent = "";
    pathText.textContent = "";
    drawEmptyMap();
    return;
  }

  const odNormal = getNormalOdFare(startSta, endSta);
  const calcNormal = calcFareByDistance(routeResult.distance);
  const pass11 = routeContainsLine11(routeResult.route);
  const odBusiness = pass11 ? getBusinessOdFare(startSta, endSta) : null;

  resFare.innerHTML = `普通车厢｜OD官方：${odNormal??"无OD数据"}元 | 算法计算：${calcNormal}元`;
  resDetail.innerHTML = `里程：${routeResult.distance.toFixed(2)} km｜${routeResult.info}`;

  let infoLines = [];
  if(pass11){
    infoLines.push(`商务车厢｜OD官方：${odBusiness??"无商务OD数据"}元`);
  }else{
    infoLines.push("本行程不经过11号线，不支持商务车厢");
  }
  resInfo.textContent = infoLines.join("\n");

  pathText.textContent = routeResult.route.map(x=>x.name).join(" → ");
  drawRouteMap(routeResult.route);
}

// ========== 绘图（修复：从metroGraphRaw读取线路color，不再硬编码灰色） ==========
function drawEmptyMap() {
  const canvas = document.getElementById('mapCanvas');
  const placeholder = document.getElementById('mapPlaceholder');
  canvas.style.display = 'none';
  placeholder.style.display = 'flex';
}
function drawRouteMap(route) {
  const canvas = document.getElementById('mapCanvas');
  const placeholder = document.getElementById('mapPlaceholder');
  const container = document.getElementById('mapContainer');
  if (route.length < 2) { drawEmptyMap(); return; }
  const hasTransfer = route.some(s => s.is_transfer);
  placeholder.style.display = 'none';
  canvas.style.display = 'block';
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  if (!hasTransfer) {
    drawSingleLineHorizontal(ctx, canvas, route, dpr, container);
  } else {
    drawTransferRouteHorizontal(ctx, canvas, route, dpr, container);
  }
}

function drawSingleLineHorizontal(ctx, canvas, route, dpr, container) {
  const stationSpacing = 100;
  const circleSize = 28;
  const lineWidth = 10;
  const fontSize = 24;
  const lineName = route[0].line;
  // 【修复】取JSON内真实颜色，兜底#666
  const lineObj = metroGraphRaw.lines[lineName];
  const color = lineObj?.color ?? "#666666";

  const totalStations = route.length;
  const totalWidth = totalStations * stationSpacing + 120;
  const viewHeight = container.clientHeight;
  const centerY = Math.max(160, viewHeight / 2);
  const sceneHeight = Math.max(centerY + 100, 320);
  canvas.width = totalWidth * dpr;
  canvas.height = sceneHeight * dpr;
  canvas.style.width = totalWidth + 'px';
  canvas.style.height = sceneHeight + 'px';
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, totalWidth, sceneHeight);
  const startX = 70;
  const y = centerY;
  ctx.strokeStyle = color;
  ctx.lineWidth = lineWidth;
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (let i = 0; i < route.length - 1; i++) {
    const x1 = startX + i * stationSpacing;
    const x2 = startX + (i + 1) * stationSpacing;
    ctx.moveTo(x1, y);
    ctx.lineTo(x2, y);
  }
  ctx.stroke();
  for (let i = 0; i < route.length; i++) {
    const x = startX + i * stationSpacing;
    const isTransfer = route[i].is_transfer;
    drawStationHorizontal(ctx, x, y, route[i].name, color, fontSize, circleSize, isTransfer, i % 2 === 0);
  }
  ctx.font = 'bold 15px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = color;
  ctx.textAlign = 'left';
  ctx.fillText(lineName, startX, y - 70);
}

function drawTransferRouteHorizontal(ctx, canvas, route, dpr, container) {
  const segments = [];
  let currentLine = null;
  let currentSegment = [];
  for (let i = 0; i < route.length; i++) {
    const station = route[i];
    if (station.line !== currentLine) {
      if (currentSegment.length > 0) segments.push([currentLine, currentSegment]);
      currentLine = station.line;
      currentSegment = [station];
    } else {
      currentSegment.push(station);
    }
  }
  if (currentSegment.length > 0) segments.push([currentLine, currentSegment]);
  if (segments.length === 2) {
    drawTwoSegmentHorizontal(ctx, canvas, segments, dpr, container);
  } else {
    drawMultiSegmentHorizontal(ctx, canvas, segments, dpr, container);
  }
}

function drawTwoSegmentHorizontal(ctx, canvas, segments, dpr, container) {
  const stationSpacing = 100;
  const circleSize = 28;
  const lineWidth = 10;
  const fontSize = 20;
  const [line1Name, stations1] = segments[0];
  const [line2Name, stations2] = segments[1];
  // 【修复】读取两条线路真实颜色
  const obj1 = metroGraphRaw.lines[line1Name];
  const obj2 = metroGraphRaw.lines[line2Name];
  const color1 = obj1?.color ?? "#666666";
  const color2 = obj2?.color ?? "#666666";

  const seg1LeftWidth = (stations1.length - 1) * stationSpacing;
  const seg2RightWidth = (stations2.length - 1) * stationSpacing;
  const margin = 80;
  const totalWidth = margin + seg1LeftWidth + seg2RightWidth + margin;
  const viewHeight = container.clientHeight;
  const topY = 110;
  const bottomY = Math.max(300, topY + 160);
  const sceneHeight = Math.max(bottomY + 100, viewHeight - 20, 420);
  canvas.width = totalWidth * dpr;
  canvas.height = sceneHeight * dpr;
  canvas.style.width = totalWidth + 'px';
  canvas.style.height = sceneHeight + 'px';
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, totalWidth, sceneHeight);
  const transferX = margin + seg1LeftWidth;
  const seg1StartX = transferX - (stations1.length - 1) * stationSpacing;
  const seg2StartX = transferX;

  ctx.strokeStyle = color1;
  ctx.lineWidth = lineWidth;
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (let i = 0; i < stations1.length - 1; i++) {
    const x1 = seg1StartX + i * stationSpacing;
    const x2 = seg1StartX + (i + 1) * stationSpacing;
    ctx.moveTo(x1, topY);
    ctx.lineTo(x2, topY);
  }
  ctx.stroke();
  for (let i = 0; i < stations1.length; i++) {
    const x = seg1StartX + i * stationSpacing;
    const isTransfer = (i === stations1.length - 1);
    drawStationHorizontal(ctx, x, topY, stations1[i].name, color1, fontSize, circleSize, isTransfer, i % 2 === 0);
  }

  ctx.strokeStyle = color2;
  ctx.lineWidth = lineWidth;
  ctx.beginPath();
  for (let i = 0; i < stations2.length - 1; i++) {
    const x1 = seg2StartX + i * stationSpacing;
    const x2 = seg2StartX + (i + 1) * stationSpacing;
    ctx.moveTo(x1, bottomY);
    ctx.lineTo(x2, bottomY);
  }
  ctx.stroke();
  for (let i = 0; i < stations2.length; i++) {
    const x = seg2StartX + i * stationSpacing;
    const isTransfer = (i === 0);
    drawStationHorizontal(ctx, x, bottomY, stations2[i].name, color2, fontSize, circleSize, isTransfer, i % 2 === 1);
  }

  const lineTop = topY + circleSize/2 + 5;
  const lineBottom = bottomY - circleSize/2 - 5;
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 3;
  ctx.setLineDash([10, 8]);
  ctx.beginPath();
  ctx.moveTo(transferX, lineTop);
  ctx.lineTo(transferX, lineBottom);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.font = 'bold 22px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = '#666';
  ctx.textAlign = 'left';
  ctx.fillText('换乘', transferX + 12, (lineTop + lineBottom) / 2 + 4);

  ctx.font = 'bold 20px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = color1;
  ctx.textAlign = 'left';
  ctx.fillText(line1Name, seg1StartX, topY - 60);
  ctx.fillStyle = color2;
  ctx.fillText(line2Name, seg2StartX, bottomY + 60);
}

function drawMultiSegmentHorizontal(ctx, canvas, segments, dpr, container) {
  const stationSpacing = 100;
  const circleSize = 28;
  const lineWidth = 10;
  const fontSize = 24;
  let totalWidth = 100;
  for (const [, stations] of segments) {
    totalWidth += (stations.length - 1) * stationSpacing + 50;
  }
  totalWidth += 100;
  const viewHeight = container.clientHeight;
  const sceneHeight = Math.max(380, viewHeight - 20);
  const centerY = sceneHeight / 2;
  canvas.width = totalWidth * dpr;
  canvas.height = sceneHeight * dpr;
  canvas.style.width = totalWidth + 'px';
  canvas.style.height = sceneHeight + 'px';
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, totalWidth, sceneHeight);
  let currentX = 80;

  for (let segIdx = 0; segIdx < segments.length; segIdx++) {
    const [lineName, stations] = segments[segIdx];
    const objLine = metroGraphRaw.lines[lineName];
    const color = objLine?.color ?? "#666666";
    const y = centerY + (segIdx % 2 === 0 ? -40 : 40);

    ctx.strokeStyle = color;
    ctx.lineWidth = lineWidth;
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (let i = 0; i < stations.length - 1; i++) {
      const x1 = currentX + i * stationSpacing;
      const x2 = currentX + (i + 1) * stationSpacing;
      ctx.moveTo(x1, y);
      ctx.lineTo(x2, y);
    }
    ctx.stroke();

    for (let i = 0; i < stations.length; i++) {
      const x = currentX + i * stationSpacing;
      const isTransfer = stations[i].is_transfer;
      drawStationHorizontal(ctx, x, y, stations[i].name, color, fontSize, circleSize, isTransfer, true);
    }

    if (segIdx < segments.length - 1) {
      const nextSeg = segments[segIdx+1];
      const nextLineName = nextSeg[0];
      const nextObj = metroGraphRaw.lines[nextLineName];
      const nextY = centerY + ((segIdx + 1) % 2 === 0 ? -40 : 40);
      const endX = currentX + (stations.length - 1) * stationSpacing;

      ctx.strokeStyle = '#888';
      ctx.lineWidth = 3;
      ctx.setLineDash([8, 5]);
      ctx.beginPath();
      ctx.moveTo(endX, y);
      ctx.lineTo(endX + 35, y);
      ctx.lineTo(endX + 35, nextY);
      ctx.lineTo(endX + 50, nextY);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.font = 'bold 24px "Microsoft YaHei", sans-serif';
      ctx.fillStyle = '#FF6600';
      ctx.fillText('换', endX + 18, (y + nextY) / 2 + 4);
      currentX += (stations.length - 1) * stationSpacing + 50;
    } else {
      currentX += (stations.length - 1) * stationSpacing;
    }
  }
}

function drawStationHorizontal(ctx, x, y, name, color, fontSize, circleSize, isTransfer, nameOnTop) {
  ctx.beginPath();
  ctx.arc(x, y, circleSize / 2, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.strokeStyle = isTransfer ? '#FF6600' : color;
  ctx.lineWidth = isTransfer ? 5 : 4;
  ctx.stroke();
  ctx.font = (isTransfer ? 'bold ' : '') + fontSize + 'px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = isTransfer ? '#FF6600' : '#333';
  ctx.textAlign = 'center';
  const textY = nameOnTop ? y - 28 : y + 40;
  ctx.fillText(name, x, textY);
}

document.addEventListener('DOMContentLoaded',loadAllAssets);
