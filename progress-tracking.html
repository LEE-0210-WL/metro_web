<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="theme.css">
  <title>五期线路跟踪 - 走进新天地·Railway</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font);
      background-color: #f5f5f5;
      color: #333;
      line-height: 1.6;
    }

    /* 顶部导航栏 */

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .site-name {
      font-size: 16px;
      font-weight: 600;
      color: white;
    }

    .current-time {
      font-size: 14px;
      color: #ffffff;
      font-weight: 500;
    }/* 主内容区域 */
    .container {
      min-height: calc(100vh - 120px);
    }

        .page-title {  font-size: 28px;
  font-weight: 700;
  color: #111827;
  margin-bottom: 8px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;}
    .page-header-row     .page-title {
      font-size: 28px; font-weight: 700; color: #111827;
      margin-bottom: 8px;
      display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
    }
    .page-subtitle {
      font-size: 16px;
      color: #6b7280;
      line-height: 1.7;
      margin: 0 0 24px;
    }

    /* ====== 筛选栏 ====== */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .filter-label {
      font-size: 14px;
      color: #6b7280;
      font-weight: 500;
    }

    /* ====== 自定义下拉（同 flow 页面） ====== */
    .custom-select {
      position: relative;
      min-width: 140px;
      user-select: none;
    }
    .custom-select-trigger {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      border-radius: var(--r-md);
      border: 1px solid #d1d5db;
      background: white;
      color: #374151;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      gap: 8px;
      min-height: 40px;
    }
    .custom-select-trigger:hover {
      border-color: #9ca3af;
      background: #f9fafb;
    }
    .custom-select-trigger.open {
      border-color: #111827;
      box-shadow: 0 0 0 3px rgba(17, 24, 39, 0.08);
    }
    .custom-select-value {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .custom-select-arrow {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      transition: transform 0.25s ease;
      color: #6b7280;
    }
    .custom-select-trigger.open .custom-select-arrow {
      transform: rotate(180deg);
    }

    .custom-select-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: white;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transform: translateY(-8px);
      transition: max-height 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94),
          opacity 0.25s ease,
          transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      z-index: 1000;
      pointer-events: none;
    }
    .custom-select-dropdown.open {
      max-height: 220px;
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
      overflow-y: auto;
    }

    .custom-select-dropdown::-webkit-scrollbar {
      width: 6px;
    }
    .custom-select-dropdown::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 10px;
    }
    .custom-select-dropdown::-webkit-scrollbar-thumb {
      background: #c1c7cd;
      border-radius: 10px;
      transition: background 0.2s;
    }
    .custom-select-dropdown::-webkit-scrollbar-thumb:hover {
      background: #9ca3af;
    }
    .custom-select-dropdown {
      scrollbar-width: thin;
      scrollbar-color: #c1c7cd #f1f1f1;
    }

    .custom-select-option {
      padding: 10px 16px;
      font-size: 14px;
      color: #374151;
      cursor: pointer;
      transition: background 0.15s ease;
      border-bottom: 1px solid #f3f4f6;
    }
    .custom-select-option:last-child {
      border-bottom: none;
    }
    .custom-select-option:hover {
      background: #f3f4f6;
    }
    .custom-select-option.active {
      background: #e5e7eb;
      font-weight: 600;
      color: #111827;
    }
    .custom-select-option.disabled {
      color: #d1d5db;
      cursor: default;
      pointer-events: none;
    }

    /* ====== 链接列表 ====== */
    .links-list {
      counter-reset: pt;
      border-top: 1px solid var(--c-border);
    }

    /* ====== 分组标题 ====== */
    .group-title {
      font-size: 15px;
      font-weight: 700;
      color: #111827;
      margin: 8px 0 4px 4px;
      padding-left: 8px;
      border-left: 3px solid #2563eb;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.3s ease;
    }
    .group-title.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* ====== 卡片 ====== */
    .link-card {
      display: block;
      text-decoration: none;
      color: inherit;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .3s ease, transform .3s ease;
    }
    .link-card.show {
      opacity: 1;
      transform: translateY(0);
    }

    .link-card:hover {
      /* 悬停效果由内部 .link-header 承担 */
    }

    /* ====== 桌面端布局：Grid ====== */
    .link-header {
      position: relative;
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 13px 2px;
      border-bottom: 1px solid var(--c-border);
      counter-increment: pt;
      transition: transform .16s ease;
    }
    .link-header::before {
      content: counter(pt, decimal-leading-zero);
      font-family: var(--font-num);
      font-size: 13px;
      color: var(--c-text-3);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
      min-width: 22px;
      transition: color .16s ease;
    }
    .link-header::after {
      content: '';
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 2px;
      background: var(--c-primary);
      border-radius: 1px;
      transform: scaleX(0);
      transform-origin: left center;
      transition: transform .22s cubic-bezier(.4,0,.2,1);
    }
    .link-header:hover {
      transform: translateX(3px) scale(1.012);
      transform-origin: left center;
    }
    .link-header:hover::after { transform: scaleX(1); }
    .link-header:hover::before { color: var(--c-primary); }
    .link-header:hover .link-title { color: var(--c-primary); font-weight: 600; }

    /* .link-icon 已移除（改为目录编号） */

    .link-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--c-text);
      line-height: 1.4;
      flex-shrink: 0;
      white-space: nowrap;
      transition: color .16s ease, font-weight .12s ease;
    }

    .link-source {
      font-size: 12.5px;
      color: var(--c-text-3);
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .link-tag {
      font-size: 12px;
      color: var(--c-text-2);
      background: var(--c-surface-2);
      padding: 1px 8px;
      border-radius: var(--r-sm);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .link-date {
      font-size: 12.5px;
      color: var(--c-text-3);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      flex-shrink: 0;
      margin-left: auto;
    }

    /* ====== 返回按钮 ====== */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--c-text-3);
      font-size: 15px;
    }

    /* ====== 响应式：手机端 ====== */
    @media (max-width: 768px) {





      .current-time {
        display: none;
      }

      .container {
        margin-top: 20px;
      }

      .page-title {
        font-size: 22px;
      }

      .filter-bar {
        gap: 8px;
      }
      .custom-select {
        min-width: 120px;
        flex: 1;
      }

      /* ====== 手机端：目录行改为可换行 ====== */
      .link-header {
        flex-wrap: wrap;
        gap: 6px 10px;
        padding: 12px 2px;
      }
      .link-title {
        flex: 1 1 100%;
        white-space: normal;
      }
      .link-source {
        flex: 1 1 60%;
      }
      .link-date {
        margin-left: auto;
      }
    }
  
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px; background: #111827; color: white;
      text-decoration: none; border-radius: var(--r-sm);
      font-weight: 500; font-size: 13px;
      transition: background 0.3s ease;
      flex-shrink: 0; white-space: nowrap;
    }
    .back-link:hover { background: #374151; }

    /* ================= 线路进度图 ================= */
    .pg-sourcebar {
      font-size: 12.5px;
      line-height: 1.8;
      color: var(--c-text-3);
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      border-radius: var(--r-md);
      padding: 12px 16px;
      margin-bottom: 18px;
    }
    .pg-sourcebar b { color: var(--c-text-2); font-weight: 500; }
    .pg-sourcebar a {
      color: var(--c-primary);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color .15s ease;
    }
    .pg-sourcebar a:hover { border-bottom-color: var(--c-primary); }

    .pg-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 20px;
      align-items: center;
    }
    .pg-tab {
      padding: 6px 14px;
      border-radius: var(--r-sm);
      border: 1px solid var(--c-border);
      background: var(--c-surface);
      color: var(--c-text-2);
      font-size: 13px;
      text-decoration: none;
      cursor: pointer;
      transition: all .16s ease;
      font-family: var(--font);
    }
    .pg-tab:hover { border-color: var(--c-border-2); color: var(--c-text); }
    .pg-tab.active {
      background: var(--lc, #2563eb);
      border-color: var(--lc, #2563eb);
      color: #fff;
      font-weight: 500;
    }
    .pg-tab .dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: 1px;
      background: var(--lc, #2563eb);
    }
    .pg-tab.active .dot { background: #fff; }

    /* 线路头 */
    .pg-line-head {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
      padding: 14px 18px;
      border-radius: var(--r-lg) var(--r-lg) 0 0;
      background: var(--lc, #2563eb);
      color: #fff;
    }
    .pg-line-head .num {
      font-family: var(--font-num);
      font-size: 26px;
      font-weight: 700;
      line-height: 1;
    }
    .pg-line-head .nm { font-size: 16px; font-weight: 600; }
    .pg-line-head .meta {
      margin-left: auto;
      font-size: 12.5px;
      opacity: .9;
      font-variant-numeric: tabular-nums;
    }

    /* 图例 */
    .pg-legend {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      padding: 10px 18px;
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      border-top: 0;
      border-radius: 0 0 var(--r-lg) var(--r-lg);
      font-size: 12.5px;
      color: var(--c-text-3);
      margin-bottom: 26px;
    }
    .pg-legend i {
      display: inline-block;
      width: 22px; height: 6px;
      border-radius: 3px;
      margin-right: 6px;
      vertical-align: middle;
    }
    .pg-legend .lg-through { background: #16a34a; }
    .pg-legend .lg-track   { background: #06b6d4; }
    .pg-legend .lg-st-operating { background: #7E57C2; }
    .pg-legend .lg-st-capped    { background: #66BB6A; }
    .pg-legend .lg-st-mep       { background: #26C6DA; }
    .pg-legend .lg-sep {
      width: 1px; height: 14px;
      background: var(--c-border-2);
      margin: 0 2px;
    }
    .pg-legend .lg-done { background: #16a34a; }
    .pg-legend .lg-wip  { background: #f59e0b; }
    .pg-legend .lg-todo { background: #d1d5db; }

    /* 进度图主体（竖排） */
    .pg-body {
      position: relative;
      padding: 24px 0 30px;
      margin-bottom: 8px;
    }
    .pg-station {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 46px;
    }
    .pg-box {
      z-index: 2;
      width: 112px;           /* 统一宽度：5 字站名 + 左侧状态条 */
      box-sizing: border-box;
      padding: 7px 14px;
      text-align: center;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--c-text);
      background: #fff;
      border: 2px solid var(--lc, #2563eb);
      border-radius: 6px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
      white-space: nowrap;
    }
    /* 车站工序状态色条 */
    .pg-box.has-st { padding-left: 26px; }
    /* 换乘线路徽标：绝对定位在矩形右侧，不参与布局 */
    .pg-tf {
      position: absolute;
      left: calc(50% + 58px);
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      gap: 4px;
      z-index: 3;
    }
    .tf-badge {
      width: 39px;            /* 与站点矩形同高，正方形 */
      height: 39px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 30px;        /* 单位与双位统一字号，不做响应式缩放 */
      font-weight: 400;       /* 不加粗 */
      line-height: 1;
      border-radius: 5px;
      flex-shrink: 0;
    }
    /* 双位线路：仅缩窄字间距，保证落在正方形内 */
    .tf-badge.tf-2d { letter-spacing: -0.02em; }
    @media (max-width: 640px) { .pg-tf { left: calc(50% + 58px); gap: 3px; } }

    .pg-box .st {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 10px;
      border-radius: 0;   /* 圆角完全由 .pg-box 的 overflow:hidden 裁切，保证与矩形一致 */
    }
    .pg-box { position: relative; overflow: hidden; }
    .st-operating { background: #7E57C2; }
    .st-capped    { background: #66BB6A; }
    .st-mep       { background: #26C6DA; }
    .st-track     { background: #26C6DA; }
    .st-todo      { background: #d1d5db; }

    .pg-box.is-open {
      background: var(--lc, #2563eb);
      color: #fff;
    }
    .pg-box .bdg {
      display: inline-block;
      margin-left: 6px;
      font-size: 11px;
      font-weight: 400;
      opacity: .8;
    }

    /* 区间：两条竖线 */
    .pg-seg {
      position: relative;
      height: 34px;
    }
    .pg-rail {
      position: absolute;
      top: -6px;              /* 向上插进站点行，与矩形接头 */
      bottom: -6px;           /* 向下插进站点行，与矩形接头 */
      width: 6px;
      border-radius: 0;       /* 不要圆角 */
      background: #d1d5db;
    }
    .pg-rail.l { left: calc(50% - 16px); }
    .pg-rail.r { left: calc(50% + 10px); }
    .pg-rail.s-through { background: #16a34a; }
    .pg-rail.s-track   { background: #06b6d4; }
    .pg-rail.s-done { background: #16a34a; }
    .pg-rail.s-wip  { background: #f59e0b; }
    .pg-rail.s-todo { background: #d1d5db; }
    .pg-rail .lbl {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 11px;
      color: var(--c-text-4);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .pg-rail.r .lbl { left: auto; right: 14px; }

    /* 统计条 */
    .pg-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 18px 0 24px;
    }
    .pg-stat {
      flex: 1 1 160px;
      padding: 12px 16px;
      border-radius: var(--r-md);
      background: var(--c-surface);
      border: 1px solid var(--c-border);
    }
    .pg-stat .k { font-size: 12px; color: var(--c-text-3); }
    .pg-stat .v {
      font-family: var(--font-num);
      font-size: 20px;
      font-weight: 600;
      color: var(--c-text);
      font-variant-numeric: tabular-nums;
      margin-top: 2px;
    }

    .pg-bars-head {
      display: flex;
      align-items: baseline;
      gap: 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--c-text);
      margin: 20px 0 10px;
    }
    .pg-bars-head .date {
      font-family: var(--font-num);
      font-size: 12px;
      font-weight: 400;
      color: var(--c-text-3);
      margin-left: auto;
      font-variant-numeric: tabular-nums;
    }

    .pg-stat-lines {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px 14px;
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      border-radius: var(--r-md);
      margin: 0 0 14px;
      font-size: 12.5px;
    }
    .pg-stat-lines .sl { display: flex; gap: 12px; }
    .pg-stat-lines .k {
      color: var(--c-text-3);
      min-width: 32px;
      flex-shrink: 0;
    }
    .pg-stat-lines .v {
      color: var(--c-text-2);
      font-variant-numeric: tabular-nums;
    }

    /* 整体进度条 */
    .pg-bars {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px 24px;
      margin: 18px 0 22px;
    }
    .pg-bar .row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 5px;
    }
    .pg-bar .row .k { font-size: 12.5px; color: var(--c-text-3); }
    .pg-bar .row .v {
      font-family: var(--font-num);
      font-size: 13px;
      font-weight: 600;
      color: var(--c-text);
      font-variant-numeric: tabular-nums;
    }
    .pg-bar .track {
      height: 7px;
      border-radius: 4px;
      background: var(--c-surface-2);
      overflow: hidden;
    }
    .pg-bar .fill {
      height: 100%;
      border-radius: 4px;
      background: var(--lc, #2563eb);
      transition: width .5s cubic-bezier(.4,0,.2,1);
    }

    .pg-footnote {
      font-size: 12.5px;
      color: var(--c-text-3);
      line-height: 1.75;
      padding: 10px 14px;
      border-radius: var(--r-sm);
      background: var(--c-surface-2);
      margin-bottom: 12px;
    }
    .pg-footnote::before {
      content: '※ ';
      color: var(--c-text-4);
    }

    .pg-note {
      font-size: 12.5px;
      color: var(--c-text-3);
      padding: 12px 16px;
      background: var(--c-warn-bg);
      border-left: 3px solid var(--c-warn-bd);
      border-radius: var(--r-sm);
      line-height: 1.7;
      margin-bottom: 20px;
    }
    .pg-empty {
      padding: 40px 0;
      text-align: center;
      color: var(--c-text-4);
      font-size: 14px;
    }
</style>

<body>
  <script src="navbar.js"></script>

  <!-- 主内容区域 -->
  <main class="container">
    <h1 class="page-title">
      <span>五期线路跟踪（可能不全）</span>
      <a href="index" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        返回首页
      </a>
    </h1>
    <p class="page-subtitle">不定期更新，可自行关注，信息也不一定是最新的</p>

    <!-- 数据来源说明 -->
    <div class="pg-sourcebar">
      区间进度数据综合自公开渠道：<b>深圳地铁集团官网</b>环评信息公告（里程 / 站数 / 换乘站数）、<b>深圳市规划和自然资源局</b>规划公示（区间名单 / 站名）、各区政府<b>「交通轨道管理中心」</b>月度进展通报，以及深圳交通（深圳市政府账号）、奥一新闻、深圳特区报、香港商报、工人日报等公开报道。各线路数据截止日期与具体出处见线路下方「数据来源」。
    </div>

    <!-- 线路选择 -->
    <div class="pg-toolbar" id="pgToolbar"></div>

    <!-- 进度图容器 -->
    <div id="pgContainer"></div>
  </main>

<script src="all-lines-enhanced.js"></script>
  <script src="progress-data.js"></script>
  <script>
  // ================= 线路进度数据 =================
  // status: done=已贯通 / wip=掘进中 / todo=未开工
  // 数据来源均标注在 sources 里，只有官方/权威媒体的才写
  // 文字对比色：与全站 index.html / trains.html / wiki.html 的 getTextColor 完全一致
  /* ===== 换乘线路徽标（参考首页线路入口：底色=线路色，文字按亮度取黑/白） ===== */
  const LINE_MAP = {};
  const STATION_TRANSFERS = {};
  if (typeof ALL_LINES_ENHANCED !== 'undefined') {
    ALL_LINES_ENHANCED.forEach(l => {
      LINE_MAP[String(l.id)] = l;
      Object.keys(l.transfers || {}).forEach(stName => {
        if (!STATION_TRANSFERS[stName]) STATION_TRANSFERS[stName] = {};
        // 该站所属线路本身也是换乘方（反之亦然）
        STATION_TRANSFERS[stName][String(l.id)] = true;
        (l.transfers[stName] || []).forEach(id => { STATION_TRANSFERS[stName][String(id)] = true; });
      });
    });
  }

  function transferBadges(line, stName) {
    const set = STATION_TRANSFERS[stName];
    if (!set) return [];
    // 当前线路自身不算换乘（13s→13、20b→20）
    const selfId = line.id === '20b' ? '20' : (line.id === '13s' ? '13' : String(line.id));
    const ids = Object.keys(set)
      .filter(id => id !== selfId)
      .sort((a, b) => (parseInt(a, 10) || 0) - (parseInt(b, 10) || 0));
    return ids.map(id => {
      const L = LINE_MAP[id];
      const open = !!(L && L.category === 'operating');
      const color = (L && L.color) ? L.color : '#888888';
      return {
        disp: id === '6z' ? '6Z' : id,
        open,
        bg: open ? color : '#4b5563',                 // 未开通：深灰
        fg: open ? getTextColor(color) : '#ffffff'    // 已开通：按亮度取黑/白
      };
    });
  }

  function getTextColor(hex) {
    let r, g, b;
    if (hex && hex.startsWith('#')) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      if (result) {
        r = parseInt(result[1], 16);
        g = parseInt(result[2], 16);
        b = parseInt(result[3], 16);
      } else {
        const resultShort = /^#?([a-f\d])([a-f\d])([a-f\d])$/i.exec(hex);
        if (resultShort) {
          r = parseInt(resultShort[1] + resultShort[1], 16);
          g = parseInt(resultShort[2] + resultShort[2], 16);
          b = parseInt(resultShort[3] + resultShort[3], 16);
        }
      }
    }
    if (r === undefined) return 'black';
    const brightness = 0.299 * r + 0.587 * g + 0.114 * b;
    return brightness > 130 ? 'black' : 'white';
  }

  const LINES = (typeof PROGRESS_DATA !== 'undefined') ? PROGRESS_DATA : [];

  // ================= 渲染 =================
  const toolbar = document.getElementById('pgToolbar');
  const container = document.getElementById('pgContainer');

  function currentId() {
    const m = new URLSearchParams(location.search).get('line');
    return m && LINES.some(l => l.id === m) ? m : '15';
  }

  function renderToolbar(activeId) {
    toolbar.innerHTML = LINES.map(l => {
      const active = l.id === activeId;
      const style = active
        ? `--lc:${l.color};background:${l.color};border-color:${l.color};color:${getTextColor(l.color)}`
        : `--lc:${l.color}`;
      return `<a class="pg-tab${active ? ' active' : ''}" style="${style}" href="?line=${l.id}">
         <span class="dot"></span>${l.id === '20b' ? '20二期' : (l.id === '13s' ? '13二期' : l.id + '号线')}
       </a>`;
    }).join('');
  }

  function segState(line, a, b) {
    const k1 = a + '-' + b, k2 = b + '-' + a;
    const s = line.segments[k1] || line.segments[k2];
    return s || { l: 'todo', r: 'todo' };
  }

  function renderLine(line) {
    const st = line.stations;
    let html = `<div style="--lc:${line.color}">`;
    const tc = getTextColor(line.color);
    html += `<div class="pg-line-head" style="color:${tc}">
      <span class="num">${line.id === '20b' ? '20' : (line.id === '13s' ? '13' : line.id)}</span>
      <span class="nm">${line.name}${line.id === '20b' ? '（机场北 → 白石洲）' : ''}</span>
      <span class="meta">${line.lengthKm} km · ${line.stationCount} 站${line.transferCount ? ' · 换乘 ' + line.transferCount + ' 座' : ''}${line.segCount ? ' · 区间 ' + line.segCount + ' 个' : ''}</span>
    </div>`;
    const hasSt = !!line.stationStatus;
    html += `<div class="pg-legend">
      <span class="lg-g"><i class="lg-through"></i>区间贯通</span>
      <span class="lg-g"><i class="lg-track"></i>机电/铺轨</span>
      <span class="lg-g"><i class="lg-wip"></i>掘进中</span>
      <span class="lg-g"><i class="lg-todo"></i>未开工</span>
      ${hasSt ? `<span class="lg-sep"></span>
      <span class="lg-g"><i class="lg-st-operating"></i>已运营</span>
      <span class="lg-g"><i class="lg-st-capped"></i>已封顶</span>
      <span class="lg-g"><i class="lg-st-mep"></i>机电/附属</span>` : ''}
      <span style="margin-left:auto">左 / 右线分列于站体两侧</span>
    </div>`;

    html += `<div class="pg-body">`;
    for (let i = 0; i < st.length; i++) {
      const isFirst = i === 0, isLast = i === st.length - 1;
      if (!isFirst) {
        const s = segState(line, st[i-1], st[i]);
        html += `<div class="pg-seg">
          <span class="pg-rail l s-${s.l}"><span class="lbl">${s.l === 'todo' ? '' : ''}</span></span>
          <span class="pg-rail r s-${s.r}"></span>
        </div>`;
      }
      const ss = line.stationStatus && line.stationStatus[st[i]];
      const tf = transferBadges(line, st[i]);
      const tfHtml = tf.length ? '<div class="pg-tf">' + tf.map(b =>
        `<span class="tf-badge${b.disp.length > 1 ? ' tf-2d' : ''}${b.open ? '' : ' tf-off'}" style="background:${b.bg};color:${b.fg}">${b.disp}</span>`
      ).join('') + '</div>' : '';
      if (ss) {
        html += `<div class="pg-station"><div class="pg-box has-st"><span class="st st-${ss}"></span>${st[i]}</div>${tfHtml}</div>`;
      } else {
        html += `<div class="pg-station"><div class="pg-box">${st[i]}</div>${tfHtml}</div>`;
      }
    }
    html += `</div>`;

    if (line.bars && line.bars.length) {
      html += `<div class="pg-bars-head">官方建设进度${line.dataDate ? '<span class="date">数据日期 ' + line.dataDate + '</span>' : ''}</div>`;
      html += `<div class="pg-bars">` + line.bars.map(b =>
        `<div class="pg-bar">
           <div class="row"><span class="k">${b.k}</span><span class="v">${b.v}%</span></div>
           <div class="track"><div class="fill" style="width:${Math.min(100, b.v)}%"></div></div>
         </div>`
      ).join('') + `</div>`;
    }

    if (line.segStat || line.staStat) {
      html += `<div class="pg-stat-lines">` +
        (line.segStat ? `<div class="sl"><span class="k">区间</span><span class="v">${line.segStat}</span></div>` : '') +
        (line.staStat ? `<div class="sl"><span class="k">车站</span><span class="v">${line.staStat}</span></div>` : '') +
        `</div>`;
    }

    var sm = line.summary || {};
    if (sm.capped != null || sm.shield != null || sm.twin != null) {
      html += `<div class="pg-stats">
        <div class="pg-stat"><div class="k">车站封顶</div><div class="v">${sm.capped != null ? sm.capped + ' / ' + line.stationCount : '—'}</div></div>
        <div class="pg-stat"><div class="k">盾构掘进</div><div class="v">${sm.shield != null ? sm.shield + ' 台' : '—'}</div></div>
        <div class="pg-stat"><div class="k">双线贯通区间</div><div class="v">${sm.twin != null ? sm.twin + ' 个' : '—'}</div></div>
      </div>`;
    }

    if (line.footnote) {
      html += `<div class="pg-footnote">${line.footnote}</div>`;
    }
    if (line.sources) {
      html += `<div class="pg-note"><b>数据来源：</b>${line.sources}<br><b>整体进度：</b>${line.overall}</div>`;
    } else {
      html += `<div class="pg-note"><b>整体进度：</b>${line.overall}。区间配色仅标注已公开核实的部分，其余暂显示为未开工。</div>`;
    }
    html += `</div>`;
    return html;
  }

  function render() {
    const id = currentId();
    renderToolbar(id);
    const line = LINES.find(l => l.id === id);
    container.innerHTML = renderLine(line);
  }

  render();
  window.addEventListener('popstate', render);
</script>
</body>
</html>
