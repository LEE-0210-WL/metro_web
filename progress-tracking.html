  /* ================================================================

  class CustomSelect {
    constructor({ wrapperId, triggerId, valueId, dropdownId, placeholder, maxHeight = 200, onSelect }) {
      this.wrapper = document.getElementById(wrapperId);
      this.trigger = document.getElementById(triggerId);
      this.valueEl = document.getElementById(valueId);
      this.dropdown = document.getElementById(dropdownId);
      this.placeholder = placeholder || '请选择';
      this.maxHeight = maxHeight;
      this.onSelect = onSelect || (() => {});
      this.options = [];
      this.selectedValue = null;
      this.isOpen = false;

      this.trigger.addEventListener('click', (e) => {
        e.stopPropagation();
        this.toggle();
      });

      document.addEventListener('click', () => {
        this.close();
      });
      this.dropdown.addEventListener('click', (e) => {
        e.stopPropagation();
      });

      this.dropdown.style.maxHeight = '0px';
    }

    toggle() {
      this.isOpen ? this.close() : this.open();
    }

    open() {
      if (this.isOpen) return;
      this.isOpen = true;
      this.trigger.classList.add('open');
      this.dropdown.classList.add('open');
      const totalHeight = Math.min(this.dropdown.scrollHeight || 100, this.maxHeight);
      this.dropdown.style.maxHeight = totalHeight + 'px';
    }

    close() {
      if (!this.isOpen) return;
      this.isOpen = false;
      this.trigger.classList.remove('open');
      this.dropdown.classList.remove('open');
      this.dropdown.style.maxHeight = '0px';
    }

    setOptions(items) {
      this.options = items;
      this.dropdown.innerHTML = '';
      items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'custom-select-option';
        if (item.disabled) div.classList.add('disabled');
        if (item.value === this.selectedValue) div.classList.add('active');
        div.dataset.value = item.value;
        div.textContent = item.label;
        div.addEventListener('click', () => {
          if (item.disabled) return;
          this.selectValue(item.value);
        });
        this.dropdown.appendChild(div);
      });
      if (this.isOpen) {
        const totalHeight = Math.min(this.dropdown.scrollHeight || 100, this.maxHeight);
        this.dropdown.style.maxHeight = totalHeight + 'px';
      }
    }

    selectValue(value) {
      const item = this.options.find(o => o.value === value);
      if (!item || item.disabled) return;
      this.selectedValue = value;
      this.valueEl.textContent = item.label;
      this.dropdown.querySelectorAll('.custom-select-option').forEach(el => {
        el.classList.toggle('active', el.dataset.value === value);
      });
      this.close();
      if (this.onSelect) this.onSelect(value, item);
    }

    setValue(value) {
      const item = this.options.find(o => o.value === value);
      if (item) {
        this.selectedValue = value;
        this.valueEl.textContent = item.label;
        this.dropdown.querySelectorAll('.custom-select-option').forEach(el => {
          el.classList.toggle('active', el.dataset.value === value);
        });
      } else {
        this.selectedValue = null;
        this.valueEl.textContent = this.placeholder;
      }
    }

    getValue() {
      return this.selectedValue;
    }
  }

  /* ================================================================
     渲染逻辑
     ================================================================ */
  let currentCategory = 'all';

  function getIconPath(category) {
    return categoryMap[category]?.icon || "M13 10V3L4 14h7v7l9-11h-7z";
  }

  function createCardHTML(item) {
    const iconPath = getIconPath(item.category);
    return `
      <div class="link-header">
        <div class="link-icon">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${iconPath}" />
          </svg>
        </div>
        <div class="link-title">${item.title}</div>
        <div class="link-source">${item.source}</div>
        <span class="link-tag">${item.tag}</span>
        <span class="link-date">${item.date}</span>
      </div>
    `;
  }

  function renderLinks() {
    const container = document.getElementById('linksList');
    container.innerHTML = '';

    let filtered = progressData;
    if (currentCategory !== 'all') {
      filtered = progressData.filter(item => item.category === currentCategory);
    }

    if (filtered.length === 0) {
      container.innerHTML = '<div class="empty-state">该分类下暂无数据</div>';
      return;
    }

    // 如果选的是"各线进度"，按线路分组
    if (currentCategory === 'line') {
      const groups = {};
      filtered.forEach(item => {
        if (!groups[item.tag]) groups[item.tag] = [];
        groups[item.tag].push(item);
      });

      let seq = 0;
      const stepDelay = 80; // 统一间隔 80ms

      Object.keys(groups).forEach((tag) => {
        // 分组标题
        const groupTitle = document.createElement('div');
        groupTitle.className = 'group-title';
        groupTitle.textContent = tag;
        container.appendChild(groupTitle);

        requestAnimationFrame(() => {
          setTimeout(() => groupTitle.classList.add('show'), seq * stepDelay);
        });
        seq++;

        // 该分组下的卡片
        groups[tag].forEach((item) => {
          const card = document.createElement('a');
          card.href = item.url;
          card.target = "_blank";
          card.className = 'link-card';
          card.innerHTML = createCardHTML(item);
          container.appendChild(card);

          requestAnimationFrame(() => {
            setTimeout(() => card.classList.add('show'), seq * stepDelay);
          });
          seq++;
        });
      });
    } else {
      filtered.forEach((item, index) => {
        const card = document.createElement('a');
        card.href = item.url;
        card.target = "_blank";
        card.className = 'link-card';
        card.innerHTML = createCardHTML(item);
        container.appendChild(card);

        requestAnimationFrame(() => {
          setTimeout(() => card.classList.add('show'), index * 80);
        });
      });
    }
  }

  /* ================================================================
     初始化
     ================================================================ */
  const categorySelect = new CustomSelect({
    wrapperId: 'categorySelectWrapper',
    triggerId: 'categorySelectTrigger',
    valueId: 'categorySelectValue',
    dropdownId: 'categorySelectDropdown',
    placeholder: '全部进度',
    maxHeight: 220,
    onSelect: (value) => {
      currentCategory = value;
      renderLinks();
    }
  });

  const categoryItems = [
    { value: 'all', label: '全部进度' },
    { value: 'line', label: '各线进度' },
    { value: 'intercity', label: '城际进度' },
    { value: 'hub', label: '枢纽进度' },
    { value: 'overview', label: '综合进度' }
  ];
  categorySelect.setOptions(categoryItems);
  categorySelect.setValue('all');

  renderLinks();

  // 实时时间
  function updateTime() {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const seconds = String(now.getSeconds()).padStart(2, '0');
    const month = now.getMonth() + 1;
    const day = now.getDate();
    const weekDays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
    const weekDay = weekDays[now.getDay()];

    const el = document.getElementById('currentTime');
    if (el) {
      el.textContent = `${hours}:${minutes}:${seconds}，${month}月${day}日，${weekDay}`;
    }
  }
  updateTime();
  setInterval(updateTime, 1000);
</script>
</body>
</html>
