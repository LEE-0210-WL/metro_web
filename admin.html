<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="https://fonts.cdnfonts.com/css/harmonyos-sans">
<title>内测数据统计（管理端） - 走进新天地·Railway</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #f0f2f5;
    color: #111827;
    font-family: var(--font, 'HarmonyOS Sans', -apple-system, "Microsoft YaHei", sans-serif);
  }
  .container { width: min(96%, 1320px); margin: 20px auto 60px; padding: 0 20px; }
  .page-title {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
    font-size: 26px; font-weight: 700; margin: 0 0 6px;
  }
  .page-title span { display: inline-flex; align-items: center; gap: 10px; }
  .page-subtitle { color: var(--c-text-3, #6b7280); font-size: var(--fs-sm, 13px); margin: 0 0 22px; }
  .back-link {
    display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-sm, 13px); font-weight: 500;
    color: #2563eb; text-decoration: none; padding: 6px 12px; border-radius: 8px; background: #eff6ff;
  }
  .back-link:hover { background: #dbeafe; }

  .card {
    background: #fff; border-radius: 16px; padding: 20px 22px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06); margin-bottom: 20px;
  }
  .card h2 { font-size: 15px; font-weight: 700; margin: 0 0 14px; color: #111827; }

  /* ---- 汇总 ---- */
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .stat {
    background: #fff; border-radius: 14px; padding: 16px 18px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06); border-left: 4px solid #2563eb;
  }
  .stat .k { font-size: var(--fs-xs, 12px); color: var(--c-text-3, #6b7280); margin-bottom: 6px; }
  .stat .v { font-size: 22px; font-weight: 700; line-height: 1.2; }
  .stat .u { font-size: var(--fs-xs, 12px); color: var(--c-text-3, #6b7280); margin-left: 3px; font-weight: 500; }
  .stat.green { border-left-color: #10b981; }
  .stat.amber { border-left-color: #f59e0b; }
  .stat.red   { border-left-color: #ef4444; }

  /* ---- 表格 ---- */
  .tbl-wrap { overflow-x: auto; border: 1px solid #e5e7eb; border-radius: 12px; }
  table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: var(--fs-sm, 13px); }
  th, td { padding: 9px 12px; text-align: left; white-space: nowrap; border-bottom: 1px solid #eef1f5; }
  th { background: #f8fafc; font-weight: 600; color: #374151; position: sticky; top: 0; z-index: 1; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #f9fbfd; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .me { background: #fffbeb; }
  .me td:first-child::after { content: " （我）"; color: #b45309; font-size: 11px; }

  .pill {
    display: inline-block; padding: 2px 9px; border-radius: 999px;
    font-size: var(--fs-xs, 12px); font-weight: 600; white-space: nowrap;
  }
  .pill.free { background: #e5e7eb; color: #374151; }
  .pill.paid { background: #dbeafe; color: #1d4ed8; }
  .pill.warn { background: #fef3c7; color: #b45309; }
  .pill.danger { background: #fee2e2; color: #b91c1c; }
  .pill.ok { background: #d1fae5; color: #047857; }
  .muted { color: var(--c-text-3, #6b7280); }

  .bar { height: 6px; background: #eef1f5; border-radius: 999px; overflow: hidden; min-width: 64px; }
  .bar > i { display: block; height: 100%; background: #2563eb; border-radius: 999px; }
  .bar.low > i { background: #ef4444; }
  .bar.mid > i { background: #f59e0b; }

  .row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  button {
    font-family: inherit; font-size: var(--fs-sm, 13px); font-weight: 500;
    padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer;
    background: #2563eb; color: #fff;
  }
  button:hover { background: #1d4ed8; }
  button.ghost { background: #f3f4f6; color: #374151; }
  button.ghost:hover { background: #e5e7eb; }
  button:disabled { opacity: .6; cursor: default; }

  input {
    font-family: inherit; font-size: 14px; padding: 9px 12px; border: 1px solid #d1d5db;
    border-radius: 8px; width: 100%; margin-bottom: 10px;
  }
  .err { background: #fef2f2; color: #b91c1c; border-radius: 8px; padding: 10px 14px; font-size: var(--fs-sm, 13px); margin-top: 10px; }
  /* ---- DeepSeek 余额卡片 ---- */
  .balance {
    border-radius: 16px; padding: 18px 22px; margin-bottom: 20px; background: #fff;
    box-shadow: 0 2px 10px rgba(0,0,0,.06); border-left: 5px solid #10b981;
  }
  .balance.warn { border-left-color: #f59e0b; background: #fffbeb; }
  .balance.critical { border-left-color: #ef4444; background: #fef2f2; }
  .balance h2 { margin: 0; font-size: 15px; }
  .balance .big { font-size: 30px; font-weight: 700; line-height: 1.1; }
  .balance .sub { color: var(--c-text-3, #6b7280); font-size: var(--fs-sm, 13px); margin-top: 4px; }
  .balance .row { display: flex; gap: 28px; flex-wrap: wrap; align-items: flex-end; margin-top: 12px; }
  .balance .kv { font-size: var(--fs-sm, 13px); color: #374151; line-height: 1.7; }
  .balance .kv b { font-size: 17px; }
  .banner { margin-top: 12px; padding: 10px 14px; border-radius: 10px; font-size: var(--fs-sm, 13px); line-height: 1.7; }
  .banner.warn { background: #fef3c7; color: #92400e; }
  .banner.critical { background: #fee2e2; color: #991b1b; }

  @media (max-width: 768px) { .container { padding: 0 14px; } .page-title { font-size: 21px; } }
</style>
</head>
<body>
<script src="navbar.js"></script>

<main class="container">
  <h1 class="page-title">
    <span>📊 内测数据统计</span>
    <a href="tools" class="back-link">← 返回工具页</a>
  </h1>
  <p class="page-subtitle">管理端 · 仅 <b>role = admin</b> 的账号可读取；公开这个网址也拿不到数据</p>

  <!-- 登录卡片 -->
  <div class="card" id="loginCard" hidden>
    <h2>需要管理员登录</h2>
    <div style="max-width:340px">
      <input id="acc" placeholder="账号（如 admin-x）" autocomplete="username">
      <input id="pwd" type="password" placeholder="密码" autocomplete="current-password">
      <button id="loginBtn">登录</button>
      <div class="err" id="loginErr" hidden></div>
    </div>
  </div>

  <!-- DeepSeek 余额 -->
  <div id="balanceBox" hidden></div>

  <!-- 汇总 -->
  <div class="summary" id="summary" hidden></div>

  <!-- 明细 -->
  <div class="card" id="tableCard" hidden>
    <div class="row-between" style="margin-bottom:14px">
      <h2 style="margin:0">各账号明细</h2>
      <div class="row-between" style="gap:8px">
        <span class="muted" id="stamp"></span>
        <button class="ghost" id="refreshBtn">刷新</button>
      </div>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>账号</th><th>套餐</th><th>剩余 / 总量</th><th>已用</th><th>今日</th>
          <th>提问总数</th><th>输入 tokens</th><th>输出 tokens</th><th>缓存命中</th>
          <th>估算花费</th><th>会话</th><th>最后活跃</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <div class="err" id="globalErr" hidden></div>
</main>

<script>
(function () {
  'use strict';
  var API = '/api-auth';
  var TOKEN_KEY = 'metro_token';
  var $ = function (id) { return document.getElementById(id); };
  var token = localStorage.getItem(TOKEN_KEY) || '';
  var perReqCost = 0;   // 单次均价，由 /admin/stats 提供，用于估算余额还能撑多少次

  function fmt(n) { return (n || 0).toLocaleString('zh-CN'); }
  function money(n) { return '¥' + (n || 0).toFixed(4); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function showLogin(msg) {
    $('loginCard').hidden = false;
    $('summary').hidden = true;
    $('tableCard').hidden = true;
    if (msg) { $('loginErr').hidden = false; $('loginErr').textContent = msg; }
  }

  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
    if (token) opts.headers.Authorization = 'Bearer ' + token;
    return fetch(API + path, opts);
  }

  function load() {
    if (!token) return showLogin('');
    $('refreshBtn').disabled = true;
    api('/admin/stats')
      .then(function (r) {
        if (r.status === 401) { token = ''; localStorage.removeItem(TOKEN_KEY); throw { needLogin: '登录已过期，请重新登录' }; }
        if (r.status === 403) throw { needLogin: '这个账号不是管理员（role ≠ admin）' };
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(render)
      .then(function () { loadBalance(); })
      .catch(function (e) {
        if (e && e.needLogin) showLogin(e.needLogin);
        else { $('globalErr').hidden = false; $('globalErr').textContent = '加载失败：' + (e && e.message || e); }
      })
      .finally(function () { $('refreshBtn').disabled = false; });
  }

  function render(d) {
    $('loginCard').hidden = true;
    $('globalErr').hidden = true;
    $('summary').hidden = false;
    $('tableCard').hidden = false;

    var t = d.totals;
    var perReq = t.requests ? t.estCost / t.requests : 0;
    perReqCost = perReq;
    $('summary').innerHTML = [
      ['账号数', t.users, '个', ''],
      ['总提问次数', fmt(t.requests), '次', 'green'],
      ['总 tokens', fmt(t.tokens), '', 'green'],
      ['估算总花费', money(t.estCost), '', 'amber'],
      ['单次均价', money(perReq), '', ''],
      ['当前时段', d.peakNow ? '高峰' : '空闲', '', d.peakNow ? 'red' : 'green'],
    ].map(function (x) {
      return '<div class="stat ' + x[3] + '"><div class="k">' + x[0] + '</div><div class="v">' + x[1] +
             (x[2] ? '<span class="u">' + x[2] + '</span>' : '') + '</div></div>';
    }).join('');

    $('stamp').textContent = '更新于 ' + new Date(d.generatedAt).toLocaleTimeString('zh-CN');

    $('tbody').innerHTML = d.users.map(function (u) {
      var pct = u.limit ? Math.max(0, Math.min(100, u.used / u.limit * 100)) : 0;
      var barCls = pct >= 90 ? 'low' : (pct >= 60 ? 'mid' : '');
      var planCls = u.plan === 'free' ? 'free' : 'paid';
      var leftCls = u.remaining === 0 ? 'danger' : (u.remaining <= Math.max(3, u.limit * 0.1) ? 'warn' : 'ok');
      var isMe = u.username === 'admin-x' || u.email === 'admin-x';
      return '<tr class="' + (isMe ? 'me' : '') + '">' +
        '<td><b>' + esc(u.username) + '</b><br><span class="muted" style="font-size:11px">' + esc(u.email) + '</span></td>' +
        '<td><span class="pill ' + planCls + '">' + esc(u.planName) + '</span>' +
            (u.expiresAt ? '<br><span class="muted" style="font-size:11px">剩 ' + u.daysLeft + ' 天</span>' : '') + '</td>' +
        '<td><span class="pill ' + leftCls + '">' + fmt(u.remaining) + '</span>' +
            ' <span class="muted">/ ' + fmt(u.limit) + '</span>' +
            '<div class="bar ' + barCls + '" style="margin-top:5px"><i style="width:' + pct.toFixed(1) + '%"></i></div></td>' +
        '<td class="num">' + fmt(u.used) + '</td>' +
        '<td class="num">' + (u.todayRequests ? '<b>' + fmt(u.todayRequests) + '</b>' : '<span class="muted">0</span>') + '</td>' +
        '<td class="num">' + fmt(u.totalRequests) + '</td>' +
        '<td class="num">' + fmt(u.promptTokens) + '</td>' +
        '<td class="num">' + fmt(u.completionTokens) + '</td>' +
        '<td class="num">' + fmt(u.cachedTokens) + '</td>' +
        '<td class="num"><b>' + money(u.estCost) + '</b></td>' +
        '<td class="num">' + fmt(u.conversations) + '</td>' +
        '<td>' + (u.lastActiveDay ? '<span class="muted">' + esc(u.lastActiveDay) + '</span>' : '<span class="muted">—</span>') +
            (u.role === 'admin' ? ' <span class="pill warn">admin</span>' : '') + '</td>' +
      '</tr>';
    }).join('');
  }

  // ==================== DeepSeek 余额 ====================
  function loadBalance() {
    api('/admin/balance')
      .then(function (r) { return r.json(); })
      .then(function (b) {
        if (!b || !b.ok) throw new Error((b && (b.error || b.em)) || '余额接口返回异常');
        renderBalance(b);
      })
      .catch(function (e) {
        var box = $('balanceBox');
        box.hidden = false; box.className = 'balance warn';
        box.innerHTML = '<h2>💳 DeepSeek API 余额</h2><div class="banner warn">查询失败：' +
          esc(String((e && e.message) || e)) + '</div>';
      });
  }

  function renderBalance(b) {
    var box = $('balanceBox');
    box.hidden = false;
    box.className = 'balance ' + b.level;
    var label = b.level === 'critical' ? '🔴 告急' : b.level === 'warn' ? '🟡 偏低' : '🟢 充足';
    var runs = perReqCost > 0 ? Math.floor(b.balance / perReqCost) : null;
    var warn = '';
    if (b.level !== 'ok') {
      warn = '<div class="banner ' + b.level + '">' + (b.level === 'critical'
        ? '⚠️ <b>余额告急</b>：官方 is_available = ' + (b.isAvailable ? 'true' : 'false') +
          '，当前 ¥' + b.balance.toFixed(2) + ' 已低于 ¥' + b.thresholds.critical +
          '。<b>请立即充值</b>，否则用户提问会直接失败。'
        : '余额 ¥' + b.balance.toFixed(2) + ' 已低于预警线 ¥' + b.thresholds.warn + '，建议尽快充值（按当前用量约可再撑 ' +
          (runs !== null ? runs.toLocaleString() + ' 次提问' : '不久') + '）。') + '</div>';
    }
    box.innerHTML =
      '<div class="row-between"><h2>💳 DeepSeek API 余额 ' + label + '</h2>' +
      '<span class="muted" style="font-size:12px">查于 ' + new Date(b.checkedAt).toLocaleTimeString('zh-CN') +
      ' · <a href="https://platform.deepseek.com/top_up" target="_blank" rel="noopener" style="color:#2563eb">去充值</a></span></div>' +
      '<div class="row">' +
        '<div><div class="big">¥' + b.balance.toFixed(2) + '</div>' +
        '<div class="sub">' + esc(b.currency) + ' · 充值 ¥' + b.toppedUp.toFixed(2) + ' / 赠送 ¥' + b.granted.toFixed(2) + '</div></div>' +
        (runs !== null ? '<div class="kv">按本站实测均价 ¥' + perReqCost.toFixed(4) + ' / 次<br>约还能回答 <b>' + runs.toLocaleString() + '</b> 次</div>' : '') +
        '<div class="kv">官方 is_available<br><b>' + (b.isAvailable ? '✅ true' : '❌ false') + '</b></div>' +
        '<div class="kv">预警线（本站设定）<br>黄 ¥' + b.thresholds.warn + ' · 红 ¥' + b.thresholds.critical + '</div>' +
      '</div>' + warn;
  }

  function refreshAll() { load(); loadBalance(); }
  $('refreshBtn').addEventListener('click', refreshAll);

  function doLogin() {
    var account = $('acc').value.trim(), password = $('pwd').value;
    if (!account || !password) { $('loginErr').hidden = false; $('loginErr').textContent = '请填账号和密码'; return; }
    $('loginBtn').disabled = true;
    fetch(API + '/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ account: account, password: password }),
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error((res.j && (res.j.error || res.j.em)) || '登录失败');
        var tk = res.j.token || res.j.session || (res.j.data && res.j.data.token);
        if (!tk) throw new Error('登录成功但没拿到 token');
        token = tk; localStorage.setItem(TOKEN_KEY, tk);
        $('pwd').value = ''; $('loginErr').hidden = true;
        load();
      })
      .catch(function (e) { $('loginErr').hidden = false; $('loginErr').textContent = String(e.message || e); })
      .finally(function () { $('loginBtn').disabled = false; });
  }
  $('loginBtn').addEventListener('click', doLogin);
  $('pwd').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });

  load();
})();
</script>
</body>
</html>
