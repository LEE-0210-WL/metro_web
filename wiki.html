<head>
  <meta charset="UTF-8">

  <title>深圳地铁Wiki - 走进新天地·Railway</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: var(--font);
      background-color: #f5f5f5;
      color: #333;
      line-height: 1.6;
    }
    
    /* 顶部导航栏 - 黑色 */
    
    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .site-name {
      font-size: 16px;
      font-weight: 600;
      color: white;
    }
    
    .current-time {
      font-size: 14px;
      color: #ffffff;
      font-weight: 500;
    }
    
    /* 导航链接 */
    
    /* 主内容区域 */

    
    /* ===== 标题行布局 ===== */
    .page-header {
      display: block;
      margin: 0;
      padding: 0;
    }
    
    .page-title {  font-size: 28px;
  font-weight: 700;
  color: #111827;
  margin-bottom: 8px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;}
    
    .page-subtitle-wrapper {
      margin-top: 0;
      margin-bottom: 32px;
    }
    
    .page-subtitle {  font-size: 16px;
  color: #6b7280;
  margin-bottom: 32px;}
    
    /* 长备注（原被误塞进标题行） */
    .page-note {
      color: var(--c-text-3);
      font-size: var(--fs-sm);
      line-height: 1.7;
      margin: 8px 0 0;
    }
    
    /* 窄屏：标题与返回按钮自动换行，按钮靠右 */
    @media (max-width: 640px) {
      .lines-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
      .page-title {
        flex-wrap: wrap;
        align-items: center;
        row-gap: 10px;
        font-size: 22px;
      }
      .page-title .back-link {
        margin-left: auto;
        font-size: 13px;
        padding: 6px 12px;
      }
      .page-title .back-link svg { width: 15px; height: 15px; }
    }
    
    /* 统计信息 */
    .stats-bar {
      justify-content: space-around;
      display: flex;
      gap: 24px;
      margin-bottom: 32px;
      padding: 20px;
      background: white;
      border-radius: var(--r-lg);
      box-shadow: var(--sh-md);
    }
    
    .stat-item {
      flex: 1; 
      text-align: center;
    }
    
    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: #2563eb;
    }
    
    .stat-label {
      font-size: 13px;
      color: #6b7280;
      margin-top: 4px;
    }
    
    /* 线路网格 */
    .lines-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
      gap: 14px;
      justify-items: center;
    }
    
    .line-card {
      border-radius: var(--r-lg);
      padding: 5px 10px;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease;
      position: relative;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 135px;
      height: 60px;
      box-sizing: border-box;
    }

    .line-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.16);
    }

    .line-card:active {
      transform: translateY(0) scale(.99);
    }

    /* 徽标：常规字重（非加粗） */
    .lb-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      line-height: 1;
      pointer-events: none;
    }

    .lb-num {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 54px;
      font-weight: 400;
      line-height: 0.92;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }

    /* 双位数线路（10/11/12…）字距更紧，避免过宽 */
    .lb-num.is-2d {
      letter-spacing: -0.04em;
      font-size: 50px;
    }

    .lb-text {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0;
      padding: 0 0 0 1px;
    }

    .lb-cn {
      font-family: "Microsoft YaHei", "PingFang SC", "Heiti SC", SimHei, sans-serif;
      font-size: 28px;
      font-weight: 400;
      line-height: 1;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }

    /* 长名线路（如 6 号线支线）：字号不变，横向压缩（与官方制图一致） */
    /* 6 号线支线：字号与普通线一致，压缩比由 JS 按「= 英文宽度」计算 */
    .line-card.is-long { padding-left: 6px; padding-right: 6px; }
    .line-card.is-long .lb-cn {
      display: inline-block;
      transform-origin: left center;
    }
    .line-card.is-long .lb-en { font-size: 14px; }

    .lb-en {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      white-space: nowrap;
      font-weight: 400;
      line-height: 1;
      opacity: 0.92;
      letter-spacing: 0;
      padding-left: 1px;
      margin-top: 3px;
    }

    .line-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
    }

    .line-modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .line-modal {
      width: 100%;
      max-width: 430px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      background: var(--c-surface, #fff);
      border-radius: var(--r-xl, 16px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      transform: scale(.94) translateY(8px);
      transition: transform .22s cubic-bezier(.4, 0, .2, 1);
    }

    .line-modal-overlay.open .line-modal {
      transform: scale(1) translateY(0);
    }

    .line-modal-head {
      position: relative;
      padding: 20px 52px 18px 22px;
    }

    .line-modal-head .m-cn {
      font-family: var(--font, 'MiSans', -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif);
      font-size: 20px;
      font-weight: 700;
      line-height: 1.3;
    }

    .line-modal-head .m-en {
      font-family: var(--font, 'MiSans', -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif);
      font-size: 13px;
      opacity: 0.85;
      margin-top: 3px;
    }

    .line-modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.22);
      color: inherit;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s ease;
    }

    .line-modal-close:hover { background: rgba(255, 255, 255, 0.38); }

    .line-modal-body {
      padding: 6px 22px 20px;
      overflow-y: auto;
    }

    .line-modal-body .info-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 9px 0;
      font-size: 14px;
      color: var(--c-text, #111827);
      border-bottom: 1px solid var(--c-border, #e5e7eb);
    }

    .line-modal-body .info-row:last-child { border-bottom: 0; }
    .line-modal-body .info-label { color: var(--c-text-3, #6b7280); flex-shrink: 0; }
    .line-modal-body .info-value { font-weight: 500; text-align: right; }

    .line-modal-body .info-value a {
      color: var(--c-primary, #2563eb);
      text-decoration: none;
    }

    .line-modal-body .info-value a:hover { text-decoration: underline; }

    .line-modal-body .transfers {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--c-border, #e5e7eb);
      font-size: 13px;
      line-height: 1.7;
      color: var(--c-text-2, #374151);
    }

    .line-modal-body .transfers-label {
      font-weight: 600;
      color: var(--c-text-3, #6b7280);
      margin-bottom: 3px;
      font-size: 12.5px;
    }

    @media (max-width: 640px) {
      .line-card { width: 120px; height: 68px; }
      .lb-num { font-size: 46px; }
      .lb-cn { font-size: 22px; }
      .lb-en { font-size: 12px; }
      .line-modal { max-width: 100%; }
    }
    
    /* 分区标题 */
    .section-title {
      font-size: 22px;
      font-weight: 600;
      color: #111827;
      margin: 32px 0 20px;
      padding-bottom: 8px;
      border-bottom: 2px solid #2563eb;
    }
    
    .section-intro {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 20px;
      margin-top: -12px;
    }
    
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px; background: #111827; color: white;
      text-decoration: none; border-radius: var(--r-sm);
      font-weight: 500; font-size: 13px;
      transition: background 0.3s ease;
      flex-shrink: 0; white-space: nowrap;
    }
    .back-link:hover { background: #374151; }
    
    /* 响应式设计 */
    @media (max-width: 768px) {
      
      
      
      
      
      .current-time {
        display: none;
      }
      
      .container {
        margin-top: 20px;
      }
      
      .page-header {
        flex-wrap: wrap;
      }
      
      .page-title {
        font-size: 22px;
      }
      
      .stats-bar {
        flex-wrap: wrap;
        gap: 16px;
      }
      
      .stat-item {
        flex: 1;
        min-width: 80px;
      }
      
      .lines-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>

      <p class="page-note">最近一次更新：2026/10/21 11:45——按实际土建与运营情况修正各线编组（19号线土建4A未预留6节、25号线近期4A远期6A、22号线近期6A远期8A、29号线4/6混跑、20号线6/8混跑），更正15/19/25号线线路名（前南线/坪山线/大浪线），并补充7号线内部支线（文体公园，不对外开放）742/743两列3编组车的说明（站点数不变）</p>

      </div>

        <div class="stat-value">452</div>

      </div>

    <h2 class="section-title">已开通线路</h2>
    <div class="lines-grid" id="openedLinesGrid"></div>
    
    <h2 class="section-title">五期线路（数据仅供参考）</h2>
    <p class="section-intro">资料来源于百度百科</p>
    <div class="lines-grid" id="phase5LinesGrid"></div>

  <script>
    (function() {
      if (typeof ALL_LINES_ENHANCED === 'undefined') {
        console.error('all-lines-enhanced.js 未加载');
        return;
      }

      // 百度百科链接映射（硬编码）
      const baikeUrls = {
        '15': 'https://baike.baidu.com/item/深圳地铁15号线/10338997',
        '17': 'https://baike.baidu.com/item/深圳地铁17号线/3052734',
        '19': 'https://baike.baidu.com/item/深圳地铁19号线/19719997',
        '22': 'https://baike.baidu.com/item/深圳地铁22号线/24673251',
        '25': 'https://baike.baidu.com/item/深圳地铁25号线/59727614',
        '27': 'https://baike.baidu.com/item/深圳地铁27号线/59441972',
        '29': 'https://baike.baidu.com/item/深圳地铁29号线/60650685',
        '32': 'https://baike.baidu.com/item/深圳地铁32号线/62591670'
      };

      // 辅助函数：根据背景色判断文字颜色（用于卡片标题文字）
      function getTextColor(hex) {
        let r, g, b;
        if (hex.startsWith('#')) {
          const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
          if (result) {
            r = parseInt(result[1], 16);
            g = parseInt(result[2], 16);
            b = parseInt(result[3], 16);
          } else {
            const resultShort = /^#?([a-f\d])([a-f\d])([a-f\d])$/i.exec(hex);
            if (resultShort) {
              r = parseInt(resultShort[1] + resultShort[1], 16);
              g = parseInt(resultShort[2] + resultShort[2], 16);
              b = parseInt(resultShort[3] + resultShort[3], 16);
            }
          }
        }
        if (r === undefined) return 'black';
        const brightness = 0.299 * r + 0.587 * g + 0.114 * b;
        return brightness > 130 ? 'black' : 'white';
      }

      // 格式化开通时间
      function formatOpenDate(raw) {
        if (!raw) return '';
        const parts = raw.split('；');
        const formatted = parts.map(part => {
          let s = part.trim();
          s = s.replace(/年/g, '-').replace(/月/g, '-').replace(/日/g, '');
          s = s.replace(/\s+/g, '');
          return s;
        });
        return formatted.join('</br>');
      }

      // 格式化换乘信息
      /* ===== 五期在建线路：不作为换乘站展示 ===== */
      // 整条线路在建
      const PHASE5_LINES = ['15', '17', '19', '22', '25', '27', '29', '32'];
      // 仅部分车站在建（13 号线二期南延 / 20 号线二期）
      const PHASE5_STATION_LINES = {
        '东角头': ['13'],
        '机场东': ['20'], '狮子山公园': ['20'], '航城大道东': ['20'],
        '西乡公园': ['20'], '文汇': ['20'], '甲岸': ['20'],
        '中山公园西': ['20'], '南头古城': ['20'], '深大': ['20'],
        '高新园': ['20'], '白石洲': ['20']
      };

      // 过滤某站在建换乘线路，返回保留的线路 id
      function keepTransferLines(station, lineIds) {
        const localSkip = PHASE5_STATION_LINES[station] || [];
        return lineIds.map(String).filter(id =>
          PHASE5_LINES.indexOf(id) === -1 && localSkip.indexOf(id) === -1
        );
      }

      // 过滤后仍有换乘的车站
      function visibleTransfers(transfersObj) {
        if (!transfersObj || typeof transfersObj !== 'object') return [];
        return Object.entries(transfersObj)
          .map(([station, lineIds]) => ({ station, ids: keepTransferLines(station, lineIds) }))
          .filter(x => x.ids.length > 0);
      }

      function formatTransfers(transfersObj) {
        const list = visibleTransfers(transfersObj);
        if (list.length === 0) return '';
        return list.map(x => {
          const ids = x.ids.map(id => (id === '6z' ? '6Z' : id)).join('/');
          return `${x.station}(${ids})`;
        }).join('、');
      }

      // 分类与排序
      const operatingLines = ALL_LINES_ENHANCED.filter(l => l.category === 'operating');
      const constructionLines = ALL_LINES_ENHANCED.filter(l => l.category === 'construction');

      function sortLines(lines) {
        return lines.sort((a, b) => {
          const idA = a.id.toString();
          const idB = b.id.toString();
          const numA = parseInt(idA);
          const numB = parseInt(idB);
          if (!isNaN(numA) && !isNaN(numB)) return numA - numB;
          if (!isNaN(numA)) return -1;
          if (!isNaN(numB)) return 1;
          return idA.localeCompare(idB);
        });
      }

      const sortedOperating = sortLines(operatingLines);
      const sortedConstruction = sortLines(constructionLines);

      // 渲染函数
      /* ===== 线路详情弹窗 ===== */
    let lineModalOverlay = null;

    function ensureLineModal() {
      if (lineModalOverlay) return lineModalOverlay;
      const wrap = document.createElement('div');
      wrap.className = 'line-modal-overlay';
      wrap.innerHTML = `
        <div class="line-modal" role="dialog" aria-modal="true">
          <div class="line-modal-head">
            <div class="m-cn"></div>
            <div class="m-en"></div>
            <button class="line-modal-close" type="button" aria-label="关闭">×</button>
          </div>
          <div class="line-modal-body"></div>
        </div>
      `;
      document.body.appendChild(wrap);

      const close = () => wrap.classList.remove('open');
      wrap.addEventListener('click', function (e) {
        // 点遮罩关闭；点内容区不关
        if (e.target === wrap) close();
      });
      wrap.querySelector('.line-modal-close').addEventListener('click', close);
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') close();
      });

      lineModalOverlay = wrap;
      return wrap;
    }

    function openLineModal(card) {
      const wrap = ensureLineModal();
      const head = wrap.querySelector('.line-modal-head');
      const body = wrap.querySelector('.line-modal-body');
      const color = card.dataset.modalColor || '#2563eb';
      const tc = card.dataset.modalTextColor || '#ffffff';

      head.style.background = color;
      head.style.color = tc;
      head.querySelector('.m-cn').textContent = card.dataset.modalTitle || '';
      head.querySelector('.m-en').textContent = card.dataset.modalEn || '';
      body.innerHTML = decodeURIComponent(card.dataset.modalBody || '');

      // 如果已经开着，再点同一个卡片则关闭
      if (wrap.classList.contains('open') && wrap.dataset.openFor === card.dataset.modalTitle) {
        wrap.classList.remove('open');
        wrap.dataset.openFor = '';
        return;
      }
      wrap.dataset.openFor = card.dataset.modalTitle || '';
      wrap.classList.add('open');
    }

    function renderCards(lines, containerId, isConstruction = false) {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = '';

        lines.forEach(line => {
          let displayId = line.id;
          if (displayId === '6z') displayId = '6Z';

          let lineName = line.name;
          let alias = line.alias || '';
          if (!alias) {
            const match = line.name.match(/（(.+?)）/);
            if (match) alias = match[1];
          }

          const transfersStr = formatTransfers(line.transfers);
          const transferStationCount = visibleTransfers(line.transfers).length;
          const openDateFormatted = formatOpenDate(line.openDate);
          const lengthDisplay = line.lengthKm ? line.lengthKm + ' km' : (line.lengthDesc || '');
          const stationCount = line.stationCount || 0;

          let openInfo = '';
          if (isConstruction) {
            openInfo = line.openDate || '预计2028年';
          }

          // 详情内容（放进弹窗）
          let bodyHTML = '';
          if (isConstruction) {
            bodyHTML += `
              <div class="info-row"><span class="info-label">线路长度</span><span class="info-value">${lengthDisplay}</span></div>
              <div class="info-row"><span class="info-label">站点数量</span><span class="info-value">${stationCount}座</span></div>
              <div class="info-row"><span class="info-label">预计开通</span><span class="info-value">${openInfo}</span></div>
            `;
            const url = baikeUrls[line.id];
            if (url) {
              bodyHTML += `<div class="info-row"><span class="info-label">百科链接</span><span class="info-value"><a href="${url}" target="_blank" rel="noopener">查看百度百科</a></span></div>`;
            }
            if (transfersStr) {
              bodyHTML += `<div class="transfers"><div class="transfers-label">换乘（规划）</div><div>${transfersStr}</div></div>`;
            }
          } else {
            bodyHTML += `
              <div class="info-row"><span class="info-label">开通日期</span><span class="info-value">${openDateFormatted}</span></div>
              <div class="info-row"><span class="info-label">线路长度</span><span class="info-value">${lengthDisplay}</span></div>
              <div class="info-row"><span class="info-label">站点数量</span><span class="info-value">${stationCount}座</span></div>
              <div class="info-row"><span class="info-label">换乘站点</span><span class="info-value">${transferStationCount}个</span></div>
            `;
            const url = baikeUrls[line.id];
            if (url) {
              bodyHTML += `<div class="info-row"><span class="info-label">百科链接</span><span class="info-value"><a href="${url}" target="_blank" rel="noopener">查看百度百科</a></span></div>`;
            }
            if (transfersStr) {
              bodyHTML += `<div class="transfers"><div class="transfers-label">主要换乘站</div><div>${transfersStr}</div></div>`;
            }
          }

          // 卡片底纹上的文字色（按亮度决定黑/白）
          const textColor = getTextColor(line.color);

          // 徽标拆分：大数字 + 右侧「号线 / LineN」
          const isBranch = (displayId === '6Z');
          const isLong = isBranch;   // 长名线路标记
          const badgeNum = isBranch ? '6' : displayId;
          const is2Digit = (!isBranch && String(displayId).length >= 2);
          const badgeCn  = isBranch ? '号线支线' : '号线';
          const badgeEn  = isBranch ? 'Branch Line 6' : ('Line ' + displayId);
          const badgeTitle = isBranch ? '6号线支线' : (displayId + '号线');
          const badgeFull  = isBranch ? 'Line 6Z' : ('Line ' + displayId);

          let cardHTML = `
            <div class="line-card${isLong ? ' is-long' : ''}" style="background-color: ${line.color}; color: ${textColor};">
              <div class="lb-badge">
                <span class="lb-num${is2Digit ? ' is-2d' : ''}">${badgeNum}</span>
                <span class="lb-text">
                  <span class="lb-cn">${badgeCn}</span>
                  <span class="lb-en">${badgeEn}</span>
                </span>
              </div>
            </div>
          `;

          const tempDiv = document.createElement('div');
          tempDiv.innerHTML = cardHTML;
          const cardElement = tempDiv.firstElementChild;
          cardElement.dataset.modalTitle = badgeTitle;
          cardElement.dataset.modalEn = badgeFull;
          cardElement.dataset.modalColor = line.color;
          cardElement.dataset.modalTextColor = textColor;
          cardElement.dataset.modalBody = encodeURIComponent(bodyHTML);

          cardElement.addEventListener('click', function() {
            openLineModal(this);
          });

          container.appendChild(cardElement);
        });
      }

      renderCards(sortedOperating, 'openedLinesGrid', false);
      renderCards(sortedConstruction, 'phase5LinesGrid', true);

      // 长名线路：把中文横向压缩到与英文实际文字宽度一致
      function textBoxWidth(el) {
        const range = document.createRange();
        range.selectNodeContents(el);
        const r = range.getBoundingClientRect();
        return r.width;
      }

      function alignLongNameText(card) {
        const cn = card.querySelector('.lb-cn');
        const en = card.querySelector('.lb-en');
        if (!cn || !en) return;

        cn.style.transform = 'none';
        cn.style.marginRight = '0';

        const natural = textBoxWidth(cn);
        const target = textBoxWidth(en);
        if (!natural || !target) return;

        const scale = target / natural;
        cn.style.transform = 'scaleX(' + scale.toFixed(4) + ')';
        cn.style.marginRight = (-(natural * (1 - scale))).toFixed(2) + 'px';
      }

      document.querySelectorAll('.line-card.is-long').forEach(alignLongNameText);
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function () {
          document.querySelectorAll('.line-card.is-long').forEach(alignLongNameText);
        });
      }
    })();

    // 实时时间
    function updateTime() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const month = now.getMonth() + 1;
      const day = now.getDate();
      const weekDays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
      const weekDay = weekDays[now.getDay()];
      document.getElementById('currentTime').textContent = 
        `${hours}:${minutes}:${seconds}，${month}月${day}日，${weekDay}`;
    }
    updateTime();
    setInterval(updateTime, 1000);

  </script>
</body>
</html>
