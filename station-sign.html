<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="theme.css">
<title>站名牌生成器</title>
<style>
@font-face { font-family: '黑体'; src: url('黑体.woff2') format('woff2'); font-display: swap; }
@font-face { font-family: '汉仪颜楷'; src: url('汉仪颜楷.woff2') format('woff2'); font-display: swap; }
@font-face { font-family: '方正舒体'; src: url('方正舒体.woff2') format('woff2'); font-display: swap; }
@font-face { font-family: '方正古隶体'; src: url('方正古隶体.woff2') format('woff2'); font-display: swap; }
@font-face { font-family: '华文隶书'; src: url('华文隶书.woff2') format('woff2'); font-display: swap; }
@font-face { font-family: '汉仪魏碑'; src: url('汉仪魏碑.woff2') format('woff2'); font-display: swap; }
@font-face { font-family: '思源宋体'; src: url('思源宋体.woff2') format('woff2'); font-display: swap; }
@font-face { font-family: '汉仪行楷'; src: url('汉仪行楷.woff2') format('woff2'); font-display: swap; }

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
html { background: #eef1f6; }
body {
  font-family: 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif;
  background: #eef1f6;
  display: flex;
  align-items: stretch;
  min-height: 100vh;
}

/* ===== 侧边栏 ===== */
.sidebar {
  width: 268px;
  flex-shrink: 0;
  background: #ffffff;
  border-right: 1px solid #e2e8f0;
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  overflow-y: auto;
}
.sidebar h1 {
  font-size: 17px;
  font-weight: 700;
  color: #1f2937;
  letter-spacing: 0.01em;
  line-height: 1.4;
  margin-bottom: 4px;
}
.field { display: flex; flex-direction: column; gap: 6px; }
.field label {
  font-size: 12px;
  font-weight: 500;
  color: #6b7280;
  letter-spacing: 0.03em;
}
.sidebar select, .sidebar button {
  width: 100%;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid #cbd5e1;
  background: #fff;
  font-size: 15px;
  color: #1f2937;
  font-family: inherit;
  outline: none;
  cursor: pointer;
  transition: border-color .15s, background .15s;
}
.sidebar select:focus { border-color: #1e3a8a; }
.sidebar button.primary {
  background: #1e3a8a; color: #fff; border-color: #1e3a8a; font-weight: 600;
}
.sidebar button.primary:hover { background: #1e40af; }
.sidebar button.ghost { background: #fff; color: #1e3a8a; font-weight: 600; }
.sidebar button.ghost:hover { background: #f1f5f9; }
.row-selects { display: flex; flex-direction: column; gap: 14px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btns button { flex: 1; }
.btns button.ghost { flex-basis: 100%; }   /* 桌面：下载 PNG 独占一行 */
.stage-box {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.stage-name { font-size: 14px; font-weight: 600; color: #1f2937; }
.stage-range { font-size: 13px; color: #1e3a8a; font-weight: 500; }
.stage-date { font-size: 12px; color: #6b7280; }
.stage-box .empty { color: #9ca3af; }

.meta {
  margin-top: auto;
  padding-top: 16px;
  border-top: 1px solid #e2e8f0;
  font-size: 12px;
  color: #6b7280;
  line-height: 1.9;
}
.meta b { color: #1f2937; font-weight: 600; }

/* ===== 站名牌区域 ===== */
.stage {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px;
  min-width: 0;
}
.sign {
  width: 648px;
  height: 432px;
  flex: 0 0 auto;        /* 关键：禁止被 flex 压缩，比例永远 3:2 */
  min-width: 648px;
  min-height: 432px;
  background: #fff;
  border: 2px solid #d5d9e0;
  border-radius: 40px;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  box-shadow: 0 12px 40px rgba(15,23,42,0.10);
  overflow: hidden;
  padding-bottom: 26px;
}
.sign .zh {
  font-size: 129px;
  line-height: 1;
  color: #1a1a1a;
  letter-spacing: 0.04em;
  text-align: center;
  white-space: nowrap;
}
.sign .en {
  font-family: Arial, Helvetica, sans-serif;
  font-size: 41px;
  font-weight: 700;
  color: #1a1a1a;
  margin-top: 12px;
  letter-spacing: 0.02em;
  text-align: center;
  white-space: nowrap;
}
.sign .band {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 41px;
  background: #00b050;
  border-radius: 0 0 38px 38px;
}
/* ===== 移动端：顶部菜单栏 + 侧栏折叠 + 站名牌独立缩放到容器宽 ===== */
.mobile-bar { display: none; }
.sign-wrap { display: flex; justify-content: center; align-items: flex-start; overflow: hidden; }

@media (max-width: 820px) {
  body { flex-direction: column; }

  .mobile-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: #fff;
    border-bottom: 1px solid #e2e8f0;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .mobile-bar button {
    padding: 7px 14px;
    border-radius: 9px;
    border: 1px solid #cbd5e1;
    background: #fff;
    color: #1e3a8a;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .mobile-bar .mobile-title {
    font-size: 15px;
    font-weight: 700;
    color: #1f2937;
  }

  /* 侧栏：两列网格 + 折叠 */
  .sidebar {
    width: 100%;
    border-right: none;
    max-height: 0;
    overflow: hidden;
    padding: 0 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    align-content: start;
    transition: max-height .28s ease, padding .28s ease;
  }
  .sidebar.open {
    max-height: 1400px;
    padding: 16px;
    border-bottom: 1px solid #e2e8f0;
  }
  .sidebar h1 { display: none; }

  /* 线路 + 站点并排 */
  .row-selects { display: contents; }

  /* 三按钮一排 */
  .btns { grid-column: 1 / -1; flex-wrap: nowrap; }
  .btns button.ghost { flex-basis: auto; }

  /* 所属时期 + 线路信息合并成一块 */
  .field-stage { grid-column: 1 / -1; }
  .field-stage .stage-box {
    border-radius: 10px 10px 0 0;
    border-bottom: none;
  }
  .sidebar .meta {
    grid-column: 1 / -1;
    margin-top: 0;
    border-top: none;
    padding: 8px 12px 10px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-top: none;
    border-radius: 0 0 10px 10px;
    font-size: 11.5px;
    line-height: 1.7;
  }

  .stage { padding: 16px 12px 28px; }
  .sign-wrap { width: 100%; justify-content: center; }
}
html, body { overflow-x: hidden; max-width: 100%; }
</style>

<body>
<header class="mobile-bar">
  <button id="menuBtn" onclick="toggleMenu()">菜单</button>
  <span class="mobile-title">站名牌生成器</span>

<aside class="sidebar" id="sidebar">

    <div class="field">

  <div class="btns">

    <button onclick="next()">下一站</button>
    <button class="ghost" onclick="downloadPNG()">下载 PNG</button>

  <div class="field field-stage">

  </div>

  <div class="meta">
    <div><b id="metaLine">—</b></div>
    <div>字体：<b id="metaFont">—</b></div>
    <div>英文：<b>Arial Bold</b></div>
  </div>
</aside>

<main class="stage">
  <div class="sign-wrap" id="signWrap">
    <div class="sign" id="sign">
    <div class="zh" id="signZh">太安</div>
    <div class="en" id="signEn">Tai'an</div>
      <div class="band" id="signBand"></div>
    </div>
  </div>
</main>

/* ===== 字体规则：按各期线路起止站划分；未列出的期段一律 fallback 黑体 ===== */
const FONT_SEGMENTS = {
  '3':  { font: '汉仪颜楷' },
  '8':  { font: '汉仪颜楷' },
  '20': { font: '汉仪颜楷' },
  '16': { font: '方正舒体' },
  '6z': { font: '方正古隶体' },
  '13': { font: '方正古隶体' },
  '14': { font: '华文隶书' },
  '12': { font: '汉仪魏碑' },
  '2': [
    { stations: ['莲塘口岸','仙湖路','莲塘'], font: '汉仪颜楷' }
  ],
  '5': [
    { stations: ['前海湾','桂湾','前湾','前湾公园','妈湾','铁路公园','荔湾','赤湾'], font: '思源宋体' },
    { stations: ['湖贝','东门','大剧院'], font: '汉仪行楷' }
  ],
  '7': [
    { stations: ['北大','深大丽湖'], font: '汉仪行楷' }
  ],
  '9': [
    { stations: ['前湾'], font: '汉仪行楷' }
  ],
  '11': [
    { stations: ['碧头','松岗','后亭','沙井','马安山','塘尾','桥头','福永'], font: '汉仪行楷' },
    { stations: ['福星','华强南','红岭南'], font: '汉仪行楷' }
  ]
};
const DEFAULT_FONT = '黑体';
function fontForStation(lid, station){
  const r = FONT_SEGMENTS[String(lid)];
  if (!r) return DEFAULT_FONT;
  if (Array.isArray(r)) {
    for (const seg of r) if (seg.stations.indexOf(station) >= 0) return seg.font;
    return DEFAULT_FONT;
  }
  return r.font || DEFAULT_FONT;
}

/* 判断某站属于哪一期：按站序区间匹配，重叠时取更晚开通的期 */
function stageOf(lid, station){
  const list = (DATA[lid] && DATA[lid].stations) || [];
  const stages = STAGES[String(lid)];
  if (!stages) return null;
  const idx = list.indexOf(station);
  if (idx < 0) return null;
  let hit = null;
  for (const st of stages) {
    const a = list.indexOf(st.from), b = list.indexOf(st.to);
    if (a < 0 || b < 0) continue;
    const lo = Math.min(a,b), hi = Math.max(a,b);
    if (idx >= lo && idx <= hi) {
      // 取开通日期更晚的那一期（解决交界站归属）
      if (!hit || st.date > hit.date) hit = st;
    }
  }
  return hit;
}

/* 部分线路只显示已开通区段 */
const STATION_LIMIT = { '20': 5 };

let DATA = {};
let IDX = 0;

function build(){
  DATA = {};
  /* 五期在建线路尚未开通，不纳入站名牌工具 */
  const WUQI = ['15','17','19','22','25','27','29'];
  getOperatingLinesEnhanced().forEach(item => {
    if (WUQI.indexOf(String(item.id)) >= 0) return;
    const d = getEnhancedLineData(item.id);
    if (!d || !d.stationList) return;
    let stations = d.stationList.slice();
    const lim = STATION_LIMIT[String(item.id)];
    if (lim) stations = stations.slice(0, lim);
    DATA[item.id] = { color: d.color, name: (d.name||'').replace('深圳地铁',''), stations: stations };
  });
  const sel = document.getElementById('lineSel');
  sel.innerHTML = '';
  const ids = Object.keys(DATA).sort((a,b) => {
    const na = parseInt(a,10), nb = parseInt(b,10);
    if (isNaN(na) && isNaN(nb)) return a.localeCompare(b);
    if (isNaN(na)) return 1; if (isNaN(nb)) return -1;
    return na - nb;
  });
  ids.forEach(id => {
    const o = document.createElement('option');
    o.value = id;
    o.textContent = DATA[id].name;
    sel.appendChild(o);
  });
  sel.value = DATA['5'] ? '5' : ids[0];
  onLine();
}

function onLine(){
  const lid = document.getElementById('lineSel').value;
  const sel = document.getElementById('stSel');
  sel.innerHTML = '';
  DATA[lid].stations.forEach((n, i) => {
    const o = document.createElement('option');
    o.value = i; o.textContent = n;
    sel.appendChild(o);
  });
  sel.value = 0;
  render();
}

function render(){
  const lid = document.getElementById('lineSel').value;
  const sel = document.getElementById('stSel');
  IDX = parseInt(sel.value) || 0;
  const name = DATA[lid].stations[IDX];
  const en = EN[name] || '';
  const zhEl = document.getElementById('signZh');
  const enEl = document.getElementById('signEn');
  const bandEl = document.getElementById('signBand');
  const font = fontForStation(lid, name);

  zhEl.textContent = name;
  zhEl.style.fontFamily = "'" + font + "', 'Microsoft YaHei', sans-serif";
  enEl.textContent = en || '—';
  enEl.style.color = en ? '#1a1a1a' : '#c0c4cc';
  bandEl.style.background = DATA[lid].color;

  // 所属时期
  const st = stageOf(lid, name);
  const elName = document.getElementById('stageName');
  const elRange = document.getElementById('stageRange');
  const elDate = document.getElementById('stageDate');
  if (st) {
    elName.textContent = st.name;
    elRange.textContent = st.from + ' → ' + st.to;
    elDate.textContent = '开通：' + st.date;
    elName.classList.remove('empty');
  } else {
    elName.textContent = '未标注';
    elName.classList.add('empty');
    elRange.textContent = '—';
    elDate.textContent = '—';
  }

  // 信息区：name 已含线路号，不再重复加前缀
  document.getElementById('metaLine').textContent = DATA[lid].name + '　' + DATA[lid].color;
  document.getElementById('metaFont').textContent = font;
}

function next(){
  const lid = document.getElementById('lineSel').value;
  if (IDX < DATA[lid].stations.length - 1) { document.getElementById('stSel').value = IDX + 1; render(); }
}
function prev(){
  if (IDX > 0) { document.getElementById('stSel').value = IDX - 1; render(); }
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
});

function downloadPNG(){
  const sign = document.getElementById('sign');
  const zh = document.getElementById('signZh');
  const en = document.getElementById('signEn');
  const band = document.getElementById('signBand');
  const W = sign.offsetWidth, H = sign.offsetHeight;
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '">' +
    '<foreignObject width="100%" height="100%">' +
    '<div xmlns="http://www.w3.org/1999/xhtml" style="width:' + W + 'px;height:' + H + 'px;background:#fff;border-radius:40px;position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;font-family:sans-serif;padding-bottom:26px;">' +
    '<div style="font-family:' + zh.style.fontFamily.replace(/"/g, "'") + ';font-size:152px;color:#1a1a1a;line-height:1;letter-spacing:0.04em;">' + zh.textContent + '</div>' +
    '<div style="font-family:Arial;font-size:41px;font-weight:700;color:#1a1a1a;margin-top:12px;letter-spacing:0.02em;">' + en.textContent + '</div>' +
    '<div style="position:absolute;left:0;right:0;bottom:0;height:41px;background:' + band.style.background + ';border-radius:0 0 38px 38px;"></div>' +
    '</div></foreignObject></svg>';
  const blob = new Blob([svg], {type:'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = W * 2; c.height = H * 2;
    const ctx = c.getContext('2d');
    ctx.scale(2,2);
    ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(url);
    const a = document.createElement('a');
    a.download = (zh.textContent || 'station') + '_站名牌.png';
    a.href = c.toDataURL('image/png');
    a.click();
  };
  img.src = url;
}

/* ===== 站名牌自适应：按容器宽度等比缩放牌子本身 ===== */
const SIGN_W = 648;
const SIGN_H = 432;
function fitSign(){
  const wrap = document.getElementById('signWrap');
  const sign = document.getElementById('sign');
  if (!wrap || !sign) return;
  const avail = wrap.clientWidth;
  const k = Math.min(1, avail / SIGN_W);
  sign.style.transformOrigin = 'top center';
  sign.style.transform = 'scale(' + k + ')';
  // 缩放后 sign 的布局尺寸仍是 648x432，用 wrap 高度收掉多余空白
  wrap.style.height = (SIGN_H * k) + 'px';
  wrap.style.overflow = 'hidden';
}
function toggleMenu(){
  const sb = document.getElementById('sidebar');
  const btn = document.getElementById('menuBtn');
  const open = sb.classList.toggle('open');
  btn.textContent = open ? '收起' : '菜单';
}
window.addEventListener('resize', fitSign);
window.addEventListener('orientationchange', () => setTimeout(fitSign, 150));

build();
fitSign();
