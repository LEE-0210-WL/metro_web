<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="theme.css">
<title>站名牌生成器</title>
<style>
@font-face { font-family: '黑体'; src: url('黑体.woff2') format('woff2'); font-display: swap; }
@font-face { font-family: '汉仪颜楷'; src: url('汉仪颜楷.woff2') format('woff2'); font-display: swap; }
@font-face { font-family: '方正舒体'; src: url('方正舒体.woff2') format('woff2'); font-display: swap; }
@font-face { font-family: '方正古隶体'; src: url('方正古隶体.woff2') format('woff2'); font-display: swap; }
@font-face { font-family: '华文隶书'; src: url('华文隶书.woff2') format('woff2'); font-display: swap; }
@font-face { font-family: '汉仪魏碑'; src: url('汉仪魏碑.woff2') format('woff2'); font-display: swap; }
@font-face { font-family: '思源宋体'; src: url('思源宋体.woff2') format('woff2'); font-display: swap; }
@font-face { font-family: '汉仪行楷'; src: url('汉仪行楷.woff2') format('woff2'); font-display: swap; }

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
html { background: #eef1f6; }
body {
  font-family: 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif;
  background: #eef1f6;
  display: flex;
  align-items: stretch;
  width: 916px;          /* 侧栏 268 + 牌子 648 */
  min-height: 100vh;
  transform-origin: top left;
  will-change: transform;
}

/* ===== 侧边栏 ===== */
.sidebar {
  width: 268px;
  flex-shrink: 0;
  background: #ffffff;
  border-right: 1px solid #e2e8f0;
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  overflow-y: auto;
}
.sidebar h1 {
  font-size: 17px;
  font-weight: 700;
  color: #1f2937;
  letter-spacing: 0.01em;
  line-height: 1.4;
  margin-bottom: 4px;
}
.field { display: flex; flex-direction: column; gap: 6px; }
.field label {
  font-size: 12px;
  font-weight: 500;
  color: #6b7280;
  letter-spacing: 0.03em;
}
.sidebar select, .sidebar button {
  width: 100%;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid #cbd5e1;
  background: #fff;
  font-size: 15px;
  color: #1f2937;
  font-family: inherit;
  outline: none;
  cursor: pointer;
  transition: border-color .15s, background .15s;
}
.sidebar select:focus { border-color: #1e3a8a; }
.sidebar button.primary {
  background: #1e3a8a; color: #fff; border-color: #1e3a8a; font-weight: 600;
}
.sidebar button.primary:hover { background: #1e40af; }
.sidebar button.ghost { background: #fff; color: #1e3a8a; font-weight: 600; }
.sidebar button.ghost:hover { background: #f1f5f9; }
.btns { display: flex; gap: 8px; }
.btns button { flex: 1; }
.meta {
  margin-top: auto;
  padding-top: 16px;
  border-top: 1px solid #e2e8f0;
  font-size: 12px;
  color: #6b7280;
  line-height: 1.9;
}
.meta b { color: #1f2937; font-weight: 600; }

/* ===== 站名牌区域 ===== */
.stage {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px;
  min-width: 0;
}
.sign {
  width: 648px;
  height: 432px;
  background: #fff;
  border: 2px solid #d5d9e0;
  border-radius: 40px;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  box-shadow: 0 12px 40px rgba(15,23,42,0.10);
  overflow: hidden;
  padding-bottom: 26px;
}
.sign .zh {
  font-size: 129px;
  line-height: 1;
  color: #1a1a1a;
  letter-spacing: 0.04em;
  text-align: center;
  white-space: nowrap;
}
.sign .en {
  font-family: Arial, Helvetica, sans-serif;
  font-size: 41px;
  font-weight: 700;
  color: #1a1a1a;
  margin-top: 12px;
  letter-spacing: 0.02em;
  text-align: center;
  white-space: nowrap;
}
.sign .band {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 41px;
  background: #00b050;
  border-radius: 0 0 38px 38px;
}
/* 小屏不再切换成竖向布局：由 JS 对整个 body 等比缩放，保持横向比例 */
</style>
</head>

  </div>

  <div class="field">
    <label>站点</label>
    <select id="stSel" onchange="render()"></select>

  <div class="btns">
    <button onclick="prev()">上一站</button>
    <button onclick="next()">下一站</button>

  <button class="ghost" onclick="downloadPNG()">下载 PNG</button>

  <div class="meta">
    <div><b id="metaLine">—</b></div>
    <div>字体：<b id="metaFont">—</b></div>
    <div>英文：<b>Arial Bold</b></div>
  </div>
</aside>

<main class="stage">
  <div class="sign" id="sign">
    <div class="zh" id="signZh">太安</div>
    <div class="en" id="signEn">Tai'an</div>
    <div class="band" id="signBand"></div>

</main>

/* ===== 字体规则：按各期线路起止站划分；未列出的期段一律 fallback 黑体 ===== */
const FONT_SEGMENTS = {
  '3':  { font: '汉仪颜楷' },
  '8':  { font: '汉仪颜楷' },
  '20': { font: '汉仪颜楷' },
  '16': { font: '方正舒体' },
  '6z': { font: '方正古隶体' },
  '13': { font: '方正古隶体' },
  '14': { font: '华文隶书' },
  '12': { font: '汉仪魏碑' },
  '2': [
    { stations: ['新秀','莲塘口岸','仙湖路','莲塘'], font: '汉仪颜楷' }
  ],
  '5': [
    { stations: ['赤湾','荔湾','铁路公园','妈湾','前湾公园','前湾','桂湾'], font: '思源宋体' },
    { stations: ['湖贝','东门','大剧院'], font: '汉仪行楷' }
  ],
  '7': [
    { stations: ['西丽湖','北大','深大丽湖'], font: '汉仪行楷' }
  ],
  '9': [
    { stations: ['前湾'], font: '汉仪行楷' }
  ],
  '11': [
    { stations: ['碧头','松岗','后亭','沙井','马安山','塘尾','桥头','福永'], font: '汉仪行楷' },
    { stations: ['福星','华强南','红岭南'], font: '汉仪行楷' }
  ]
};
const DEFAULT_FONT = '黑体';
function fontForStation(lid, station){
  const r = FONT_SEGMENTS[String(lid)];
  if (!r) return DEFAULT_FONT;
  if (Array.isArray(r)) {
    for (const seg of r) if (seg.stations.indexOf(station) >= 0) return seg.font;
    return DEFAULT_FONT;
  }
  return r.font || DEFAULT_FONT;
}

/* 部分线路只显示已开通区段 */
const STATION_LIMIT = { '20': 5 };

let DATA = {};
let IDX = 0;

function build(){
  DATA = {};
  /* 五期在建线路尚未开通，不纳入站名牌工具 */
  const WUQI = ['15','17','19','22','25','27','29'];
  getOperatingLinesEnhanced().forEach(item => {
    if (WUQI.indexOf(String(item.id)) >= 0) return;
    const d = getEnhancedLineData(item.id);
    if (!d || !d.stationList) return;
    let stations = d.stationList.slice();
    const lim = STATION_LIMIT[String(item.id)];
    if (lim) stations = stations.slice(0, lim);
    DATA[item.id] = { color: d.color, name: (d.name||'').replace('深圳地铁',''), stations: stations };
  });
  const sel = document.getElementById('lineSel');
  sel.innerHTML = '';
  const ids = Object.keys(DATA).sort((a,b) => {
    const na = parseInt(a,10), nb = parseInt(b,10);
    if (isNaN(na) && isNaN(nb)) return a.localeCompare(b);
    if (isNaN(na)) return 1; if (isNaN(nb)) return -1;
    return na - nb;
  });
  ids.forEach(id => {
    const o = document.createElement('option');
    o.value = id;
    o.textContent = DATA[id].name;
    sel.appendChild(o);
  });
  sel.value = DATA['5'] ? '5' : ids[0];
  onLine();
}

function onLine(){
  const lid = document.getElementById('lineSel').value;
  const sel = document.getElementById('stSel');
  sel.innerHTML = '';
  DATA[lid].stations.forEach((n, i) => {
    const o = document.createElement('option');
    o.value = i; o.textContent = n;
    sel.appendChild(o);
  });
  sel.value = 0;
  render();
}

function render(){
  const lid = document.getElementById('lineSel').value;
  const sel = document.getElementById('stSel');
  IDX = parseInt(sel.value) || 0;
  const name = DATA[lid].stations[IDX];
  const en = EN[name] || '';
  const zhEl = document.getElementById('signZh');
  const enEl = document.getElementById('signEn');
  const bandEl = document.getElementById('signBand');
  const font = fontForStation(lid, name);

  zhEl.textContent = name;
  zhEl.style.fontFamily = "'" + font + "', 'Microsoft YaHei', sans-serif";
  enEl.textContent = en || '—';
  enEl.style.color = en ? '#1a1a1a' : '#c0c4cc';
  bandEl.style.background = DATA[lid].color;

  // 信息区：name 已含线路号，不再重复加前缀
  document.getElementById('metaLine').textContent = DATA[lid].name + '　' + DATA[lid].color;
  document.getElementById('metaFont').textContent = font;
}

function next(){
  const lid = document.getElementById('lineSel').value;
  if (IDX < DATA[lid].stations.length - 1) { document.getElementById('stSel').value = IDX + 1; render(); }
}
function prev(){
  if (IDX > 0) { document.getElementById('stSel').value = IDX - 1; render(); }
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
});

function downloadPNG(){
  const sign = document.getElementById('sign');
  const zh = document.getElementById('signZh');
  const en = document.getElementById('signEn');
  const band = document.getElementById('signBand');
  const W = sign.offsetWidth, H = sign.offsetHeight;
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '">' +
    '<foreignObject width="100%" height="100%">' +
    '<div xmlns="http://www.w3.org/1999/xhtml" style="width:' + W + 'px;height:' + H + 'px;background:#fff;border-radius:40px;position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;font-family:sans-serif;padding-bottom:26px;">' +
    '<div style="font-family:' + zh.style.fontFamily.replace(/"/g, "'") + ';font-size:152px;color:#1a1a1a;line-height:1;letter-spacing:0.04em;">' + zh.textContent + '</div>' +
    '<div style="font-family:Arial;font-size:41px;font-weight:700;color:#1a1a1a;margin-top:12px;letter-spacing:0.02em;">' + en.textContent + '</div>' +
    '<div style="position:absolute;left:0;right:0;bottom:0;height:41px;background:' + band.style.background + ';border-radius:0 0 38px 38px;"></div>' +
    '</div></foreignObject></svg>';
  const blob = new Blob([svg], {type:'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = W * 2; c.height = H * 2;
    const ctx = c.getContext('2d');
    ctx.scale(2,2);
    ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(url);
    const a = document.createElement('a');
    a.download = (zh.textContent || 'station') + '_站名牌.png';
    a.href = c.toDataURL('image/png');
    a.click();
  };
  img.src = url;
}

/* ===== 整体等比缩放：保持电脑上的横向比例，只缩小 ===== */
const BASE_W = 916;
const BASE_H_MAX = 700;
function fitStage(){
  const availW = window.innerWidth - 8;
  const availH = window.innerHeight - 8;
  const k = Math.min(1, availW / BASE_W, availH / Math.max(BASE_H_MAX, document.body.scrollHeight));
  document.body.style.transform = 'scale(' + k + ')';
  // 让 html 高度跟随缩放后的实际高度，避免出现多余滚动空白
  document.documentElement.style.height = 'auto';
}
window.addEventListener('resize', fitStage);
window.addEventListener('orientationchange', () => setTimeout(fitStage, 150));
build();
fitStage();
</script>
