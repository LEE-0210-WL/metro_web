<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="theme.css">
  <title>资料 - 走进新天地·Railway</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font);
      background-color: #f5f5f5;
      color: #333;
      line-height: 1.6;
    }.logo { width: 36px; height: 36px; border-radius: 50%; overflow: hidden; }
    .logo img { width: 100%; height: 100%; object-fit: cover; }
    .site-name { font-size: 16px; font-weight: 600; color: white; }
    .current-time { font-size: 14px; color: #ffffff; font-weight: 500; }.page-title {  font-size: 28px;
  font-weight: 700;
  color: #111827;
  margin-bottom: 8px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;}
    .page-subtitle {  font-size: 16px;
  color: #6b7280;
  margin-bottom: 32px;}
    /* ===== 目录式资料列表 ===== */
    .materials-grid {
      counter-reset: mat;
      border-top: 1px solid var(--c-border);
    }
    .material-card {
      position: relative;
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 13px 2px;
      text-decoration: none;
      color: var(--c-text);
      border-bottom: 1px solid var(--c-border);
      counter-increment: mat;
      transition: color .16s ease, transform .16s ease;
    }
    .material-card::before {
      content: counter(mat, decimal-leading-zero);
      font-family: var(--font-num);
      font-size: 13px;
      color: var(--c-text-3);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
      min-width: 22px;
      transition: color .16s ease;
    }
    .material-card::after {
      content: '';
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 2px;
      background: var(--c-primary);
      border-radius: 1px;
      transform: scaleX(0);
      transform-origin: left center;
      transition: transform .22s cubic-bezier(.4,0,.2,1);
    }
    .material-card:hover {
      color: var(--c-primary);
      transform: translateX(3px) scale(1.012);
      transform-origin: left center;
    }
    .material-card:hover::after { transform: scaleX(1); }
    .material-card:hover::before { color: var(--c-primary); }
    .material-card:hover .material-title { font-weight: 600; }

    .material-content { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px; }
    .material-title {
      font-size: 14px; font-weight: 400; color: inherit;
      white-space: nowrap; flex-shrink: 0;
      transition: font-weight .12s ease;
    }
    .material-description {
      font-size: 12.5px; color: var(--c-text-3);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      flex: 1; min-width: 0; margin: 0;
    }
    .material-meta {
      display: flex; align-items: baseline; gap: 10px;
      margin-left: auto; flex-shrink: 0;
    }
    .material-type {
      font-size: 12px; color: var(--c-text-2);
      background: var(--c-surface-2); padding: 1px 8px;
      border-radius: var(--r-sm); font-weight: 400;
    }
    .material-size, .material-date {
      font-size: 12.5px; color: var(--c-text-3);
      font-variant-numeric: tabular-nums;
    }
    .type-map, .type-history, .type-train, .type-announcement,
    .type-article, .type-link, .type-wiki { background: var(--c-surface-2); color: var(--c-text-2); }
    .info-box {
      background: #f3e8ff; border-radius: var(--r-lg);
      padding: 16px 20px; margin-top: 32px;
    }
    .info-box p { color: #7c3aed; font-size: 14px; text-align: center; }
    @media (max-width: 768px) {.current-time { display: none; }
      .container {
        margin-top: 20px;
      }
      .materials-grid { grid-template-columns: 1fr; }
      .page-title { font-size: 22px; }
    }
  

    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px; background: #111827; color: white;
      text-decoration: none; border-radius: var(--r-sm);
      font-weight: 500; font-size: 13px;
      transition: background 0.3s ease;
      flex-shrink: 0; white-space: nowrap;
    }
    .back-link:hover { background: #374151; }
</style>
<link rel="stylesheet" href="page-header.css">
<link rel="stylesheet" href="layout.css">
<link rel="stylesheet" href="components.css">
</head>
<body>
  <script src="navbar.js"></script>
  <main class="container">
    <h1 class="page-title">
      <span>收集的资料</span>
      <a href="index" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        返回首页
      </a>
    </h1>
    <p class="page-subtitle">轨道交通相关资源整理</p>
    <div class="materials-grid" id="materialsGrid">
      <a href="passenger-flow" class="material-card">
        <div class="material-content">
          <h3 class="material-title">深圳地铁客流</h3>
          <p class="material-description">各线路每日客流量统计（不含港铁4号线、13号线）</p>
          <div class="material-meta">
            <span class="material-type type-article">数据</span>
            <span class="material-date">2026.9</span>
          </div>
        </div>
      </a>
    </div>
    <div class="info-box">
      <p>资料持续更新中，如有需要可联系作者获取更多资源</p>
    </div>
  </main>

  <script>
    const materials = [
      { id: '1', title: '深圳地铁线路图（2026版）', description: '包含所有运营线路的最新官方线路图，提供深圳地铁版和港铁版', type: 'map', typeLabel: '线路图', size: '2.4 MB', date: '2026.6', url: 'map' },
      { id: '2', title: '深圳地铁建设历程', description: '从2004年至今的线路开通时间线', type: 'history', typeLabel: '历史', date: '2026.6', url: 'history' },
      { id: '2.5', title: '线路色号', description: '深圳地铁各线路标准色 HEX / RGB 对照表', type: 'wiki', typeLabel: '色号', date: '2026.6', url: 'line-colors' },
      { id: '3', title: '各线路车辆编组信息', description: '车型、编组、制造商等资料', type: 'train', typeLabel: '车辆', date: '2026.6', url: 'trains' },
      { id: '4', title: '轨道交通配线图', description: '大佬绘制的大湾区及深圳轨道交通配线资料', type: 'map', typeLabel: '配线图', date: '2026.7', url: 'intercity-distribution-map' },
      { id: '5', title: '已遇到车辆记录', description: '本人实际乘坐/拍摄到的列车编号记录', type: 'train', typeLabel: '车辆', date: '2026.7', url: 'encountered' },
      { id: '6', title: '线网吊板字体收集', description: '深圳地铁各线路站名吊板/大字壁字体汇总与预览', type: 'wiki', typeLabel: '字体', date: '2026.7', url: 'fonts' },
      { id: '7', title: '深圳地铁官方网站', description: '深圳市地铁集团官网', type: 'link', typeLabel: '链接', date: '2025.6', url: 'https://www.szmc.net' },
      { id: '8', title: '港铁深圳官方网站', description: '4，13号线运营商官网', type: 'link', typeLabel: '链接', date: '2025.6', url: 'https://www.mtrsz.com.cn' }
    ];

    

    const materialsGrid = document.getElementById('materialsGrid');
    materials.forEach(material => {
      const card = document.createElement('a');
      card.className = 'material-card';
      card.href = material.url;
      card.target = material.type === 'link' ? '_blank' : '_self';

      card.innerHTML = `
        <div class="material-content">
          <h3 class="material-title">${material.title}</h3>
          <p class="material-description">${material.description}</p>
          <div class="material-meta">
            <span class="material-type type-${material.type}">${material.typeLabel}</span>
            ${material.size ? `<span class="material-size">${material.size}</span>` : ''}
            <span class="material-date">${material.date}</span>
          </div>
        </div>
      `;
      materialsGrid.appendChild(card);
    });

    function updateTime() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const month = now.getMonth() + 1;
      const day = now.getDate();
      const weekDays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
      const weekDay = weekDays[now.getDay()];
      const el = document.getElementById('currentTime');
      if (el) el.textContent = `${hours}:${minutes}:${seconds}，${month}月${day}日，${weekDay}`;
    }
    updateTime();
    setInterval(updateTime, 1000);

  </script>
</body>
</html>
