<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>已遇到车辆 - 走进新天地·Railway</title>
  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/harmonyos-sans">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'HarmonyOS Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f5f5f5;
      color: #333;
      line-height: 1.6;
    }

    /* 卡片样式（与 trains.html 一致） */
    .container {
      width: min(90%, 1200px);
      margin: 20px auto 40px;
      padding: 0 20px;
    }

    .page-title {
      font-size: 28px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 8px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
    }

    .page-subtitle {
      font-size: 16px;
      color: #6b7280;
      margin-bottom: 32px;
    }

    .lines-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .line-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .line-header {
      padding: 16px 16px;
      color: white;
      font-weight: 600;
      font-size: 20px;
    }

    .line-content {
      padding: 16px 20px;
    }

    .train-item {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      padding: 10px 0;
      border-bottom: 1px solid #e5e7eb;
      font-size: 15px;
      gap: 2px 6px;
    }

    .train-item:last-child {
      border-bottom: none;
    }

    .train-index {
      font-weight: 600;
      color: #6b7280;
      min-width: 32px;
      flex-shrink: 0;
    }

    .train-model {
      font-weight: 500;
      color: #111827;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .train-divider {
      color: #d1d5db;
      flex-shrink: 0;
    }

    .train-manufacturer {
      font-size: 14px;
      color: #6b7280;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .train-range {
      color: #6b7280;
      flex-shrink: 0;
      white-space: nowrap;
    }

    /* 已遇到车号组（含对勾和车号） */
    .train-encountered-group {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex: 1 1 auto;
      min-width: 60px;
      flex-wrap: wrap;
    }

    .train-check {
      color: #10b981;
      font-weight: 600;
      flex-shrink: 0;
    }

    .train-encountered {
      color: #374151;
      font-weight: 500;
      word-break: break-word;
      line-height: 1.4;
      flex: 1 1 auto;
    }

    /* 线路颜色 */
    .line-1 { background: #01AF55; }
    .line-2 { background: #B95800; }
    .line-3 { background: #00A9DF; color: #000; }
    .line-4 { background: #D42E0F; }
    .line-5 { background: #9E4DAA; }
    .line-6 { background: #01C4B7; color: #000; }
    .line-6z { background: #027776; }
    .line-7 { background: #0131AC; }
    .line-8 { background: #B95800; }
    .line-9 { background: #896B70; }
    .line-10 { background: #F67599; color: #000; }
    .line-11 { background: #672146; }
    .line-12 { background: #A092B2; color: #000; }
    .line-13 { background: #F6AD2D; color: #000; }
    .line-14 { background: #F4CB67; color: #000; }
    .line-15 { background: #86BE00; }
    .line-16 { background: #181BA5; }
    .line-17 { background: #D2C0CD; color: #000; }
    .line-19 { background: #BA16A4; }
    .line-20 { background: #87DBDF; color: #000; }
    .line-22 { background: #F5E524; color: #000; }
    .line-25 { background: #FDAD76; color: #000; }
    .line-27 { background: #4E8D8E; }
    .line-29 { background: #92D6AC; color: #000; }
    .line-32 { background: #735128; }

    /* 返回按钮 */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: #111827;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 500;
      font-size: 13px;
      transition: background 0.3s ease;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .back-link:hover {
      background: #374151;
    }

    /* 响应式设计 */
    @media (max-width: 768px) {
      .container {
        margin-top: 20px;
        padding: 0 16px;
    width: min(90%, 1200px);
}
      .page-title {
        font-size: 22px;
      }
      .lines-grid {
        grid-template-columns: 1fr;
      }
      .train-item {
        gap: 2px 6px;
      }
      /* 手机端：已遇到车号组整体换行，且缩进对齐 */
      .train-encountered-group {
        flex-basis: 100%;
        padding-left: 38px;
      }
      .train-manufacturer {
        font-size: 13px;
      }
      .train-range {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

    // 生成卡片

    const numberedCircle = index => String.fromCharCode(0x2460 + index);

    encounteredData.forEach(line => {
      const card = document.createElement('div');
      card.className = 'line-card';

      const header = document.createElement('div');
      header.className = `line-header ${line.lineClass}`;
      header.textContent = line.line;
      card.appendChild(header);

      const content = document.createElement('div');
      content.className = 'line-content';

      line.trains.forEach((train, idx) => {
        const item = document.createElement('div');
        item.className = 'train-item';

        // 序号
        const idxSpan = document.createElement('span');
        idxSpan.className = 'train-index';
        idxSpan.textContent = numberedCircle(idx);

        // 车型
        const modelSpan = document.createElement('span');
        modelSpan.className = 'train-model';
        modelSpan.innerHTML = train.model;

        // 分割线
        const div1 = document.createElement('span');
        div1.className = 'train-divider';
        div1.textContent = '丨';

        encounteredSpan.textContent = train.encounteredNumbers;

        encounteredGroup.appendChild(encounteredSpan);

        item.appendChild(modelSpan);
        item.appendChild(div1);
        item.appendChild(manuSpan);
        item.appendChild(div2);
        item.appendChild(rangeSpan);
