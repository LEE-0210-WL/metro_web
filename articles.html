<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="theme.css">
  <title>图文 - 走进新天地·Railway</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: var(--font);
      background-color: #f5f5f5;
      color: #333;
      line-height: 1.6;
    }.logo {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      overflow: hidden;
    }
    
    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .site-name {
      font-size: 16px;
      font-weight: 600;
      color: white;
    }
    
    .current-time {
      font-size: 14px;
      color: #ffffff;
      font-weight: 500;
    }.container {
      min-height: calc(100vh - 120px);
    }
    
    .page-title {
      font-size: 28px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 8px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
    }
    
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: #111827;
      color: white;
      text-decoration: none;
      border-radius: var(--r-sm);
      font-weight: 500;
      font-size: 13px;
      transition: background 0.3s ease;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .back-link:hover {
      background: #374151;
    }
    .back-link svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }
    
    .page-subtitle {
      font-size: 16px;
      color: #6b7280;
      margin-bottom: 32px;
    }
    
    /* 瀑布流卡片墙：宽屏两列、窄屏单列，每张卡片按自身内容决定高度，
       不再强制等高（grid-auto-rows 配合 JS 计算 span 实现真瀑布流） */
    .articles-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-auto-rows: 8px;
      column-gap: 24px;
      row-gap: 0;
      align-items: start;
    }

    .article-card {
      /* 每张卡片高度由内容决定；grid-row-end 的 span 由 JS 按实际高度算 */
      display: flex;
      flex-direction: column;
      background: white;
      border-radius: var(--r-xl);
      overflow: hidden;
      box-shadow: var(--sh-md);
      transition: all 0.3s ease;
      text-decoration: none;
      color: inherit;
      margin-bottom: 24px;
      align-self: start;
    }

    /* 没配图的卡片：内容区多给一点上内边距，视觉上不空 */
    .article-card.no-cover .article-content {
      padding-top: 26px;
    }
    
    .article-card:hover {
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    }
    
    .carousel {
      position: relative;
      width: 100%;
      /* 封面统一按「标准图文封面」比例 3.412:1（图文2-1.jpg 9591×2811） */
      aspect-ratio: 9591 / 2811;
      overflow: hidden;
      background: #e5e7eb;
    }
    
    .carousel-images {
      display: flex;
      transition: transform 0.5s ease;
      height: 100%;
    }
    
    .carousel-image {
      min-width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .carousel-nav {
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0);
    }
    
    /* 指示条样式与首页 banner 轮播保持一致 */
    .carousel-dot {
      width: 20px;
      height: 4px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.35);
      cursor: pointer;
      transition: all 0.3s ease;
      border: none;
      padding: 0;
    }
    
    .carousel-dot.active {
      background: rgba(255, 255, 255, 0.9);
      width: 28px;
      height: 6px;
    }
    
    .carousel-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.5);
      border: none;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }
    
    .carousel-arrow:hover {
      background: rgba(0, 0, 0, 0.7);
    }
    
    .carousel-arrow.prev {
      left: 12px;
    }
    
    .carousel-arrow.next {
      right: 12px;
    }
    
    .article-content {
      padding: 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    
    .article-title {
      font-size: 20px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 8px;
    }
    
    .article-subtitle {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 16px;
    }
    
    .article-meta {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
      font-size: 13px;
      color: var(--c-text-3);
    }
    
    .article-meta span {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    .article-body {
      font-size: 15px;
      color: #4b5563;
      line-height: 1.8;
    }
    
    .article-body p {
      margin-bottom: 12px;
    }
    
    .read-more {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: auto;      /* 配合 .article-content 的 flex 列，压到卡片底部 */
      padding-top: 16px;
      color: #2563eb;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }
    
    .read-more:hover {
      text-decoration: underline;
    }
    
    .back-to-top {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 50px;
      height: 50px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
      transition: all 0.3s ease;
      opacity: 0;
      visibility: hidden;
      z-index: 999;
    }
    
    .back-to-top.visible {
      opacity: 1;
      visibility: visible;
    }
    
    .back-to-top:hover {
      background: #1d4ed8;
      transform: translateY(-4px);
    }
    
    @media (max-width: 768px) {
      /* 手机上双列太窄，回落单列 */
      .articles-list {
        grid-template-columns: 1fr;
        grid-auto-rows: auto;   /* 单列时取消 8px 行高，否则卡片会溢出重叠 */
        column-gap: 0;
        row-gap: 0;
      }.current-time {
        display: none;
      }
      .container {
        margin-top: 20px;
      }
      .page-title {
        font-size: 22px;
        flex-wrap: wrap;
      }
      .carousel {
        height: auto;   /* 保持 3.412:1 标准封面比例，不覆盖 aspect-ratio */
      }
      .back-to-top {
        bottom: 20px;
        right: 20px;
        width: 44px;
        height: 44px;
      }
    }
  </style>
<link rel="stylesheet" href="page-header.css">
<link rel="stylesheet" href="layout.css">
<link rel="stylesheet" href="components.css">
</head>
<body>
  <script src="navbar.js"></script>

  <main class="container">
    <h1 class="page-title">
      <span>图文</span>
      <a href="index" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        返回首页
      </a>
    </h1>
    
    <p class="page-subtitle">轨道交通相关图文内容</p>
    
    <div class="articles-list" id="articlesIndex"></div>
  </main>

  <script>
    // 实时时间
    function updateTime() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const month = now.getMonth() + 1;
      const day = now.getDate();
      const weekDays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
      const weekDay = weekDays[now.getDay()];
      const el = document.getElementById('currentTime');
      if (el) el.textContent = `${hours}:${minutes}:${seconds}，${month}月${day}日，${weekDay}`;
    }
    updateTime();
    setInterval(updateTime, 1000);

  
    // 返回顶部按钮
    const backToTopBtn = document.getElementById('backToTop');
    if (backToTopBtn) {
      window.addEventListener('scroll', () => {
        if (window.scrollY > 300) {
          backToTopBtn.classList.add('visible');
        } else {
          backToTopBtn.classList.remove('visible');
        }
      });
    }
  </script>
  <script src="article-nav.js"></script>
  <button class="back-to-top" id="backToTop" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="19" x2="12" y2="5"></line>
      <polyline points="5 12 12 5 19 12"></polyline>
    </svg>
  </button>
</body>
</html>
